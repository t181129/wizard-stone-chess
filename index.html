<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>魔法使いの石像チェス</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:#eee;font-family:Georgia,'Yu Mincho',serif}#three{position:fixed;inset:0}.load{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle,#241d16,#050504 72%);color:#dfc27c}.loader{width:min(360px,82vw);text-align:center}.title{font-size:22px;letter-spacing:.1em}.bar{height:8px;margin:18px 0 9px;border:1px solid #7d6540;border-radius:8px;overflow:hidden;background:#15110d}.bar i{display:block;width:0;height:100%;background:#d2b36d;transition:width .2s}.pct{font-size:14px}.top{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 4px 12px #000;pointer-events:none;white-space:nowrap}.top h1{margin:0;color:#e5d09b;font-size:clamp(20px,4vw,38px);letter-spacing:.1em}.top p{margin:3px;color:#bdb09a;font-size:12px}.panel{position:fixed;z-index:6;left:10px;top:10px;width:220px;padding:10px;background:#0d0c0be8;border:1px solid #735e3d;border-radius:10px;box-shadow:0 12px 35px #000b;backdrop-filter:blur(5px)}.info{left:auto;right:10px}.status{text-align:center;color:#ead39b;font-weight:bold;font-size:17px;min-height:23px}button,select{width:100%;margin:4px 0;padding:8px;border:1px solid #735e3d;border-radius:7px;background:#211b14;color:#eee;font:inherit}.hint{font:11px/1.45 system-ui;color:#aaa}.pieceInfo{font:13px/1.7 system-ui;color:#ddd0b2}.pieceInfo b{color:#f0d58c}.victory{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:radial-gradient(circle,#d9b65b22,#050504d9 62%);backdrop-filter:blur(3px)}.victory.show{display:grid}.victoryBox{width:min(430px,86vw);padding:28px;text-align:center;border:1px solid #b99b5a;border-radius:16px;background:#0b0907ee;box-shadow:0 0 60px #d8b65a55,0 20px 60px #000}.victoryBox h2{margin:0 0 8px;font-size:46px;color:#f0d58c;text-shadow:0 0 20px #d9b65a}.victoryBox p{margin:8px;color:#ddd0b2}@media(max-width:700px){.panel{width:154px;top:auto;bottom:8px;left:8px;padding:7px}.info{left:auto;right:8px}.hint,.top p{display:none}.top h1{font-size:20px}button,select{padding:7px}.pieceInfo{font-size:11px;line-height:1.55}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="load" class="load"><div class="loader"><div class="title">巨大な石像兵士を召喚中</div><div class="bar"><i id="bar"></i></div><div id="pct">0%</div></div></div><div id="three"></div><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>巨大な彫刻兵士が古代の大広間で戦う</p></div><div class="panel"><div id="status" class="status">読み込み中…</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">白い石像をタップ → 青い場所へ移動。盤面をドラッグすると視点を回転。</div></div><div class="panel info"><b>タップした駒</b><div id="pieceInfo" class="pieceInfo">駒をタップすると<br>ここに情報が表示されます。</div></div><div id="victory" class="victory"><div class="victoryBox"><h2 id="vt">⚔ 勝利！</h2><p id="vx">チェックメイト</p><button id="again">もう一度対局</button></div></div><script type="module">import*as THREE from'three';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';import{Chess}from'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';const $=id=>document.getElementById(id),root=$('three'),bar=$('bar'),pct=$('pct');let scene,camera,renderer,controls,ray,mouse,game=new Chess,pcs=new Map,tiles=[],markers=[],selected=null,busy=false,soundOn=true,audio,burst=[];const names={p:'ポーン',n:'ナイト',b:'ビショップ',r:'ルーク',q:'クイーン',k:'キング'};function load(n){bar.style.width=n+'%';pct.textContent=n+'%'}function mat(c){const dark=c==='b',cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d'),v=dark?48:166;x.fillStyle=`rgb(${v},${v+2},${v+5})`;x.fillRect(0,0,256,256);const im=x.getImageData(0,0,256,256);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*18;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);return new THREE.MeshStandardMaterial({color:dark?0x383a3c:0xd6d0c4,map:new THREE.CanvasTexture(cv),roughness:1,metalness:0})}const mw=mat('w'),mb=mat('b');function add(g,geo,m,x=0,y=0,z=0){const q=new THREE.Mesh(geo,m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;g.add(q);return q}function cyl(g,a,b,h,y,m,s=32){return add(g,new THREE.CylinderGeometry(a,b,h,s),m,0,y)}function lathe(g,p,y,m){return add(g,new THREE.LatheGeometry(p,40),m,0,y)}function sph(g,r,y,m){return add(g,new THREE.SphereGeometry(r,28,20),m,0,y)}function box(g,w,h,d,x,y,z,m){return add(g,new THREE.BoxGeometry(w,h,d),m,x,y,z)}function face(g,m,r,y){sph(g,r,y,m);for(const s of[-1,1]){const eye=sph(g,.038,y+.01,m);eye.position.set(s*r*.34,y+.01,r*.91);eye.scale.set(.7,.7,.2);const brow=box(g,.14,.028,.035,s*r*.34,y+.075,r*.9,m);brow.rotation.z=s*.12}const nose=box(g,.06,.15,.08,0,y-.015,r*.93,m);nose.rotation.x=.12;box(g,.16,.025,.035,0,y-.13,r*.9,m)}function base(g,m){cyl(g,.8,.99,.24,.12,m);cyl(g,.67,.78,.16,.32,m);lathe(g,[[.57,0],[.49,.13],[.42,.3]],.40,m)}function armor(g,m){for(const s of[-1,1]){const sh=sph(g,.16,1.13,m);sh.scale.set(1.35,.65,.9);sh.position.x=s*.38;const arm=box(g,.18,.68,.22,s*.46,.91,0,m);arm.rotation.z=-s*.17;const gaunt=box(g,.17,.25,.22,s*.57,.60,.02,m);gaunt.rotation.z=s*.32}box(g,.57,.48,.13,0,.91,.31,m);for(const s of[-1,1]){box(g,.19,.43,.17,s*.18,.55,.01,m);box(g,.20,.38,.17,s*.18,.22,.01,m)}}function legs(g,m){for(const s of[-1,1]){const thigh=box(g,.19,.48,.21,s*.20,.47,0,m);thigh.rotation.z=s*.05;sph(g,.13,.25,m).position.x=s*.20;box(g,.17,.52,.22,s*.20,.10,.01,m);box(g,.25,.16,.36,s*.20,-.18,-.07,m)}}function sword(g,m,s){const h=box(g,.09,1.05,.11,s*.66,1.03,.02,m);h.rotation.z=s*.18;box(g,.36,.08,.15,s*.66,.52,.02,m);box(g,.13,.20,.13,s*.66,.43,.02,m)}function shield(g,m,s){const sh=new THREE.Shape;sh.moveTo(-.32,.34);sh.lineTo(.32,.34);sh.lineTo(.30,-.08);sh.lineTo(0,-.42);sh.lineTo(-.30,-.08);sh.closePath();const q=add(g,new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.10,bevelEnabled:true,bevelSegments:3,bevelSize:.04}),m),s*.68,1,.18);q.rotation.y=Math.PI/2}function crown(g,m,king=false){cyl(g,.22,.26,.17,2.29,m);for(let i=0;i<(king?5:8);i++){const a=i*Math.PI*2/(king?5:8);add(g,new THREE.ConeGeometry(.065,.34,8),m,Math.cos(a)*.22,2.48,Math.sin(a)*.22)}}function statue(t,c){const g=new THREE.Group,m=c==='w'?mw:mb;g.userData.anim={phase:Math.random()*6.28,moving:false};g.scale.setScalar(1.2);base(g,m);if(t==='p'){legs(g,m);lathe(g,[[.47,0],[.42,.25],[.36,.62],[.39,.96],[.30,1.28]],.43,m);armor(g,m);face(g,m,.30,1.76);cyl(g,.28,.31,.13,1.90,m);sword(g,m,1)}if(t==='r'){legs(g,m);lathe(g,[[.53,0],[.47,.24],[.40,.68],[.48,1.15]],.43,m);armor(g,m);cyl(g,.53,.53,.22,1.25,m);for(let i=0;i<8;i++){const a=i*Math.PI/4;box(g,.18,.34,.18,Math.cos(a)*.40,1.56,Math.sin(a)*.40,m)}face(g,m,.29,1.93);shield(g,m,-1);sword(g,m,1)}if(t==='b'){legs(g,m);lathe(g,[[.51,0],[.43,.27],[.34,.68],[.29,1.18]],.43,m);armor(g,m);lathe(g,[[.29,0],[.22,.23],[.27,.50]],1.48,m);face(g,m,.25,2.03);box(g,.065,1.65,.065,.46,1.25,.02,m)}if(t==='q'){legs(g,m);lathe(g,[[.54,0],[.45,.27],[.34,.74],[.29,1.22]],.43,m);armor(g,m);lathe(g,[[.32,0],[.24,.22],[.30,.48]],1.50,m);face(g,m,.30,2.07);crown(g,m,false);shield(g,m,-1);sword(g,m,1)}if(t==='k'){legs(g,m);lathe(g,[[.56,0],[.46,.27],[.36,.76],[.30,1.25]],.43,m);armor(g,m);lathe(g,[[.33,0],[.25,.22],[.32,.52]],1.50,m);face(g,m,.32,2.08);crown(g,m,true);shield(g,m,-1);sword(g,m,1);box(g,.10,.52,.10,0,2.60,0,m);box(g,.38,.10,.10,0,2.61,0,m)}if(t==='n'){legs(g,m);lathe(g,[[.54,0],[.44,.25],[.35,.68]],.43,m);armor(g,m);const s=new THREE.Shape;s.moveTo(-.35,0);s.lineTo(-.31,.55);s.lineTo(-.25,1.08);s.lineTo(-.10,1.50);s.lineTo(.13,1.75);s.lineTo(.40,1.60);s.lineTo(.50,1.34);s.lineTo(.34,1.17);s.lineTo(.08,1.08);s.lineTo(.17,.78);s.lineTo(.38,.35);s.lineTo(.29,0);s.closePath();add(g,new THREE.ExtrudeGeometry(s,{depth:.62,bevelEnabled:true,bevelSegments:5,bevelSize:.075,curveSegments:8}),m,-.22,.70,-.31);box(g,.12,.20,.68,0,2.07,-.36,m);box(g,.12,.18,.58,.05,2.22,-.35,m);for(const s2 of[-1,1]){const eye=sph(g,.045,2.03,m);eye.position.set(.10*s2,2.03,-.66)}}g.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});return g}load(20);function init(){scene=new THREE.Scene;scene.background=new THREE.Color(0x050504);scene.fog=new THREE.FogExp2(0x050504,.011);camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,17,22);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=10;controls.maxDistance=31;controls.maxPolarAngle=Math.PI*.47;ray=new THREE.Raycaster;mouse=new THREE.Vector2;scene.add(new THREE.HemisphereLight(0xcac2b3,0x070605,1.45));const sun=new THREE.DirectionalLight(0xffdfb0,4.2);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const fill=new THREE.PointLight(0x8daee0,10,38);fill.position.set(8,10,-9);scene.add(fill);const fire=new THREE.PointLight(0xff8740,12,32);fire.position.set(-10,6,11);scene.add(fire);add(scene,new THREE.BoxGeometry(24,.9,24),new THREE.MeshStandardMaterial({color:0x15120f,roughness:1}),0,-.5);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=add(scene,new THREE.BoxGeometry(1.96,.36,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x38352f:0x80776a,roughness:1}),(c-3.5)*2,0,(r-3.5)*2);q.userData={r,c};tiles.push(q)}for(const x of[-12,12])for(const z of[-9,9])add(scene,new THREE.CylinderGeometry(1.1,1.45,12,24),new THREE.MeshStandardMaterial({color:0x2c2925,roughness:1}),x,5.5,z);sync();load(72);setTimeout(()=>{load(100);setTimeout(()=>$('load').remove(),350)},350);events();animate()}const pos=(r,c)=>new THREE.Vector3((c-3.5)*2,.23,(r-3.5)*2),key=(r,c)=>r+','+c;function clear(){markers.forEach(x=>scene.remove(x));markers=[]}function show(p){clear();if(!p)return;const f='abcdefgh'[p.c]+(8-p.r);for(const mv of game.moves({square:f,verbose:true})){const r=8-+mv.to[1],c='abcdefgh'.indexOf(mv.to[0]),g=new THREE.Group;g.position.copy(pos(r,c));const ring=add(g,new THREE.TorusGeometry(.45,.065,12,36),new THREE.MeshBasicMaterial({color:0x35a7ff,transparent:true,opacity:.95}));ring.rotation.x=Math.PI/2;add(g,new THREE.CylinderGeometry(.14,.14,.025,20),new THREE.MeshBasicMaterial({color:0x62c0ff,transparent:true,opacity:.72}));scene.add(g);markers.push(g)}}function hit(e,arr){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(arr,true)}function piece(e){const h=hit(e,[...pcs.values()]);if(!h.length)return null;let o=h[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o.userData}function tile(e){const h=hit(e,tiles);return h.length?h[0].object.userData:null}function info(p){if(!p){$('pieceInfo').innerHTML='駒をタップすると<br>ここに情報が表示されます。';return}const color=p.color==='w'?'白':'黒',square='abcdefgh'[p.c]+(8-p.r);$('pieceInfo').innerHTML='<b>'+color+'の'+names[p.type]+'</b><br>位置：'+square+'<br>駒の種類：'+p.type.toUpperCase()+'<br>青い場所＝移動可能';}function click(e){if(busy||game.isGameOver()||game.turn()!=='w')return;const p=piece(e),t=tile(e);if(p){if(p.color==='w'){selected=p;info(p);show(p)}return}if(selected&&t){const from='abcdefgh'[selected.c]+(8-selected.r),to='abcdefgh'[t.c]+(8-t.r),m=game.moves({square:from,verbose:true}).find(x=>x.to===to);if(m)move(selected,m)}}function move(p,m){busy=true;clear();const from='abcdefgh'[p.c]+(8-p.r),to=m.to,g=pcs.get(key(p.r,p.c)),cap=pcs.get(key(8-+to[1],'abcdefgh'.indexOf(to[0])));if(cap){cap.scale.setScalar(.01);play('capture')}else play('move');try{game.move({from,to,promotion:'q'})}catch(e){busy=false;return}const d=pos(8-+to[1],'abcdefgh'.indexOf(to[0])),o=g.position.clone(),st=performance.now(),a=g.userData.anim;a.moving=true;function anim(){const z=Math.min(1,(performance.now()-st)/760),e=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;g.position.lerpVectors(o,d,e);g.position.y+=Math.sin(e*Math.PI)*.42;g.rotation.z=Math.sin(e*Math.PI*6)*.04;g.rotation.x=Math.sin(e*Math.PI*6)*.05;if(z<1)requestAnimationFrame(anim);else{g.rotation.set(0,0,0);a.moving=false;selected=null;info(null);sync();busy=false;if(game.isCheck())play(game.isCheckmate()?'mate':'check');if(game.isGameOver()){if(game.isCheckmate())win(game.turn()==='w'?'黒':'白');else{$('vt').textContent='対局終了';$('vx').textContent='引き分け';$('victory').classList.add('show')}return}if(game.turn()==='b')setTimeout(ai,240)}}anim()}function ai(){if(game.isGameOver()||game.turn()!=='b')return;busy=true;const lv=+$('level').value,ms=game.moves({verbose:true});let best=ms[Math.floor(Math.random()*ms.length)],score=-1e9;for(const m of ms){game.move(m);const v=-evalg(game);game.undo();if(lv>1&&v>score){score=v;best=m}}const p={r:8-+best.from[1],c:'abcdefgh'.indexOf(best.from[0]),color:'b',type:best.piece};setTimeout(()=>move(p,best),180)}function evalg(g){const v={p:100,n:320,b:330,r:500,q:900,k:20000};let s=0;for(const row of g.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*v[p.type];return s}function win(w){$('vt').textContent='⚔ '+w+'の勝利！';$('vx').textContent='チェックメイト — 巨大な石像兵士の戦いが終わりました';$('victory').classList.add('show');for(let i=0;i<150;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0xf0d58c,transparent:true}));q.position.set((Math.random()-.5)*8,.6,(Math.random()-.5)*8);q.userData.v=new THREE.Vector3((Math.random()-.5)*.05,.025+Math.random()*.08,(Math.random()-.5)*.05);scene.add(q);burst.push(q)}play('mate')}function undo(){if(busy||!game.history().length)return;game.undo();if(game.turn()==='b'&&game.history().length)game.undo();selected=null;clear();info(null);$('victory').classList.remove('show');sync()}function newGame(){if(busy)return;game=new Chess;selected=null;clear();info(null);burst.forEach(q=>scene.remove(q));burst=[];$('victory').classList.remove('show');sync()}function play(t){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext);const o=audio.createOscillator(),g=audio.createGain(),d={move:[180,.07],capture:[72,.16],check:[420,.13],mate:[55,.3]}[t]||[180,.07];o.connect(g);g.connect(audio.destination);o.frequency.value=d[0];g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.1,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d[1]);o.start();o.stop(audio.currentTime+d[1]+.03)}catch(e){}}function events(){renderer.domElement.addEventListener('pointerup',click);$('new').onclick=newGame;$('again').onclick=newGame;$('undo').onclick=undo;$('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}function sync(){for(const p of pcs.values())scene.remove(p);pcs.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const g=statue(p.type,p.color);g.position.copy(pos(r,c));g.userData={r,c,color:p.color,type:p.type,anim:g.userData.anim};scene.add(g);pcs.set(key(r,c),g)}if(selected){info(selected);show(selected)}status()}function status(){const turn=game.turn()==='w'?'白':'黒';let s=turn+'の番';if(game.isCheckmate())s=(turn==='w'?'黒':'白')+'の勝利！ チェックメイト';else if(game.isStalemate()||game.isDraw())s='引き分け';else if(game.isCheck())s+=' — 王手！';$('status').textContent=s}function animate(){requestAnimationFrame(animate);controls.update();const n=performance.now();markers.forEach((g,i)=>g.scale.setScalar(1+.14*Math.sin(n*.006+i)));for(const g of pcs.values()){const a=g.userData.anim;if(a&&!a.moving)g.position.y=.23+Math.sin(n*.0012+a.phase)*.006}for(let i=burst.length-1;i>=0;i--){const q=burst[i];q.position.add(q.userData.v);q.userData.v.y-=.0016;q.material.opacity-=.008;if(q.material.opacity<=0){scene.remove(q);burst.splice(i,1)}}renderer.render(scene,camera)}try{load(5);init()}catch(e){console.error(e)}</script></body></html>
