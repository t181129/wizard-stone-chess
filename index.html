<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔法使いの石像チェス 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090806;color:#eee;font-family:Georgia,"Yu Mincho",serif}#ui{position:fixed;z-index:5;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 3px 8px #000}.top h1{margin:0;font-size:clamp(22px,4vw,38px);letter-spacing:.08em;color:#e8d19b}.top p{margin:3px;color:#c8bba5;font-size:13px}.panel{position:absolute;top:12px;left:12px;width:205px;padding:12px;background:#12100ddd;border:1px solid #806a43;border-radius:12px;box-shadow:0 8px 30px #0008;pointer-events:auto;backdrop-filter:blur(5px)}button,select{width:100%;margin:4px 0;padding:9px;border-radius:8px;border:1px solid #806a43;background:#272118;color:#eee;font:inherit}button:active{transform:translateY(1px)}#status{text-align:center;font-weight:bold;font-size:17px;color:#f0d99b;margin-bottom:6px;min-height:23px}.hint{font-size:12px;color:#aaa;line-height:1.5}.right{left:auto;right:12px}.log{height:150px;overflow:auto;font:12px system-ui;color:#cfc5b7}.badge{display:inline-block;padding:2px 7px;border-radius:99px;background:#3c3020;color:#e6c97c;margin:2px}.check{color:#ff8276}.mate{color:#ff4c3e;font-size:18px}#toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-20px);opacity:0;background:#21160eeb;border:1px solid #c69c50;color:#f2d694;padding:12px 22px;border-radius:10px;font-weight:bold;transition:.3s;box-shadow:0 8px 35px #000;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}#load{position:fixed;inset:0;z-index:20;background:#090806;display:grid;place-items:center;color:#dfc27c;font-size:18px}#three{position:fixed;inset:0} @media(max-width:700px){.panel{width:145px;padding:8px}.right{display:none}.top p{display:none}.top h1{font-size:21px}.panel{top:auto;bottom:8px;left:8px}.panel .hint{display:none}.panel.right{display:none}} 
</style>
</head>
<body>
<div id="load">石像チェスを召喚中……</div><div id="three"></div>
<div id="ui"><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>奥行きのある3D石像・魔法の大広間風</p></div>
<div class="panel"><div id="status">白の番</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">石像をタップ→移動先をタップ。ドラッグでも動かせます。</div></div>
<div class="panel right"><b>戦闘記録</b><div id="log" class="log"></div></div><div id="toast"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
import {Chess} from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';

const root=document.getElementById('three'),statusEl=document.getElementById('status'),logEl=document.getElementById('log'),toast=document.getElementById('toast');
let game=new Chess(),scene,camera,renderer,controls,raycaster,mouse,boardGroup,pieces=new Map(),selected=null,busy=false,soundOn=true,audio=null,dragPiece=null,dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),dragPoint=new THREE.Vector3();
const SQ=2,BOARD=16,FILES='abcdefgh';

function stoneTexture(dark){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');let g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,dark?'#50545a':'#d6d0c3');g.addColorStop(.5,dark?'#272a2e':'#aaa59b');g.addColorStop(1,dark?'#111317':'#6e6a63');x.fillStyle=g;x.fillRect(0,0,256,256);let im=x.getImageData(0,0,256,256);for(let i=0;i<im.data.length;i+=4){let n=(Math.random()-.5)*30;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);let t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t}
const texW=stoneTexture(false),texB=stoneTexture(true);
function mat(c,rough=.9){return new THREE.MeshStandardMaterial({color:c,map:c===0xeee8dc?texW:texB,roughness:rough,metalness:.05,bumpMap:c===0xeee8dc?texW:texB,bumpScale:.035})}
function cyl(g,r1,r2,h,y,m){const q=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,20),m);q.position.y=y;g.add(q);return q}
function sphere(g,r,x,y,z,m){const q=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m);q.position.set(x,y,z);g.add(q);return q}
function lathe(g,prof,y,m){const q=new THREE.Mesh(new THREE.LatheGeometry(prof,24),m);q.position.y=y;g.add(q);return q}
function statue(type,color){const g=new THREE.Group();const m=mat(color==='w'?0xeee8dc:0x34383d);g.userData.type=type;const base=()=>{cyl(g,.66,.78,.24,.12,m);cyl(g,.52,.62,.16,.32,m)};
if(type==='p'){base();lathe(g,[[.45,0],[.38,.16],[.29,.45],[.38,.65],[.27,.78]],.35,m);sphere(g,.34,0,1.25,0,m);cyl(g,.20,.25,.24,1.56,m);}
if(type==='r'){base();lathe(g,[[.48,0],[.38,.28],[.42,.62],[.34,.8]],.35,m);cyl(g,.42,.45,.5,1.25,m);const crown=new THREE.Group();crown.position.y=1.55;g.add(crown);cyl(crown,.48,.48,.20,0,m);for(let i=0;i<6;i++){let a=i*Math.PI/3;sphere(crown,.13,Math.cos(a)*.39,.14,Math.sin(a)*.39,m)} }
if(type==='b'){base();lathe(g,[[.44,0],[.31,.3],[.36,.55],[.22,.92]],.35,m);sphere(g,.28,0,1.34,0,m);lathe(g,[[.18,0],[.25,.12],[.16,.4]],1.48,m);}
if(type==='q'){base();lathe(g,[[.46,0],[.34,.3],[.4,.55],[.24,1.0]],.35,m);sphere(g,.30,0,1.45,0,m);cyl(g,.16,.21,.25,1.75,m);for(let i=0;i<5;i++){let a=i*Math.PI*2/5;sphere(g,.11,Math.cos(a)*.25,1.92,Math.sin(a)*.25,m)} }
if(type==='k'){base();lathe(g,[[.48,0],[.35,.3],[.42,.6],[.27,1.05]],.35,m);sphere(g,.31,0,1.48,0,m);cyl(g,.18,.23,.34,1.76,m);cyl(g,.07,.10,.46,2.15,m);cyl(g,.20,.20,.08,2.15,m);cyl(g,.06,.06,.24,2.35,m);}
if(type==='n'){base();lathe(g,[[.47,0],[.35,.3],[.4,.55]],.35,m);const s=new THREE.Shape();s.moveTo(-.27,0);s.lineTo(-.20,.75);s.lineTo(-.05,1.35);s.lineTo(.25,1.65);s.lineTo(.48,1.5);s.lineTo(.58,1.18);s.lineTo(.38,.95);s.lineTo(.22,.55);s.lineTo(.32,0);s.closePath();const e=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.38,bevelEnabled:true,bevelSegments:3,bevelSize:.08,bevelThickness:.08}),m);e.position.set(-.18,.55,-.19);e.rotation.y=-.18;g.add(e);sphere(g,.18,.28,1.73,.02,m)}
for(const o of g.children){if(o.isMesh){o.castShadow=true;o.receiveShadow=true}}return g}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x090806);scene.fog=new THREE.FogExp2(0x090806,.018);camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,20,20);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=12;controls.maxDistance=32;controls.maxPolarAngle=Math.PI*.47;raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();
const hemi=new THREE.HemisphereLight(0xd8d0c0,0x17120d,2.1);scene.add(hemi);const key=new THREE.DirectionalLight(0xffe3aa,4.5);key.position.set(-8,18,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const fill=new THREE.PointLight(0x8da5c8,18,35);fill.position.set(7,8,-7);scene.add(fill);
boardGroup=new THREE.Group();scene.add(boardGroup);const floor=new THREE.Mesh(new THREE.BoxGeometry(19,.8,19),new THREE.MeshStandardMaterial({color:0x241b13,roughness:.8}));floor.position.y=-.45;floor.receiveShadow=true;boardGroup.add(floor);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=new THREE.Mesh(new THREE.BoxGeometry(1.98,.28,1.98),new THREE.MeshStandardMaterial({color:(r+c)%2?0x40382f:0x9b8a6d,roughness:.78}));q.position.set((c-3.5)*SQ,.0,(r-3.5)*SQ);q.receiveShadow=true;q.userData={r,c};boardGroup.add(q)}
for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.35,32),new THREE.MeshStandardMaterial({color:0x33281e,roughness:.8}));p.position.y=.3;p.position.x=(i<2?-10:10);p.position.z=(i%2?-7:7);scene.add(p)}sync();addEvents();document.getElementById('load').remove();animate()}
function pos(r,c){return new THREE.Vector3((c-3.5)*SQ,0.22,(r-3.5)*SQ)}
function pieceId(r,c){return r+','+c}
function sync(){for(const p of pieces.values())scene.remove(p);pieces.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const g=statue(p.type,p.color);g.position.copy(pos(r,c));g.userData={r,c,type:p.type,color:p.color,id:pieceId(r,c)};scene.add(g);pieces.set(pieceId(r,c),g)}updateStatus();}
function updateStatus(){const t=game.turn()==='w'?'白':'黒';let s=t+'の番';if(game.isCheckmate())s=(t==='白'?'黒':'白')+'の勝利！ チェックメイト';else if(game.isStalemate()||game.isDraw())s='引き分け';else if(game.isCheck())s+=' — 王手！';statusEl.textContent=s;statusEl.className=game.isCheckmate()?'mate':game.isCheck()?'check':''}
function squareAt(ev){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((ev.clientX-rect.left)/rect.width)*2-1;mouse.y=-((ev.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(boardGroup.children.filter(x=>x.userData.r!==undefined));if(!hits.length)return null;return hits[0].object.userData}
function pickPiece(ev){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((ev.clientX-rect.left)/rect.width)*2-1;mouse.y=-((ev.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects([...pieces.values()],true);if(!hits.length)return null;let o=hits[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o}
function legalFrom(r,c){return game.moves({square:FILES[c]+(8-r),verbose:true})}
function click(ev){if(busy||game.isGameOver()||game.turn()!=='w')return;const p=pickPiece(ev);const sq=squareAt(ev);if(p&&p.color==='w'){selected=p;toastMsg('移動先を選んでください');return}if(selected&&sq){const moves=legalFrom(selected.r,selected.c);const target=moves.find(m=>m.to===FILES[sq.c]+(8-sq.r));if(target){move(selected,target)}}}
function move(p,m){busy=true;const from={...p};const captured=pieces.get(pieceId(m.to[0]?8-parseInt(m.to[1]):0,FILES.indexOf(m.to[0])));const mover=pieces.get(pieceId(from.r,from.c));play(captured?'capture':'move');game.move({from:FILES[from.c]+(8-from.r),to:m.to,promotion:'q'});const dest=(()=>{const c=FILES.indexOf(m.to[0]),r=8-parseInt(m.to[1]);return pos(r,c)})();if(captured){captured.userData.dead=true;captured.scale.set(1,1,1);const start=performance.now();const f=()=>{let z=Math.min(1,(performance.now()-start)/330);captured.scale.setScalar(1-z);captured.rotation.x+=.15;if(z<1)requestAnimationFrame(f);else scene.remove(captured)};f()}const start=performance.now(),fromV=mover.position.clone();const f=()=>{let z=Math.min(1,(performance.now()-start)/520);z=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;mover.position.lerpVectors(fromV,dest,z);mover.rotation.y+=.015;if(z<1)requestAnimationFrame(f);else{sync();busy=false;logMove(m);if(game.isCheck())play(game.isCheckmate()?'mate':'check');if(!game.isGameOver()&&game.turn()==='b')setTimeout(ai,220)}};f();selected=null}
function logMove(m){const row=document.createElement('div');row.textContent=game.history().length+'. '+m.san;logEl.prepend(row);updateStatus()}
function toastMsg(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
function ai(){if(game.isGameOver()||game.turn()!=='b')return;busy=true;const d=+document.getElementById('level').value+1;const moves=game.moves({verbose:true});let best=-1e9,bm=moves[0];for(const m of moves){game.move(m);let v=-search(d-1,-1e9,1e9);game.undo();if(v>best){best=v;bm=m}}const fake={r:8-parseInt(bm.from[1]),c:FILES.indexOf(bm.from[0]),color:'b',type:bm.piece};busy=false;move(fake,bm)}
const val={p:100,n:320,b:330,r:500,q:900,k:20000};function search(depth,a,b){if(depth<=0)return evalPos();if(game.isGameOver())return game.isCheckmate()?-999999:0;let best=-1e9;for(const m of game.moves({verbose:true})){game.move(m);const v=-search(depth-1,-b,-a);game.undo();best=Math.max(best,v);a=Math.max(a,v);if(a>=b)break}return best}function evalPos(){let s=0;for(const row of game.board())for(const p of row)s+=(p.color==='b'?1:-1)*val[p.type];return s+(Math.random()-.5)*4}
function play(type){if(!soundOn)return;if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);const t=audio.currentTime;o.frequency.value=type==='capture'?95:type==='check'?440:type==='mate'?75:180;o.type=type==='move'?'triangle':'sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(type==='capture'?.18:.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(type==='mate'?.8:.16));o.start(t);o.stop(t+(type==='mate'?.82:.18))}
function addEvents(){renderer.domElement.addEventListener('pointerdown',e=>{if(busy)return;click(e)});document.getElementById('new').onclick=()=>{game=new Chess();selected=null;logEl.innerHTML='';sync();toastMsg('新しい対局')};document.getElementById('undo').onclick=()=>{if(busy)return;game.undo();if(game.history().length)game.undo();sync();toastMsg('1手戻しました')};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}
init();
</script></body></html>
