<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>魔法使いの石像チェス</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:#eee;font-family:Georgia,'Yu Mincho',serif}#three{position:fixed;inset:0}.load{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle,#241d16,#050504 72%);color:#dfc27c}.loader{width:min(360px,82vw);text-align:center}.title{font-size:22px;letter-spacing:.1em}.bar{height:8px;margin:18px 0 9px;border:1px solid #7d6540;border-radius:8px;overflow:hidden;background:#15110d}.bar i{display:block;width:0;height:100%;background:#d2b36d;transition:width .2s}.pct{font-size:14px}.panel{position:fixed;z-index:6;left:10px;top:10px;width:215px;padding:10px;background:#0d0c0be8;border:1px solid #735e3d;border-radius:10px;box-shadow:0 12px 35px #000b;backdrop-filter:blur(5px)}.right{left:auto;right:10px}.status{text-align:center;color:#ead39b;font-weight:bold;font-size:17px;min-height:23px}button,select{width:100%;margin:4px 0;padding:8px;border:1px solid #735e3d;border-radius:7px;background:#211b14;color:#eee;font:inherit}.hint,.log{font:11px/1.45 system-ui;color:#aaa}.log{height:150px;overflow:auto;color:#ccc0aa}.top{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 4px 12px #000;pointer-events:none;white-space:nowrap}.top h1{margin:0;color:#e5d09b;font-size:clamp(20px,4vw,38px);letter-spacing:.1em}.top p{margin:3px;color:#bdb09a;font-size:12px}.victory{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:radial-gradient(circle,#d9b65b22,#050504d9 62%);backdrop-filter:blur(3px)}.victory.show{display:grid}.victoryBox{width:min(430px,86vw);padding:28px;text-align:center;border:1px solid #b99b5a;border-radius:16px;background:#0b0907ee;box-shadow:0 0 60px #d8b65a55,0 20px 60px #000}.victoryBox h2{margin:0 0 8px;font-size:46px;color:#f0d58c;text-shadow:0 0 20px #d9b65a}.victoryBox p{margin:8px;color:#ddd0b2}@media(max-width:700px){.panel{width:151px;top:auto;bottom:8px;left:8px;padding:7px}.right{display:none}.hint,.top p{display:none}.top h1{font-size:20px}button,select{padding:7px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="load" class="load"><div class="loader"><div class="title">巨大な古代石像を召喚中</div><div class="bar"><i id="bar"></i></div><div id="pct">0%</div></div></div><div id="three"></div><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>巨大な石像兵士が古代の大広間で戦う</p></div><div class="panel"><div id="status" class="status">読み込み中…</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">白い石像をタップ → 青い場所へ移動。盤面をドラッグすると視点を回転。</div></div><div class="panel right"><b>戦闘記録</b><div id="log" class="log"></div></div><div id="victory" class="victory"><div class="victoryBox"><h2 id="vt">⚔ 勝利！</h2><p id="vx">チェックメイト</p><button id="again">もう一度対局</button></div></div><script type="module">import*as THREE from'three';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';import{Chess}from'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';const $=id=>document.getElementById(id),root=$('three'),bar=$('bar'),pct=$('pct');let loadN=0,scene,camera,renderer,controls,ray,mouse,game=new Chess,pcs=new Map,tiles=[],markers=[],selected=null,busy=false,soundOn=true,audio,burst=[];function load(n){loadN=Math.max(loadN,n);bar.style.width=loadN+'%';pct.textContent=loadN+'%'}
function mat(c){const dark=c==='b',cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d'),v=dark?47:166;x.fillStyle=`rgb(${v},${v+2},${v+5})`;x.fillRect(0,0,256,256);const im=x.getImageData(0,0,256,256);for(let i=0;i<im.data.length;i+=4){let n=(Math.random()-.5)*34;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);for(let i=0;i<170;i++){x.strokeStyle=`rgba(5,5,5,${.04+Math.random()*.14})`;x.lineWidth=.4+Math.random()*1.7;x.beginPath();let a=Math.random()*256,b=Math.random()*256;x.moveTo(a,b);for(let j=0;j<5;j++){a+=(Math.random()-.5)*42;b+=(Math.random()-.5)*42;x.lineTo(a,b)}x.stroke()}return new THREE.MeshStandardMaterial({color:dark?0x383a3c:0xd6d0c4,map:new THREE.CanvasTexture(cv),roughness:1})}const mw=mat('w'),mb=mat('b'),md=mat('b');function add(g,geo,m,x=0,y=0,z=0){let q=new THREE.Mesh(geo,m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;g.add(q);return q}function cyl(g,a,b,h,y,m,s=32){return add(g,new THREE.CylinderGeometry(a,b,h,s),m,0,y)}function lathe(g,p,y,m){return add(g,new THREE.LatheGeometry(p,40),m,0,y)}function tor(g,r,y,w,m){return add(g,new THREE.TorusGeometry(r,w,12,40),m,0,y)}function sph(g,r,y,m){return add(g,new THREE.SphereGeometry(r,28,20),m,0,y)}function box(g,w,h,d,x,y,z,m){return add(g,new THREE.BoxGeometry(w,h,d),m,x,y,z)}function arm(g,m,side){const x=side*.43; sph(g,.13,1.15,m).position.x=x;const a=box(g,.18,.72,.2,x,1.02,.0,m);a.rotation.z=-side*.22;const f=box(g,.17,.34,.2,side*.55,.73,.03,m);f.rotation.z=side*.45}function blade(g,m,side){const h=box(g,.10,1.05,.13,side*.64,1.15,.03,m);h.rotation.z=side*.18;box(g,.34,.08,.15,side*.64,.66,.03,m);box(g,.12,.18,.12,side*.64,.52,.03,m)}function face(g,m,r,y,ang=0){const h=sph(g,r,y,m);tor(g,r*.91,y+.08,.018,m);for(let s of[-1,1]){const eye=sph(g,.035,y+.01,m);eye.position.set(s*r*.36, y+.01, r*.91);eye.scale.set(.65,.65,.18)}for(let s of[-1,1]){const brow=box(g,.13,.025,.035,s*r*.34,y+.08,r*.9,m);brow.rotation.z=s*.18}const nose=box(g,.045,.14,.07,0,y-.03,r*.92,m);return h}
function base(g,m,scale=1){cyl(g,.78*scale,.98*scale,.22*scale,.12*scale,m);cyl(g,.67*scale,.76*scale,.15*scale,.31*scale,m);tor(g,.63*scale,.43*scale,.055*scale,m);tor(g,.53*scale,.56*scale,.035*scale,m);lathe(g,[[.56*scale,0],[.49*scale,.13*scale],[.43*scale,.29*scale]],.40*scale,m)}
function collar(g,m){tor(g,.43,.73,.045,m);tor(g,.47,1.00,.055,m);for(let s of[-1,1]){box(g,.09,.55,.10,s*.29,.86,0,m);box(g,.10,.28,.08,s*.18,1.13,.30,m)}}
function cracks(g,m){for(let i=0;i<5;i++){let q=box(g,.025,.35+Math.random()*.45,.018,(Math.random()-.5)*.8,.55+Math.random()*1.2,.45,m);q.rotation.z=(Math.random()-.5)*1.4}}
function statue(t,c){const g=new THREE.Group,m=c==='w'?mw:mb,accent=c==='w'?mb:mw;const H=1.5;g.scale.setScalar(1.18);base(g,m);if(t==='p'){lathe(g,[[.47,0],[.42,.24],[.36,.58],[.39,.92],[.30,1.25]],.43,m);collar(g,m);face(g,m,.30,1.72);cyl(g,.28,.31,.13,1.86,m);tor(g,.30,1.90,.025,m);arm(g,m,-1);arm(g,m,1);blade(g,m,1);cracks(g,accent)}if(t==='r'){lathe(g,[[.52,0],[.47,.22],[.40,.66],[.48,1.13]],.43,m);collar(g,m);cyl(g,.52,.52,.22,1.24,m);tor(g,.51,1.37,.06,m);for(let i=0;i<8;i++){let a=i*Math.PI/4;box(g,.18,.34,.18,Math.cos(a)*.40,1.53,Math.sin(a)*.40,m)}for(let i=-1;i<=1;i++)box(g,.11,.42,.08,i*.22,1.31,.22,m);face(g,m,.29,1.91);arm(g,m,-1);arm(g,m,1);blade(g,m,-1);cracks(g,accent)}if(t==='b'){lathe(g,[[.51,0],[.43,.26],[.34,.68],[.29,1.18]],.43,m);collar(g,m);lathe(g,[[.29,0],[.22,.23],[.27,.50]],1.45,m);face(g,m,.25,2.00);let staff=box(g,.065,1.6,.065,.42,1.25,.02,m);staff.rotation.z=.02;tor(g,.23,2.21,.025,m);let slit=box(g,.055,.52,.05,.08,2.0,.25,accent);slit.rotation.z=-.42;cracks(g,accent)}if(t==='q'){lathe(g,[[.54,0],[.45,.27],[.34,.74],[.29,1.22]],.43,m);collar(g,m);lathe(g,[[.32,0],[.24,.22],[.30,.48]],1.48,m);face(g,m,.30,2.04);tor(g,.29,2.22,.04,m);cyl(g,.21,.25,.16,2.28,m);for(let i=0;i<8;i++){let a=i*Math.PI/4;let q=add(g,new THREE.ConeGeometry(.065,.34,8),m,Math.cos(a)*.22,2.48,Math.sin(a)*.22);q.rotation.z=.15}arm(g,m,-1);arm(g,m,1);blade(g,m,1);cracks(g,accent)}if(t==='k'){lathe(g,[[.56,0],[.46,.27],[.36,.76],[.30,1.25]],.43,m);collar(g,m);lathe(g,[[.33,0],[.25,.22],[.32,.52]],1.48,m);face(g,m,.32,2.05);tor(g,.30,2.23,.045,m);cyl(g,.21,.25,.18,2.29,m);box(g,.10,.52,.10,0,2.58,0,m);box(g,.38,.10,.10,0,2.59,0,m);arm(g,m,-1);arm(g,m,1);blade(g,m,-1);cracks(g,accent)}if(t==='n'){lathe(g,[[.54,0],[.44,.25],[.35,.68]],.43,m);collar(g,m);const s=new THREE.Shape;s.moveTo(-.35,0);s.lineTo(-.31,.55);s.lineTo(-.25,1.08);s.lineTo(-.10,1.50);s.lineTo(.13,1.75);s.lineTo(.40,1.60);s.lineTo(.50,1.34);s.lineTo(.34,1.17);s.lineTo(.08,1.08);s.lineTo(.17,.78);s.lineTo(.38,.35);s.lineTo(.29,0);s.closePath();let q=add(g,new THREE.ExtrudeGeometry(s,{depth:.62,bevelEnabled:true,bevelSegments:5,bevelSize:.075,curveSegments:8}),m,-.22,.70,-.31);q.rotation.y=-.10;for(let i=0;i<6;i++)box(g,.045,.48,.06,-.39+i*.12,1.57,-.36,m);box(g,.12,.20,.68,0,2.07,-.36,m);box(g,.12,.18,.58,.05,2.22,-.35,m);for(let s2 of[-1,1]){let eye=sph(g,.045,2.02,accent);eye.position.set(.10*s2,2.02,-.66)}cracks(g,accent)}g.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});return g}
load(18);function init(){scene=new THREE.Scene;scene.background=new THREE.Color(0x050504);scene.fog=new THREE.FogExp2(0x050504,.011);camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,17,22);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=10;controls.maxDistance=31;controls.maxPolarAngle=Math.PI*.47;ray=new THREE.Raycaster;mouse=new THREE.Vector2;scene.add(new THREE.HemisphereLight(0xcac2b3,0x070605,1.45));let sun=new THREE.DirectionalLight(0xffdfb0,4.2);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);let fill=new THREE.PointLight(0x8daee0,10,38);fill.position.set(8,10,-9);scene.add(fill);let fire=new THREE.PointLight(0xff8740,12,32);fire.position.set(-10,6,11);scene.add(fire);add(scene,new THREE.BoxGeometry(24,.9,24),new THREE.MeshStandardMaterial({color:0x15120f,roughness:1}),0,-.5);for(let r=0;r<8;r++)for(let c=0;c<8;c++){let q=add(scene,new THREE.BoxGeometry(1.96,.36,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x38352f:0x80776a,roughness:1}),(c-3.5)*2,0,(r-3.5)*2);q.userData={r,c};tiles.push(q)}for(let x of[-12,12])for(let z of[-9,9]){let col=add(scene,new THREE.CylinderGeometry(1.1,1.45,12,24),new THREE.MeshStandardMaterial({color:0x2c2925,roughness:1}),x,5.5,z);for(let y=2;y<10;y+=1.4)tor(col,.98,y,.06,new THREE.MeshStandardMaterial({color:0x24211e,roughness:1}))}sync();load(75);setTimeout(()=>{load(100);setTimeout(()=>$('load').remove(),350)},350);events();animate()}
const pos=(r,c)=>new THREE.Vector3((c-3.5)*2,.23,(r-3.5)*2),key=(r,c)=>r+','+c;function clear(){markers.forEach(x=>scene.remove(x));markers=[]}function show(p){clear();if(!p)return;let f='abcdefgh'[p.c]+(8-p.r);for(let mv of game.moves({square:f,verbose:true})){let r=8-+mv.to[1],c='abcdefgh'.indexOf(mv.to[0]),g=new THREE.Group;g.position.copy(pos(r,c));let ring=add(g,new THREE.TorusGeometry(.45,.065,12,36),new THREE.MeshBasicMaterial({color:0x35a7ff,transparent:true,opacity:.95}));ring.rotation.x=Math.PI/2;add(g,new THREE.CylinderGeometry(.14,.14,.025,20),new THREE.MeshBasicMaterial({color:0x62c0ff,transparent:true,opacity:.72}));scene.add(g);markers.push(g)}}function sync(){for(let p of pcs.values())scene.remove(p);pcs.clear();let b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=b[r][c];if(!p)continue;let g=statue(p.type,p.color);g.position.copy(pos(r,c));g.userData={r,c,color:p.color,type:p.type};scene.add(g);pcs.set(key(r,c),g)}if(selected)show(selected);status()}function status(){let turn=game.turn()==='w'?'白':'黒',s=turn+'の番';if(game.isCheckmate())s=(turn==='w'?'黒':'白')+'の勝利！ チェックメイト';else if(game.isStalemate()||game.isDraw())s='引き分け';else if(game.isCheck())s+=' — 王手！';$('status').textContent=s}function hit(e,arr){let r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(arr,true)}function piece(e){let h=hit(e,[...pcs.values()]);if(!h.length)return null;let o=h[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o.userData}function tile(e){let h=hit(e,tiles);return h.length?h[0].object.userData:null}function click(e){if(busy||game.isGameOver()||game.turn()!=='w')return;let p=piece(e),t=tile(e);if(p&&p.color==='w'){selected=p;show(p);return}if(selected&&t){let from='abcdefgh'[selected.c]+(8-selected.r),to='abcdefgh'[t.c]+(8-t.r),m=game.moves({square:from,verbose:true}).find(x=>x.to===to);if(m)move(selected,m)}}function move(p,m){busy=true;clear();let from='abcdefgh'[p.c]+(8-p.r),to=m.to,g=pcs.get(key(p.r,p.c)),cap=pcs.get(key(8-+to[1],'abcdefgh'.indexOf(to[0])));if(cap){cap.scale.setScalar(.01);play('capture')}else play('move');let san;try{san=game.move({from,to,promotion:'q'}).san}catch(e){busy=false;return}let d=pos(8-+to[1],'abcdefgh'.indexOf(to[0])),o=g.position.clone(),st=performance.now();function anim(){let z=Math.min(1,(performance.now()-st)/520),e=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;g.position.lerpVectors(o,d,e);g.position.y+=Math.sin(e*Math.PI)*.5;if(z<1)requestAnimationFrame(anim);else{selected=null;sync();$('log').innerHTML+='<div>'+game.history().length+'. '+san+'</div>';busy=false;if(game.isCheck())play(game.isCheckmate()?'mate':'check');if(game.isGameOver()){if(game.isCheckmate())win(game.turn()==='w'?'黒':'白');else{$('vt').textContent='対局終了';$('vx').textContent='引き分け';$('victory').classList.add('show')}return}if(game.turn()==='b')setTimeout(ai,240)}}anim()}function ai(){if(game.isGameOver()||game.turn()!=='b')return;busy=true;let lv=+$('level').value,ms=game.moves({verbose:true}),best=ms[Math.floor(Math.random()*ms.length)],score=-1e9;for(let m of ms){game.move(m);let v=-evalg(game);game.undo();if(lv>1&&v>score){score=v;best=m}}let p={r:8-+best.from[1],c:'abcdefgh'.indexOf(best.from[0]),color:'b'};setTimeout(()=>move(p,best),180)}function evalg(g){let v={p:100,n:320,b:330,r:500,q:900,k:20000},s=0;for(let row of g.board())for(let p of row)if(p)s+=(p.color==='b'?1:-1)*v[p.type];return s}function win(w){$('vt').textContent='⚔ '+w+'の勝利！';$('vx').textContent='チェックメイト — 古代石像の戦いが終わりました';$('victory').classList.add('show');for(let i=0;i<150;i++){let q=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0xf0d58c,transparent:true}));q.position.set((Math.random()-.5)*8,.6,(Math.random()-.5)*8);q.userData.v=new THREE.Vector3((Math.random()-.5)*.05,.025+Math.random()*.08,(Math.random()-.5)*.05);scene.add(q);burst.push(q)}play('mate')}function undo(){if(busy||!game.history().length)return;game.undo();if(game.turn()==='b'&&game.history().length)game.undo();$('log').innerHTML='';selected=null;clear();$('victory').classList.remove('show');sync()}function newGame(){if(busy)return;game=new Chess;$('log').innerHTML='';selected=null;clear();burst.forEach(q=>scene.remove(q));burst=[];$('victory').classList.remove('show');sync()}function play(t){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext);let o=audio.createOscillator(),g=audio.createGain(),d={move:[180,.07],capture:[72,.16],check:[420,.13],mate:[55,.3]}[t]||[180,.07];o.connect(g);g.connect(audio.destination);o.frequency.value=d[0];g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.1,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d[1]);o.start();o.stop(audio.currentTime+d[1]+.03)}catch(e){}}function events(){renderer.domElement.addEventListener('pointerup',click);$('new').onclick=newGame;$('again').onclick=newGame;$('undo').onclick=undo;$('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}function animate(){requestAnimationFrame(animate);controls.update();let n=performance.now();markers.forEach((g,i)=>{let s=1+.14*Math.sin(n*.006+i);g.scale.setScalar(s)});for(let i=burst.length-1;i>=0;i--){let q=burst[i];q.position.add(q.userData.v);q.userData.v.y-=.0016;q.material.opacity-=.008;if(q.material.opacity<=0){scene.remove(q);burst.splice(i,1)}}renderer.render(scene,camera)}try{load(5);init()}catch(e){console.error(e)}</script></body></html>
