<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>魔法使いの石像チェス</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:#eee;font-family:Georgia,"Yu Mincho",serif}#three{position:fixed;inset:0}.load{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle,#241d16,#050504 72%);color:#dfc27c}.loader{width:min(360px,82vw);text-align:center}.title{font-size:22px;letter-spacing:.1em}.bar{height:8px;margin:18px 0 9px;border:1px solid #7d6540;border-radius:8px;overflow:hidden;background:#15110d}.bar i{display:block;width:0;height:100%;background:#d2b36d;transition:width .2s}.pct{font-size:14px}.err{display:none;margin-top:14px;color:#ffb5a8;font:13px system-ui}.top{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 4px 12px #000;pointer-events:none;white-space:nowrap}.top h1{margin:0;color:#e5d09b;font-size:clamp(20px,4vw,38px);letter-spacing:.1em}.top p{margin:3px;color:#bdb09a;font-size:12px}.panel{position:fixed;z-index:6;left:10px;top:10px;width:215px;padding:10px;background:#0d0c0be8;border:1px solid #735e3d;border-radius:10px;box-shadow:0 12px 35px #000b;backdrop-filter:blur(5px)}.right{left:auto;right:10px}.status{text-align:center;color:#ead39b;font-weight:bold;font-size:17px;min-height:23px}button,select{width:100%;margin:4px 0;padding:8px;border:1px solid #735e3d;border-radius:7px;background:#211b14;color:#eee;font:inherit}.hint{font:11px/1.45 system-ui;color:#aaa}.log{height:150px;overflow:auto;font:12px system-ui;color:#ccc0aa}.victory{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:radial-gradient(circle,#d9b65b22,#050504d9 62%);backdrop-filter:blur(3px)}.victory.show{display:grid}.victoryBox{width:min(430px,86vw);padding:28px;text-align:center;border:1px solid #b99b5a;border-radius:16px;background:#0b0907ee;box-shadow:0 0 60px #d8b65a55,0 20px 60px #000}.victoryBox h2{margin:0 0 8px;font-size:46px;color:#f0d58c;text-shadow:0 0 20px #d9b65a}.victoryBox p{margin:8px;color:#ddd0b2}.victoryBox button{margin-top:16px}@media(max-width:700px){.panel{width:151px;top:auto;bottom:8px;left:8px;padding:7px}.right{display:none}.hint,.top p{display:none}.top h1{font-size:20px}button,select{padding:7px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="load" class="load"><div class="loader"><div class="title">古代の石像チェスを召喚中</div><div class="bar"><i id="bar"></i></div><div id="pct" class="pct">0%</div><div id="err" class="err">読み込みに失敗しました。</div></div></div><div id="three"></div><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>古代の大広間に置かれた巨大な石像チェス</p></div><div class="panel"><div id="status" class="status">読み込み中…</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">白い石像をタップ → 青く光る場所から移動先をタップ。盤面をドラッグすると視点を回転。</div></div><div class="panel right"><b>戦闘記録</b><div id="log" class="log"></div></div><div id="victory" class="victory"><div class="victoryBox"><h2 id="victoryTitle">勝利！</h2><p id="victoryText">チェックメイト</p><button id="again">もう一度対局</button></div></div><script type="module">import*as THREE from"three";import{OrbitControls}from"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";import{Chess}from"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";const $=x=>document.getElementById(x),bar=$("bar"),pct=$("pct"),err=$("err"),root=$("three");let pr=0;const load=n=>{pr=Math.max(pr,n);bar.style.width=pr+"%";pct.textContent=pr+"%"};let scene,camera,renderer,controls,ray,mouse,game=new Chess,pcs=new Map,tiles=[],selected=null,busy=false,soundOn=true,audio,markers=[],burst=[];
function stone(dark){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d"),b=dark?48:165;x.fillStyle=`rgb(${b},${b+2},${b+5})`;x.fillRect(0,0,256,256);const im=x.getImageData(0,0,256,256);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*30;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);for(let i=0;i<110;i++){x.strokeStyle=`rgba(10,10,10,${.04+Math.random()*.12})`;x.lineWidth=.5+Math.random()*2;x.beginPath();let a=Math.random()*256,b2=Math.random()*256;x.moveTo(a,b2);for(let j=0;j<4;j++){a+=(Math.random()-.5)*45;b2+=(Math.random()-.5)*45;x.lineTo(a,b2)}x.stroke()}return new THREE.CanvasTexture(c)}const tw=stone(false),tb=stone(true);function M(c){return new THREE.MeshStandardMaterial({color:c==='w'?0xd8d3c8:0x3b3c3e,map:c==='w'?tw:tb,roughness:.97,metalness:0})}function add(g,geo,m,x=0,y=0,z=0){const q=new THREE.Mesh(geo,m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;g.add(q);return q}function C(g,a,b,h,y,m,s=28){return add(g,new THREE.CylinderGeometry(a,b,h,s),m,0,y)}function L(g,p,y,m){return add(g,new THREE.LatheGeometry(p,32),m,0,y)}function T(g,r,y,w,m){return add(g,new THREE.TorusGeometry(r,w,10,32),m,0,y)}function S(g,r,y,m){return add(g,new THREE.SphereGeometry(r,24,16),m,0,y)}function B(g,w,h,d,x,y,z,m){return add(g,new THREE.BoxGeometry(w,h,d),m,x,y,z)}function crack(g,x,y,z,a,m,len=.5){const q=B(g,.025,len,.025,x,y,z,m);q.rotation.z=a}
function base(g,m){C(g,.78,.93,.22,.11,m);C(g,.64,.73,.15,.3,m);T(g,.62,.4,.055,m);T(g,.51,.54,.035,m);L(g,[[.55,0],[.48,.12],[.43,.26]],.39,m)}function armor(g,m){T(g,.4,.69,.035,m);T(g,.43,.96,.045,m);for(const x of[-.28,.28])B(g,.075,.5,.07,x,.84,0,m);for(let i=-1;i<=1;i++)B(g,.055,.22,.055,i*.14,1.1,.29,m)}function head(g,m,r=.29,y=1.9){S(g,r,y,m);T(g,r*.92,y+.12,.025,m)}
function statue(t,c){const g=new THREE.Group,m=M(c),d=M(c==='w'?'b':'w');base(g,m);if(t==='p'){L(g,[[.46,0],[.4,.2],[.34,.52],[.37,.78],[.29,1.13]],.42,m);armor(g,m);head(g,m,.29,1.64);C(g,.3,.27,.1,1.8,m);T(g,.3,1.84,.025,m);crack(g,.28,1.03,.18,-.45,d,.35)}if(t==='r'){L(g,[[.5,0],[.45,.2],[.39,.65],[.47,1.12]],.42,m);armor(g,m);C(g,.51,.51,.18,1.2,m);T(g,.5,1.31,.05,m);for(let i=0;i<8;i++){const a=i*Math.PI/4;B(g,.18,.32,.18,Math.cos(a)*.39,1.49,Math.sin(a)*.39,m)}for(let i=-1;i<=1;i++)B(g,.11,.4,.07,i*.21,1.28,.2,m);crack(g,-.18,.88,.28,.3,d,.5)}if(t==='b'){L(g,[[.49,0],[.41,.25],[.31,.66],[.27,1.14]],.42,m);armor(g,m);L(g,[[.28,0],[.21,.2],[.25,.48]],1.45,m);head(g,m,.24,1.96);const q=B(g,.07,.6,.09,.04,1.98,.21,d);q.rotation.z=-.38;T(g,.23,2.17,.025,m);crack(g,.12,.88,.25,-.7,d,.4)}if(t==='q'){L(g,[[.52,0],[.43,.27],[.32,.72],[.28,1.18]],.42,m);armor(g,m);L(g,[[.31,0],[.24,.2],[.3,.45]],1.48,m);head(g,m,.3,2);T(g,.28,2.16,.035,m);C(g,.2,.24,.18,2.22,m);for(let i=0;i<6;i++){const a=i*Math.PI/3;add(g,new THREE.ConeGeometry(.065,.3,8),m,Math.cos(a)*.2,2.4,Math.sin(a)*.2)}crack(g,-.17,1.16,.2,-.25,d,.5)}if(t==='k'){L(g,[[.54,0],[.45,.27],[.35,.73],[.3,1.2]],.42,m);armor(g,m);L(g,[[.32,0],[.24,.2],[.32,.5]],1.48,m);head(g,m,.31,2);T(g,.29,2.18,.04,m);C(g,.2,.24,.2,2.23,m);B(g,.09,.45,.09,0,2.5,0,m);B(g,.32,.09,.09,0,2.51,0,m);crack(g,.16,1.18,.22,.55,d,.5)}if(t==='n'){L(g,[[.53,0],[.43,.25],[.35,.65]],.42,m);armor(g,m);const s=new THREE.Shape;s.moveTo(-.34,0);s.lineTo(-.3,.48);s.lineTo(-.23,1.02);s.lineTo(-.1,1.42);s.lineTo(.12,1.67);s.lineTo(.38,1.53);s.lineTo(.48,1.29);s.lineTo(.32,1.12);s.lineTo(.08,1.03);s.lineTo(.16,.73);s.lineTo(.36,.34);s.lineTo(.28,0);s.closePath();const q=add(g,new THREE.ExtrudeGeometry(s,{depth:.52,bevelEnabled:true,bevelSegments:4,bevelSize:.07,curveSegments:6}),m,-.22,.72,-.26);q.rotation.y=-.12;B(g,.12,.18,.6,-.01,2.03,-.29,m);B(g,.12,.18,.58,.04,2.15,-.28,m);for(let i=0;i<5;i++)B(g,.045,.43,.05,-.4+i*.11,1.51,-.3,m);crack(g,.08,1.1,-.53,-.3,d,.45)}g.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});return g}load(42);
function init(){scene=new THREE.Scene;scene.background=new THREE.Color(0x050504);scene.fog=new THREE.FogExp2(0x050504,.014);camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,18,21);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=11;controls.maxDistance=32;controls.maxPolarAngle=Math.PI*.48;ray=new THREE.Raycaster;mouse=new THREE.Vector2;scene.add(new THREE.HemisphereLight(0xbeb7aa,0x090807,1.7));const sun=new THREE.DirectionalLight(0xffdfad,4);sun.position.set(-10,21,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const blue=new THREE.PointLight(0x8daee0,13,34);blue.position.set(8,10,-9);scene.add(blue);const fire=new THREE.PointLight(0xff8e48,13,30);fire.position.set(-10,5,10);scene.add(fire);add(scene,new THREE.BoxGeometry(21,.9,21),new THREE.MeshStandardMaterial({color:0x18130f,roughness:1}),0,-.48);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=add(scene,new THREE.BoxGeometry(1.96,.34,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x37342f:0x827969,roughness:.96}),(c-3.5)*2,0,(r-3.5)*2);q.userData={r,c};tiles.push(q)}for(const[x,z]of[[-12,-9],[12,-9],[-12,9],[12,9]])add(scene,new THREE.CylinderGeometry(1,1.3,11,20),new THREE.MeshStandardMaterial({color:0x2d2a26,roughness:1}),x,5,z);sync();load(78);setTimeout(()=>{load(100);setTimeout(()=>$("load").remove(),300)},250);events();animate()}
const pos=(r,c)=>new THREE.Vector3((c-3.5)*2,.23,(r-3.5)*2),key=(r,c)=>r+','+c;function clear(){markers.forEach(x=>scene.remove(x));markers=[]}function show(p){clear();if(!p)return;const f='abcdefgh'[p.c]+(8-p.r);for(const mv of game.moves({square:f,verbose:true})){const r=8-+mv.to[1],c='abcdefgh'.indexOf(mv.to[0]),g=new THREE.Group;g.position.copy(pos(r,c));const ring=add(g,new THREE.TorusGeometry(.44,.06,12,36),new THREE.MeshBasicMaterial({color:0x35a7ff,transparent:true,opacity:.95}));ring.rotation.x=Math.PI/2;add(g,new THREE.CylinderGeometry(.13,.13,.025,20),new THREE.MeshBasicMaterial({color:0x62c0ff,transparent:true,opacity:.72}));scene.add(g);markers.push(g)}}function sync(){for(const p of pcs.values())scene.remove(p);pcs.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const g=statue(p.type,p.color);g.position.copy(pos(r,c));g.userData={r,c,color:p.color,type:p.type};scene.add(g);pcs.set(key(r,c),g)}if(selected)show(selected);status()}function status(){const turn=game.turn()==='w'?'白':'黒';let s=turn+'の番';if(game.isCheckmate())s=(turn==='w'?'黒':'白')+'の勝利！ チェックメイト';else if(game.isStalemate()||game.isDraw())s='引き分け';else if(game.isCheck())s+=' — 王手！';$("status").textContent=s}function hit(e,a){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(a,true)}function ph(e){const h=hit(e,[...pcs.values()]);if(!h.length)return null;let o=h[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o.userData}function th(e){const h=hit(e,tiles);return h.length?h[0].object.userData:null}
function click(e){if(busy||game.isGameOver()||game.turn()!=='w')return;const p=ph(e),t=th(e);if(p&&p.color==='w'){selected=p;show(p);return}if(selected&&t){const from='abcdefgh'[selected.c]+(8-selected.r),to='abcdefgh'[t.c]+(8-t.r),m=game.moves({square:from,verbose:true}).find(x=>x.to===to);if(m)move(selected,m)}}function win(w){$("victoryTitle").textContent='⚔ 勝利！';$("victoryText").textContent=w+'の石像がチェックメイトで勝利しました';$("victory").classList.add('show');for(let i=0;i<120;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0xf0d58c,transparent:true}));q.position.set((Math.random()-.5)*7,.5,(Math.random()-.5)*7);q.userData.v=new THREE.Vector3((Math.random()-.5)*.035,.025+Math.random()*.07,(Math.random()-.5)*.035);scene.add(q);burst.push(q)}play('mate')}function move(p,m){busy=true;clear();const from='abcdefgh'[p.c]+(8-p.r),to=m.to,g=pcs.get(key(p.r,p.c));let cap=pcs.get(key(8-+to[1],'abcdefgh'.indexOf(to[0])));if(m.flags?.includes('e'))cap=pcs.get(key(p.r+(p.color==='w'?1:-1),'abcdefgh'.indexOf(to[0])));if(cap){cap.scale.setScalar(.01);play('capture')}else play('move');let san;try{san=game.move({from,to,promotion:'q'}).san}catch(e){busy=false;return}const d=pos(8-+to[1],'abcdefgh'.indexOf(to[0])),o=g.position.clone(),st=performance.now();function a(){let z=Math.min(1,(performance.now()-st)/450),e=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;g.position.lerpVectors(o,d,e);g.position.y+=Math.sin(e*Math.PI)*.4;if(z<1)requestAnimationFrame(a);else{selected=null;sync();$("log").innerHTML+='<div>'+game.history().length+'. '+san+'</div>';busy=false;if(game.isCheck())play(game.isCheckmate()?'mate':'check');if(game.isGameOver()){if(game.isCheckmate())win(game.turn()==='w'?'黒':'白');else{$("victoryTitle").textContent='対局終了';$("victoryText").textContent='引き分け';$("victory").classList.add('show')}return}if(game.turn()==='b')setTimeout(ai,220)}}a()}
function ai(){if(game.isGameOver()||game.turn()!=='b')return;busy=true;const lv=+$('level').value,ms=game.moves({verbose:true});let ch=ms[Math.floor(Math.random()*ms.length)];if(lv>1){let best=-1e9,a=[];for(const m of ms){game.move(m);const v=-evalg(game);game.undo();if(v>best){best=v;a=[m]}else if(v===best)a.push(m)}ch=a[Math.floor(Math.random()*a.length)]||ch}const p={r:8-+ch.from[1],c:'abcdefgh'.indexOf(ch.from[0]),color:'b'};setTimeout(()=>move(p,ch),180)}function evalg(g){const v={p:100,n:320,b:330,r:500,q:900,k:20000};let s=0;for(const row of g.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*v[p.type];return s}function undo(){if(busy||!game.history().length)return;game.undo();if(game.turn()==='b'&&game.history().length)game.undo();$("log").innerHTML='';selected=null;clear();$("victory").classList.remove('show');sync()}function newGame(){if(busy)return;game=new Chess;$("log").innerHTML='';selected=null;clear();burst.forEach(q=>scene.remove(q));burst=[];$("victory").classList.remove('show');sync()}function play(t){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext);const o=audio.createOscillator(),g=audio.createGain(),d={move:[180,.07],capture:[72,.16],check:[420,.13],mate:[55,.3]}[t]||[180,.07];o.connect(g);g.connect(audio.destination);o.frequency.value=d[0];o.type='sine';g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.1,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d[1]);o.start();o.stop(audio.currentTime+d[1]+.03)}catch(e){}}function events(){renderer.domElement.addEventListener('pointerup',click);$('new').onclick=newGame;$('again').onclick=newGame;$('undo').onclick=undo;$('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}function animate(){requestAnimationFrame(animate);controls.update();const n=performance.now();markers.forEach((g,i)=>{const s=1+.12*Math.sin(n*.006+i);g.scale.setScalar(s);g.children[0].material.opacity=.65+.3*Math.sin(n*.006+i)});for(let i=burst.length-1;i>=0;i--){const q=burst[i];q.position.add(q.userData.v);q.userData.v.y-=.0015;q.material.opacity-=.008;if(q.material.opacity<=0){scene.remove(q);burst.splice(i,1)}}renderer.render(scene,camera)}try{load(5);init()}catch(e){console.error(e);err.style.display='block';err.textContent='読み込みに失敗しました: '+e.message}</script></body></html>
