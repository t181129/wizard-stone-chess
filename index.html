<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔法使いの石像チェス 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070604;color:#eee;font-family:Georgia,"Yu Mincho",serif}
#three{position:fixed;inset:0}
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#080705;color:#dfc27c;font-size:18px}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
.top{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 3px 10px #000;white-space:nowrap}
.top h1{margin:0;font-size:clamp(21px,4vw,37px);letter-spacing:.08em;color:#ead7a9}.top p{margin:4px 0;color:#c9bea9;font-size:13px}
.panel{position:absolute;top:12px;left:12px;width:215px;padding:12px;background:#100e0ce8;border:1px solid #806a43;border-radius:13px;box-shadow:0 10px 35px #0009;pointer-events:auto;backdrop-filter:blur(6px)}
.panel.right{left:auto;right:12px}button,select{width:100%;margin:4px 0;padding:9px;border-radius:8px;border:1px solid #806a43;background:#282116;color:#eee;font:inherit}button:active{transform:translateY(1px)}
#status{text-align:center;font-weight:bold;font-size:17px;color:#f0d99b;margin-bottom:6px;min-height:23px}#status.check{color:#ff9b84}#status.mate{color:#ff5143}.hint{font-size:12px;color:#aaa;line-height:1.5}.log{height:150px;overflow:auto;font:12px system-ui;color:#cfc5b7}
#toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-18px);opacity:0;background:#21160eeb;border:1px solid #c69c50;color:#f2d694;padding:12px 22px;border-radius:10px;font-weight:bold;transition:.25s;box-shadow:0 8px 35px #000;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.panel{width:150px;padding:8px;top:auto;bottom:8px;left:8px}.panel.right{display:none}.panel .hint{display:none}.top p{display:none}.top h1{font-size:21px}button,select{padding:8px}}
</style>
</head>
<body>
<div id="load">石像チェスを召喚中……</div><div id="three"></div>
<div id="ui"><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>奥行きのあるリアルチックな石像・魔法の大広間風</p></div>
<div class="panel"><div id="status">白の番</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">石像をタップ → 移動先をタップ。盤面はドラッグで回転できます。</div></div>
<div class="panel right"><b>戦闘記録</b><div id="log" class="log"></div></div><div id="toast"></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";
import {Chess} from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";
const root=document.getElementById("three"),statusEl=document.getElementById("status"),logEl=document.getElementById("log"),toast=document.getElementById("toast");
let game=new Chess(),scene,camera,renderer,controls,raycaster,mouse,boardGroup,pieces=new Map(),selected=null,busy=false,soundOn=true,audio=null;
const SQ=2,FILES="abcdefgh";
function stoneTexture(dark){const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,dark?"#555b61":"#d9d3c7");g.addColorStop(.5,dark?"#292d32":"#aaa69d");g.addColorStop(1,dark?"#101216":"#6e6b65");x.fillStyle=g;x.fillRect(0,0,256,256);const im=x.getImageData(0,0,256,256);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*24;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t}
const texW=stoneTexture(false),texB=stoneTexture(true);
function material(color){const t=color==="w"?texW:texB;return new THREE.MeshStandardMaterial({color:color==="w"?0xf0e9dc:0x363a40,map:t,bumpMap:t,bumpScale:.045,roughness:.88,metalness:.04})}
function addCyl(g,r1,r2,h,y,m,seg=24){const q=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);q.position.y=y;g.add(q);return q}
function addSphere(g,r,x,y,z,m){const q=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);q.position.set(x,y,z);g.add(q);return q}
function addLathe(g,pts,y,m){const q=new THREE.Mesh(new THREE.LatheGeometry(pts,28),m);q.position.y=y;g.add(q);return q}
function addBox(g,sx,sy,sz,x,y,z,m){const q=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);q.position.set(x,y,z);g.add(q);return q}
function base(g,m){addCyl(g,.70,.82,.22,.11,m,32);addCyl(g,.54,.66,.18,.31,m,32);addLathe(g,[[.46,0],[.42,.08],[.37,.20],[.34,.31]],.40,m)}
function shoulderArmor(g,m,y=1.12){addSphere(g,.25,-.30,y,0,m);addSphere(g,.25,.30,y,0,m);addCyl(g,.12,.14,.28,y-.12,m,16)}
function helmet(g,m,y,crest=false){addSphere(g,.34,0,y,0,m);addCyl(g,.23,.28,.22,y+.23,m);if(crest){addBox(g,.10,.42,.12,0,y+.52,0,m);addBox(g,.34,.09,.12,0,y+.66,0,m)}}
function statue(type,color){const g=new THREE.Group(),m=material(color),dark=material(color==="w"?"b":"w");g.userData.type=type;
 if(type==="p"){base(g,m);addLathe(g,[[.38,0],[.30,.25],[.28,.55],[.34,.75],[.22,.90]],.38,m);addCyl(g,.22,.25,.15,1.34,m);addSphere(g,.31,0,1.55,0,m);addCyl(g,.16,.20,.18,1.82,m);addBox(g,.10,.18,.10,0,1.96,0,m)}
 if(type==="r"){base(g,m);addLathe(g,[[.46,0],[.38,.27],[.43,.58],[.36,.86]],.38,m);addCyl(g,.40,.44,.50,1.22,m);addCyl(g,.50,.50,.12,1.52,m);for(let i=0;i<8;i++){let a=i*Math.PI/4;addBox(g,.15,.28,.18,Math.cos(a)*.40,1.70,Math.sin(a)*.40,m)}}
 if(type==="b"){base(g,m);addLathe(g,[[.44,0],[.31,.28],[.38,.58],[.24,1.00]],.38,m);addSphere(g,.29,0,1.46,0,m);addLathe(g,[[.18,0],[.23,.16],[.14,.48]],1.62,m);const slit=addBox(g,.055,.42,.08,0,1.88,.14,dark);slit.rotation.z=-.35}
 if(type==="q"){base(g,m);addLathe(g,[[.47,0],[.34,.30],[.40,.60],[.27,1.05]],.38,m);addSphere(g,.32,0,1.48,0,m);addCyl(g,.18,.22,.24,1.77,m);addCyl(g,.29,.29,.10,1.91,m);for(let i=0;i<5;i++){let a=i*Math.PI*2/5;addSphere(g,.105,Math.cos(a)*.27,2.10,Math.sin(a)*.27,m)}addSphere(g,.14,0,2.15,0,m)}
 if(type==="k"){base(g,m);addLathe(g,[[.48,0],[.35,.30],[.42,.62],[.29,1.05]],.38,m);shoulderArmor(g,m,1.15);addSphere(g,.33,0,1.50,0,m);helmet(g,m,1.53,true);addBox(g,.12,.52,.12,0,2.43,0,m);addBox(g,.38,.10,.12,0,2.64,0,m)}
 if(type==="n"){base(g,m);addLathe(g,[[.47,0],[.35,.30],[.40,.58]],.38,m);addBox(g,.55,.22,.65,0,.82,0,m);addSphere(g,.30,0,1.12,.02,m);const s=new THREE.Shape();s.moveTo(-.30,0);s.lineTo(-.22,.65);s.lineTo(-.12,1.12);s.lineTo(.12,1.42);s.lineTo(.42,1.55);s.lineTo(.57,1.38);s.lineTo(.48,1.12);s.lineTo(.28,.96);s.lineTo(.15,.50);s.lineTo(.30,0);s.closePath();const e=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.42,bevelEnabled:true,bevelSegments:4,bevelSize:.075,bevelThickness:.07}),m);e.position.set(-.22,.88,-.21);e.rotation.y=-.18;g.add(e);addSphere(g,.18,.30,2.35,.02,m)}
 for(const o of g.children)if(o.isMesh){o.castShadow=true;o.receiveShadow=true}return g}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x090806);scene.fog=new THREE.FogExp2(0x090806,.016);camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,18,21);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=11;controls.maxDistance=31;controls.maxPolarAngle=Math.PI*.48;raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();const hemi=new THREE.HemisphereLight(0xd8d0c0,0x17120d,2.2);scene.add(hemi);const key=new THREE.DirectionalLight(0xffe3ad,4.8);key.position.set(-9,19,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-22;key.shadow.camera.right=22;key.shadow.camera.top=22;key.shadow.camera.bottom=-22;scene.add(key);const fill=new THREE.PointLight(0x8ea8cc,18,36);fill.position.set(8,9,-8);scene.add(fill);const warm=new THREE.PointLight(0xff9c55,12,28);warm.position.set(-10,5,9);scene.add(warm);boardGroup=new THREE.Group();scene.add(boardGroup);const floor=new THREE.Mesh(new THREE.BoxGeometry(20,.9,20),new THREE.MeshStandardMaterial({color:0x241b13,roughness:.82}));floor.position.y=-.48;floor.receiveShadow=true;boardGroup.add(floor);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=new THREE.Mesh(new THREE.BoxGeometry(1.96,.30,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x3d362e:0x9a896c,roughness:.80}));q.position.set((c-3.5)*SQ,0,(r-3.5)*SQ);q.receiveShadow=true;q.userData={r,c};boardGroup.add(q)}const frame=new THREE.Mesh(new THREE.BoxGeometry(16.8,.5,16.8),new THREE.MeshStandardMaterial({color:0x17110c,roughness:.72}));frame.position.y=-.12;boardGroup.add(frame);sync();addEvents();document.getElementById("load").remove();animate()}
function pos(r,c){return new THREE.Vector3((c-3.5)*SQ,.22,(r-3.5)*SQ)}function id(r,c){return r+","+c}
function sync(){for(const p of pieces.values())scene.remove(p);pieces.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const g=statue(p.type,p.color);g.position.copy(pos(r,c));g.userData={r,c,type:p.type,color:p.color,id:id(r,c)};scene.add(g);pieces.set(id(r,c),g)}updateStatus()}
function updateStatus(){const t=game.turn()==="w"?"白":"黒";let s=t+"の番";if(game.isCheckmate())s=(t==="w"?"黒":"白")+"の勝利！ チェックメイト";else if(game.isStalemate()||game.isDraw())s="引き分け";else if(game.isCheck())s+=" — 王手！";statusEl.textContent=s;statusEl.className=game.isCheckmate()?"mate":game.isCheck()?"check":""}
function toastMsg(t){toast.textContent=t;toast.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove("show"),1100)}
function squareAt(ev){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((ev.clientX-rect.left)/rect.width)*2-1;mouse.y=-((ev.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(boardGroup.children.filter(x=>x.userData.r!==undefined),false);return hits.length?hits[0].object.userData:null}
function pickPiece(ev){const rect=renderer.domElement.getBoundingClientRect();mouse.x=((ev.clientX-rect.left)/rect.width)*2-1;mouse.y=-((ev.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects([...pieces.values()],true);if(!hits.length)return null;let o=hits[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o.userData}
function legalFrom(r,c){return game.moves({square:FILES[c]+(8-r),verbose:true})}
function handleClick(ev){if(busy||game.isGameOver()||game.turn()!=="w")return;const p=pickPiece(ev),sq=squareAt(ev);if(p&&p.color==="w"){selected=p;toastMsg("移動先を選んでください");return}if(selected&&sq){const target=legalFrom(selected.r,selected.c).find(m=>m.to===FILES[sq.c]+(8-sq.r));if(target)doMove(selected,target)}}
function animateMove(mover,dest,done){const start=performance.now(),from=mover.position.clone();function f(){let z=Math.min(1,(performance.now()-start)/500);z=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;mover.position.lerpVectors(from,dest,z);mover.position.y+=Math.sin(z*Math.PI)*.35;mover.rotation.y+=.012;if(z<1)requestAnimationFrame(f);else{mover.position.copy(dest);done()}}f()}
function doMove(p,m){busy=true;selected=null;const fromSq=FILES[p.c]+(8-p.r),toSq=m.to,mover=pieces.get(id(p.r,p.c));let captured=null;if(m.flags&&m.flags.includes("e"))captured=pieces.get(id(p.r+(p.color==="w"?1:-1),FILES.indexOf(m.to[0])));else captured=pieces.get(id(8-parseInt(toSq[1]),FILES.indexOf(toSq[0])));if(captured){play("capture");const start=performance.now();const f=()=>{const z=Math.min(1,(performance.now()-start)/280);captured.scale.setScalar(1-z);captured.rotation.x+=.18;if(z<1)requestAnimationFrame(f);else scene.remove(captured)};f()}else play("move");let san="";try{const made=game.move({from:fromSq,to:toSq,promotion:"q"});san=made.san}catch(e){busy=false;return}const dest=pos(8-parseInt(toSq[1]),FILES.indexOf(toSq[0]));animateMove(mover,dest,()=>{sync();logMove(san);if(game.isCheck())play(game.isCheckmate()?"mate":"check");busy=false;if(!game.isGameOver()&&game.turn()==="b")setTimeout(ai,230)})}
function logMove(san){const n=Math.ceil(game.history().length/2);logEl.innerHTML+="<div>"+n+". "+(game.history().length%2?san:"… "+san)+"</div>";logEl.scrollTop=logEl.scrollHeight}
function evaluate(g){const val={p:100,n:320,b:330,r:500,q:900,k:20000};let score=0;for(const row of g.board())for(const p of row)if(p)score+=(p.color==="b"?1:-1)*val[p.type];return score}
function search(g,depth,alpha=-1e9,beta=1e9,maximizing=true){if(depth===0||g.isGameOver())return evaluate(g);const moves=g.moves({verbose:true});if(maximizing){let best=-1e9;for(const m of moves){g.move(m);best=Math.max(best,search(g,depth-1,alpha,beta,false));g.undo();alpha=Math.max(alpha,best);if(beta<=alpha)break}return best}let best=1e9;for(const m of moves){g.move(m);best=Math.min(best,search(g,depth-1,alpha,beta,true));g.undo();beta=Math.min(beta,best);if(beta<=alpha)break}return best}
function ai(){if(game.isGameOver()||game.turn()!=="b")return;busy=true;const level=+document.getElementById("level").value,moves=game.moves({verbose:true});let chosen=moves[Math.floor(Math.random()*moves.length)];if(level>1){const depth=level===2?2:3;let top=-1e9,cands=[];for(const m of moves){game.move(m);const v=search(game,depth-1,-1e9,1e9,true);game.undo();if(v>top){top=v;cands=[m]}else if(v===top)cands.push(m)}chosen=cands[Math.floor(Math.random()*cands.length)]||chosen}const fake={r:8-parseInt(chosen.from[1]),c:FILES.indexOf(chosen.from[0]),color:"b"};setTimeout(()=>doMove(fake,chosen),120)}
function undo(){if(busy||game.history().length===0)return;game.undo();if(game.turn()==="b"&&game.history().length)game.undo();selected=null;logEl.innerHTML="";sync();toastMsg("1手戻しました")}
function newGame(){if(busy)return;game=new Chess();selected=null;logEl.innerHTML="";sync();toastMsg("新しい対局")}
function play(kind){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);const map={move:[180,.07],capture:[75,.18],check:[430,.14],mate:[60,.4]},[f,d]=map[kind]||map.move;o.frequency.value=f;o.type=kind==="capture"?"sawtooth":"sine";g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.12,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d+.02)}catch(e){}}
function addEvents(){renderer.domElement.addEventListener("pointerup",handleClick);document.getElementById("new").onclick=newGame;document.getElementById("undo").onclick=undo;document.getElementById("sound").onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?"🔊 音 ON":"🔇 音 OFF";if(soundOn)play("move")};addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}init();
</script>
</body>
</html>
