<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>魔法使いの石像チェス</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:#eee;font-family:Georgia,"Yu Mincho",serif}#three{position:fixed;inset:0}.load{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle,#241d16,#050504 72%);color:#dfc27c}.loader{width:min(360px,82vw);text-align:center}.title{font-size:22px;letter-spacing:.1em}.bar{height:8px;margin:18px 0 9px;border:1px solid #7d6540;border-radius:8px;overflow:hidden;background:#15110d}.bar i{display:block;width:0;height:100%;background:#d2b36d;transition:width .2s}.pct{font-size:14px}.err{display:none;margin-top:14px;color:#ffb5a8;font:13px system-ui}.top{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 4px 12px #000;pointer-events:none;white-space:nowrap}.top h1{margin:0;color:#e5d09b;font-size:clamp(20px,4vw,38px);letter-spacing:.1em}.top p{margin:3px;color:#bdb09a;font-size:12px}.panel{position:fixed;z-index:6;left:10px;top:10px;width:215px;padding:10px;background:#0d0c0be8;border:1px solid #735e3d;border-radius:10px;box-shadow:0 12px 35px #000b;backdrop-filter:blur(5px)}.right{left:auto;right:10px}.status{text-align:center;color:#ead39b;font-weight:bold;font-size:17px;min-height:23px}button,select{width:100%;margin:4px 0;padding:8px;border:1px solid #735e3d;border-radius:7px;background:#211b14;color:#eee;font:inherit}.hint{font:11px/1.45 system-ui;color:#aaa}.log{height:150px;overflow:auto;font:12px system-ui;color:#ccc0aa}@media(max-width:700px){.panel{width:151px;top:auto;bottom:8px;left:8px;padding:7px}.right{display:none}.hint,.top p{display:none}.top h1{font-size:20px}button,select{padding:7px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="load" class="load"><div class="loader"><div class="title">古代の石像チェスを召喚中</div><div class="bar"><i id="bar"></i></div><div id="pct" class="pct">0%</div><div id="err" class="err">読み込みに失敗しました。ページを再読み込みしてください。</div></div></div><div id="three"></div><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>古代の大広間に置かれた巨大な石像チェス</p></div><div class="panel"><div id="status" class="status">読み込み中…</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">白い石像をタップ → 移動先をタップ。盤面をドラッグすると視点を回転。</div></div><div class="panel right"><b>戦闘記録</b><div id="log" class="log"></div></div><script type="module">import * as THREE from "three";import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";import {Chess} from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";
const bar=document.getElementById('bar'),pct=document.getElementById('pct'),err=document.getElementById('err'),root=document.getElementById('three');let prog=0;function load(n){prog=Math.max(prog,n);bar.style.width=prog+'%';pct.textContent=prog+'%'}
load(10);let scene,camera,renderer,controls,ray,mouse,game=new Chess(),pieces=new Map(),tiles=[],selected=null,busy=false,soundOn=true,audio;
function texture(dark){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=dark?'#34363a':'#aaa69d';x.fillRect(0,0,128,128);const im=x.getImageData(0,0,128,128);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*38;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);return new THREE.CanvasTexture(c)}const texW=texture(false),texB=texture(true);load(25);function mat(c){return new THREE.MeshStandardMaterial({color:c==='w'?0xd5d0c5:0x3a3b3d,map:c==='w'?texW:texB,roughness:.95})}function cyl(g,a,b,h,y,m){const q=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,28),m);q.position.y=y;g.add(q)}function sph(g,r,y,m){const q=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),m);q.position.y=y;g.add(q)}function lathe(g,p,y,m){const q=new THREE.Mesh(new THREE.LatheGeometry(p,28),m);q.position.y=y;g.add(q)}
function statue(t,c){const g=new THREE.Group(),m=mat(c),d=mat(c==='w'?'b':'w');cyl(g,.72,.84,.22,.11,m);cyl(g,.52,.65,.18,.31,m);lathe(g,[[.46,0],[.38,.18],[.34,.42]],.39,m);g.userData.type=t;if(t==='p'){lathe(g,[[.38,0],[.29,.3],[.33,.65],[.24,.95]],.39,m);sph(g,.29,1.53,m)}if(t==='r'){lathe(g,[[.46,0],[.36,.45],[.42,.9]],.39,m);cyl(g,.4,.44,.48,1.18,m);cyl(g,.52,.52,.1,1.48,m)}if(t==='b'){lathe(g,[[.44,0],[.32,.48],[.25,1.02]],.39,m);sph(g,.29,1.48,m);const q=new THREE.Mesh(new THREE.BoxGeometry(.06,.4,.08),d);q.position.set(0,1.82,.12);q.rotation.z=-.35;g.add(q)}if(t==='q'){lathe(g,[[.48,0],[.34,.5],[.27,1.08]],.39,m);sph(g,.32,1.5,m);cyl(g,.18,.22,.25,1.78,m);sph(g,.12,2.08,m)}if(t==='k'){lathe(g,[[.49,0],[.35,.5],[.28,1.1]],.39,m);sph(g,.34,1.5,m);sph(g,.37,1.76,m);cyl(g,.12,.16,.5,2.05,m);cyl(g,.38,.38,.1,2.32,m)}if(t==='n'){lathe(g,[[.48,0],[.35,.48]],.39,m);const s=new THREE.Shape();s.moveTo(-.3,0);s.lineTo(-.22,.7);s.lineTo(-.05,1.3);s.lineTo(.3,1.55);s.lineTo(.52,1.35);s.lineTo(.4,1.05);s.lineTo(.18,.8);s.lineTo(.3,0);s.closePath();const q=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.42,bevelEnabled:true,bevelSegments:3,bevelSize:.06}),m);q.position.set(-.22,.75,-.21);q.rotation.y=-.15;g.add(q)}g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}load(45);
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x050504);scene.fog=new THREE.FogExp2(0x050504,.014);camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,18,21);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=11;controls.maxDistance=32;controls.maxPolarAngle=Math.PI*.48;ray=new THREE.Raycaster();mouse=new THREE.Vector2();scene.add(new THREE.HemisphereLight(0xbeb7aa,0x090807,1.7));const l=new THREE.DirectionalLight(0xffdfad,4);l.position.set(-10,21,8);l.castShadow=true;l.shadow.mapSize.set(1024,1024);scene.add(l);const blue=new THREE.PointLight(0x9ab5d4,12,34);blue.position.set(8,10,-9);scene.add(blue);const fire=new THREE.PointLight(0xff8e48,13,30);fire.position.set(-10,5,10);scene.add(fire);const floor=new THREE.Mesh(new THREE.BoxGeometry(21,.9,21),new THREE.MeshStandardMaterial({color:0x18130f,roughness:1}));floor.position.y=-.48;floor.receiveShadow=true;scene.add(floor);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=new THREE.Mesh(new THREE.BoxGeometry(1.96,.34,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x37342f:0x827969,roughness:.96}));q.position.set((c-3.5)*2,.0,(r-3.5)*2);q.userData={r,c};q.receiveShadow=true;scene.add(q);tiles.push(q)}for(const [x,z] of [[-12,-9],[12,-9],[-12,9],[12,9]]){const q=new THREE.Mesh(new THREE.CylinderGeometry(1,1.3,11,20),new THREE.MeshStandardMaterial({color:0x2d2a26,roughness:1}));q.position.set(x,5,z);q.castShadow=true;scene.add(q)}sync();load(78);setTimeout(()=>{load(100);setTimeout(()=>document.getElementById('load').remove(),250)},250);events();animate()}
function square(r,c){return new THREE.Vector3((c-3.5)*2,.23,(r-3.5)*2)}function k(r,c){return r+','+c}function sync(){for(const p of pieces.values())scene.remove(p);pieces.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const g=statue(p.type,p.color);g.position.copy(square(r,c));g.userData={r,c,color:p.color,type:p.type};scene.add(g);pieces.set(k(r,c),g)}status()}
function status(){const turn=game.turn()==='w'?'白':'黒';let s=turn+'の番';if(game.isCheckmate())s=(turn==='w'?'黒':'白')+'の勝利！ チェックメイト';else if(game.isStalemate()||game.isDraw())s='引き分け';else if(game.isCheck())s+=' — 王手！';document.getElementById('status').textContent=s}
function hit(e,objs){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(objs,true)}function pieceHit(e){const h=hit(e,[...pieces.values()]);if(!h.length)return null;let o=h[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o.userData}function tileHit(e){const h=hit(e,tiles);return h.length?h[0].object.userData:null}
function click(e){if(busy||game.isGameOver()||game.turn()!=='w')return;const p=pieceHit(e),t=tileHit(e);if(p&&p.color==='w'){selected=p;return}if(selected&&t){const f='abcdefgh'[selected.c]+(8-selected.r),to='abcdefgh'[t.c]+(8-t.r),m=game.moves({square:f,verbose:true}).find(x=>x.to===to);if(m)move(selected,m)}}
function move(p,m){busy=true;const from='abcdefgh'[p.c]+(8-p.r),to=m.to,g=pieces.get(k(p.r,p.c));let cap=pieces.get(k(8-+to[1], 'abcdefgh'.indexOf(to[0])));if(m.flags?.includes('e'))cap=pieces.get(k(p.r+(p.color==='w'?1:-1),'abcdefgh'.indexOf(to[0])));if(cap){play('capture');cap.scale.setScalar(.01)}else play('move');let san;try{san=game.move({from,to,promotion:'q'}).san}catch(e){busy=false;return}const d=square(8-+to[1],'abcdefgh'.indexOf(to[0])),o=g.position.clone(),st=performance.now();function a(){let z=Math.min(1,(performance.now()-st)/450),e=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;g.position.lerpVectors(o,d,e);g.position.y+=Math.sin(e*Math.PI)*.4;if(z<1)requestAnimationFrame(a);else{sync();document.getElementById('log').innerHTML+='<div>'+game.history().length+'. '+san+'</div>';busy=false;if(game.isCheck())play(game.isCheckmate()?'mate':'check');if(!game.isGameOver()&&game.turn()==='b')setTimeout(ai,220)}}a()}
function ai(){if(game.isGameOver()||game.turn()!=='b')return;busy=true;const lv=+document.getElementById('level').value,ms=game.moves({verbose:true});let chosen=ms[Math.floor(Math.random()*ms.length)];if(lv>1){let best=-1e9,arr=[];for(const m of ms){game.move(m);const v=-simpleEval(game);game.undo();if(v>best){best=v;arr=[m]}else if(v===best)arr.push(m)}chosen=arr[Math.floor(Math.random()*arr.length)]||chosen}const p={r:8-+chosen.from[1],c:'abcdefgh'.indexOf(chosen.from[0]),color:'b'};setTimeout(()=>move(p,chosen),180)}function simpleEval(g){const v={p:100,n:320,b:330,r:500,q:900,k:20000};let s=0;for(const row of g.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*v[p.type];return s}
function undo(){if(busy||!game.history().length)return;game.undo();if(game.turn()==='b'&&game.history().length)game.undo();document.getElementById('log').innerHTML='';sync()}function newGame(){if(busy)return;game=new Chess();document.getElementById('log').innerHTML='';selected=null;sync()}function play(t){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),d={move:[180,.07],capture:[72,.16],check:[420,.13],mate:[55,.3]}[t]||[180,.07];o.connect(g);g.connect(audio.destination);o.frequency.value=d[0];o.type='sine';g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.1,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d[1]);o.start();o.stop(audio.currentTime+d[1]+.02)}catch(e){}}
function events(){renderer.domElement.addEventListener('pointerup',click);document.getElementById('new').onclick=newGame;document.getElementById('undo').onclick=undo;document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}
try{load(5);init()}catch(e){console.error(e);pct.textContent='エラー';err.style.display='block'}
</script></body></html>
