<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔法使いの石像チェス</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:#eee;font-family:Georgia,"Yu Mincho",serif}#three{position:fixed;inset:0}#load{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle,#211b15,#050504 70%);color:#dfc27c}.loader{text-align:center;width:min(360px,82vw)}.loaderTitle{font-size:22px;letter-spacing:.12em;text-shadow:0 3px 10px #000}.bar{height:7px;margin:18px 0 9px;border:1px solid #7d6540;background:#15110d;border-radius:8px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:#d2b36d;box-shadow:0 0 12px #d2b36d;transition:width .18s}.pct{font-size:14px;color:#c9b995}#ui{position:fixed;inset:0;z-index:5;pointer-events:none}.top{position:absolute;top:11px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;text-shadow:0 4px 12px #000}.top h1{margin:0;font-size:clamp(20px,4vw,38px);letter-spacing:.12em;color:#e5d09b}.top p{margin:3px;color:#bdb09a;font-size:12px}.panel{position:absolute;left:12px;top:12px;width:215px;padding:11px;background:#0d0c0be8;border:1px solid #735e3d;border-radius:10px;box-shadow:0 12px 35px #000b;pointer-events:auto;backdrop-filter:blur(5px)}.right{left:auto;right:12px}.status{text-align:center;color:#ead39b;font-weight:bold;font-size:17px;min-height:23px;margin-bottom:5px}.status.check{color:#ffad8f}.status.mate{color:#ff5748}button,select{width:100%;margin:4px 0;padding:8px;border:1px solid #735e3d;border-radius:7px;background:#211b14;color:#eee;font:inherit}button:active{transform:translateY(1px)}.hint{font-size:11px;line-height:1.5;color:#aaa}.log{height:150px;overflow:auto;font:12px system-ui;color:#ccc0aa}.toast{position:absolute;left:50%;top:19%;transform:translate(-50%,-15px);opacity:0;padding:11px 20px;background:#17110beF;border:1px solid #c19a55;border-radius:8px;color:#ead39b;font-weight:bold;transition:.25s;box-shadow:0 8px 30px #000;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.panel{width:151px;left:8px;top:auto;bottom:8px;padding:8px}.right{display:none}.hint,.top p{display:none}.top h1{font-size:20px}button,select{padding:7px}}
</style>
</head>
<body>
<div id="load"><div class="loader"><div class="loaderTitle">古代の石像チェスを召喚中</div><div class="bar"><i id="bar"></i></div><div class="pct" id="pct">0%</div></div></div>
<div id="three"></div>
<div id="ui"><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>古代の大広間に置かれた巨大な石像チェスをイメージした3Dゲーム</p></div><div class="panel"><div id="status" class="status">白の番</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">石像をタップ → 移動先をタップ。盤面はドラッグして視点を回転。</div></div><div class="panel right"><b>戦闘記録</b><div id="log" class="log"></div></div><div id="toast" class="toast"></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";
import {Chess} from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";
const root=document.getElementById('three'),bar=document.getElementById('bar'),pct=document.getElementById('pct');
let progress=0;function load(n){progress=Math.max(progress,n);bar.style.width=progress+'%';pct.textContent=progress+'%'}
load(8);
const statusEl=document.getElementById('status'),logEl=document.getElementById('log'),toast=document.getElementById('toast');
let game=new Chess(),scene,camera,renderer,controls,raycaster,mouse,board,pieces=new Map(),selected=null,busy=false,soundOn=true,audio=null;
const FILES='abcdefgh',SQ=2,stone={};
function texture(dark){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle=dark?'#34363a':'#aaa69d';x.fillRect(0,0,256,256);const im=x.getImageData(0,0,256,256);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*42;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);x.strokeStyle=dark?'#161719':'#77736d';x.lineWidth=2;for(let i=0;i<35;i++){x.beginPath();let a=Math.random()*256,b=Math.random()*256;x.moveTo(a,b);x.lineTo(a+(Math.random()-.5)*35,b+(Math.random()-.5)*22);x.stroke()}return new THREE.CanvasTexture(c)}
stone.w=texture(false);stone.b=texture(true);load(25);
function mat(color){const t=stone[color];return new THREE.MeshStandardMaterial({color:color==='w'?0xd5d0c5:0x3a3b3d,map:t,bumpMap:t,bumpScale:.06,roughness:.96,metalness:.01})}
function cyl(g,a,b,h,y,m,s=28){const q=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,s),m);q.position.y=y;g.add(q);return q}
function sphere(g,r,x,y,z,m){const q=new THREE.Mesh(new THREE.SphereGeometry(r,28,18),m);q.position.set(x,y,z);g.add(q);return q}
function lathe(g,p,y,m){const q=new THREE.Mesh(new THREE.LatheGeometry(p,32),m);q.position.y=y;g.add(q);return q}
function box(g,x,y,z,px,py,pz,m){const q=new THREE.Mesh(new THREE.BoxGeometry(x,y,z),m);q.position.set(px,py,pz);g.add(q);return q}
function pedestal(g,m){cyl(g,.76,.86,.22,.11,m,32);cyl(g,.58,.70,.18,.31,m,32);lathe(g,[[.48,0],[.43,.10],[.39,.24],[.35,.34]],.39,m)}
function armor(g,m){sphere(g,.25,-.30,1.08,0,m);sphere(g,.25,.30,1.08,0,m);cyl(g,.12,.15,.30,1.0,m,16)}
function statue(type,color){const g=new THREE.Group(),m=mat(color),dark=mat(color==='w'?'b':'w');pedestal(g,m);g.userData.type=type;
if(type==='p'){lathe(g,[[.40,0],[.32,.22],[.29,.55],[.34,.78],[.24,.94]],.39,m);sphere(g,.31,0,1.56,0,m);cyl(g,.17,.21,.20,1.82,m);sphere(g,.09,0,1.96,0,m)}
if(type==='r'){lathe(g,[[.47,0],[.39,.25],[.43,.63],[.35,.90]],.39,m);cyl(g,.43,.47,.48,1.20,m);cyl(g,.53,.53,.12,1.50,m);for(let i=0;i<8;i++){const a=i*Math.PI/4;box(g,.17,.30,.20,Math.cos(a)*.42,1.69,Math.sin(a)*.42,m)}}
if(type==='b'){lathe(g,[[.45,0],[.32,.27],[.38,.62],[.24,1.03]],.39,m);sphere(g,.30,0,1.48,0,m);lathe(g,[[.18,0],[.24,.15],[.14,.48]],1.61,m);const slit=box(g,.055,.43,.09,0,1.88,.14,dark);slit.rotation.z=-.35}
if(type==='q'){lathe(g,[[.48,0],[.34,.30],[.40,.63],[.27,1.08]],.39,m);sphere(g,.33,0,1.50,0,m);cyl(g,.18,.22,.25,1.78,m);cyl(g,.30,.30,.10,1.94,m);for(let i=0;i<5;i++){const a=i*Math.PI*2/5;sphere(g,.11,Math.cos(a)*.28,2.11,Math.sin(a)*.28,m)}sphere(g,.14,0,2.16,0,m)}
if(type==='k'){lathe(g,[[.49,0],[.35,.30],[.42,.63],[.28,1.10]],.39,m);armor(g,m);sphere(g,.34,0,1.49,0,m);sphere(g,.37,0,1.72,0,m);box(g,.12,.42,.13,0,2.18,0,m);box(g,.40,.10,.13,0,2.39,0,m);box(g,.12,.38,.12,0,2.58,0,m)}
if(type==='n'){lathe(g,[[.48,0],[.35,.28],[.41,.57]],.39,m);box(g,.58,.22,.68,0,.84,0,m);sphere(g,.31,0,1.16,.03,m);const s=new THREE.Shape();s.moveTo(-.30,0);s.lineTo(-.24,.58);s.lineTo(-.10,1.10);s.lineTo(.10,1.43);s.lineTo(.39,1.59);s.lineTo(.58,1.42);s.lineTo(.52,1.13);s.lineTo(.30,.96);s.lineTo(.18,.55);s.lineTo(.31,0);s.closePath();const e=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.46,bevelEnabled:true,bevelSegments:4,bevelSize:.08,bevelThickness:.08}),m);e.position.set(-.23,.86,-.23);e.rotation.y=-.18;g.add(e);sphere(g,.18,.32,2.37,.03,m)}
for(const o of g.children)if(o.isMesh){o.castShadow=true;o.receiveShadow=true}return g}
load(48);
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x050504);scene.fog=new THREE.FogExp2(0x050504,.015);camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,18,21);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=11;controls.maxDistance=32;controls.maxPolarAngle=Math.PI*.48;raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();
scene.add(new THREE.HemisphereLight(0xbeb7aa,0x090807,1.8));const key=new THREE.DirectionalLight(0xffdfad,4.2);key.position.set(-10,21,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-24;key.shadow.camera.right=24;key.shadow.camera.top=24;key.shadow.camera.bottom=-24;scene.add(key);const moon=new THREE.PointLight(0x9ab5d4,15,34);moon.position.set(8,10,-9);scene.add(moon);const fire=new THREE.PointLight(0xff8e48,15,30);fire.position.set(-10,5,10);scene.add(fire);
board=new THREE.Group();scene.add(board);const floor=new THREE.Mesh(new THREE.BoxGeometry(21,.9,21),new THREE.MeshStandardMaterial({color:0x18130f,roughness:1}));floor.position.y=-.48;floor.receiveShadow=true;board.add(floor);
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=new THREE.Mesh(new THREE.BoxGeometry(1.96,.34,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x37342f:0x827969,roughness:.96}));q.position.set((c-3.5)*SQ,0,(r-3.5)*SQ);q.userData={r,c};q.receiveShadow=true;board.add(q)}
const frame=new THREE.Mesh(new THREE.BoxGeometry(17.3,.58,17.3),new THREE.MeshStandardMaterial({color:0x100d0a,roughness:1}));frame.position.y=-.18;board.add(frame);
for(let x of [-12,12])for(let z of [-9,9]){const col=new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.3,11,20),new THREE.MeshStandardMaterial({color:0x2d2a26,roughness:1}));col.position.set(x,5.1,z);col.castShadow=true;scene.add(col)}
sync();load(78);setTimeout(()=>{load(100);setTimeout(()=>document.getElementById('load').remove(),180)},180);addEvents();animate()}
function pos(r,c){return new THREE.Vector3((c-3.5)*SQ,.23,(r-3.5)*SQ)}function key(r,c){return r+','+c}
function sync(){for(const p of pieces.values())scene.remove(p);pieces.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const g=statue(p.type,p.color);g.position.copy(pos(r,c));g.userData={r,c,type:p.type,color:p.color};scene.add(g);pieces.set(key(r,c),g)}updateStatus()}
function updateStatus(){const t=game.turn()==='w'?'白':'黒';let s=t+'の番';if(game.isCheckmate())s=(t==='w'?'黒':'白')+'の勝利！ チェックメイト';else if(game.isStalemate()||game.isDraw())s='引き分け';else if(game.isCheck())s+=' — 王手！';statusEl.textContent=s;statusEl.className='status '+(game.isCheckmate()?'mate':game.isCheck()?'check':'')}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove('show'),1000)}
function ray(ev,objects){const rect=renderer.domElement.getBoundingClientRect();mouse.x=(ev.clientX-rect.left)/rect.width*2-1;mouse.y=-(ev.clientY-rect.top)/rect.height*2+1;raycaster.setFromCamera(mouse,camera);return raycaster.intersectObjects(objects,true)}
function pieceAt(ev){const h=ray(ev,[...pieces.values()]);if(!h.length)return null;let o=h[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o.userData}
function squareAt(ev){const h=ray(ev,board.children.filter(x=>x.userData.r!==undefined));return h.length?h[0].object.userData:null}
function legal(r,c){return game.moves({square:FILES[c]+(8-r),verbose:true})}
function click(ev){if(busy||game.isGameOver()||game.turn()!=='w')return;const p=pieceAt(ev),sq=squareAt(ev);if(p&&p.color==='w'){selected=p;toastMsg('移動先を選んでください');return}if(selected&&sq){const m=legal(selected.r,selected.c).find(x=>x.to===FILES[sq.c]+(8-sq.r));if(m)move(selected,m)}}
function move(p,m){busy=true;selected=null;const from=FILES[p.c]+(8-p.r),to=m.to,mover=pieces.get(key(p.r,p.c));let cap=pieces.get(key(8-parseInt(to[1]),FILES.indexOf(to[0])));if(m.flags&&m.flags.includes('e'))cap=pieces.get(key(p.r+(p.color==='w'?1:-1),FILES.indexOf(to[0])));if(cap){play('capture');const st=performance.now();const f=()=>{const z=Math.min(1,(performance.now()-st)/320);cap.scale.setScalar(1-z);cap.rotation.z+=.14;if(z<1)requestAnimationFrame(f);else scene.remove(cap)};f()}else play('move');let san;try{san=game.move({from,to,promotion:'q'}).san}catch(e){busy=false;return}const dest=pos(8-parseInt(to[1]),FILES.indexOf(to[0])),start=performance.now(),origin=mover.position.clone();const anim=()=>{let z=Math.min(1,(performance.now()-start)/560);z=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;mover.position.lerpVectors(origin,dest,z);mover.position.y+=Math.sin(z*Math.PI)*.42;mover.rotation.y+=.012;if(z<1)requestAnimationFrame(anim);else{sync();logMove(san);if(game.isCheck())play(game.isCheckmate()?'mate':'check');busy=false;if(!game.isGameOver()&&game.turn()==='b')setTimeout(ai,250)}};anim()}
function logMove(s){const n=Math.ceil(game.history().length/2);logEl.innerHTML+='<div>'+n+'. '+(game.history().length%2?s:'… '+s)+'</div>';logEl.scrollTop=logEl.scrollHeight}
function evalBoard(g){const v={p:100,n:320,b:330,r:500,q:900,k:20000};let s=0;for(const row of g.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*v[p.type];return s}
function search(g,d,a=-1e9,b=1e9,max=true){if(!d||g.isGameOver())return evalBoard(g);const ms=g.moves({verbose:true});if(max){let v=-1e9;for(const m of ms){g.move(m);v=Math.max(v,search(g,d-1,a,b,false));g.undo();a=Math.max(a,v);if(b<=a)break}return v}else{let v=1e9;for(const m of ms){g.move(m);v=Math.min(v,search(g,d-1,a,b,true));g.undo();b=Math.min(b,v);if(b<=a)break}return v}}
function ai(){if(game.isGameOver()||game.turn()!=='b')return;busy=true;const lv=+document.getElementById('level').value,ms=game.moves({verbose:true});let chosen=ms[Math.floor(Math.random()*ms.length)];if(lv>1){const d=lv===2?2:3,best=-1e9,c=[];let top=-1e9;for(const m of ms){game.move(m);const v=search(game,d-1,-1e9,1e9,true);game.undo();if(v>top){top=v;c.length=0;c.push(m)}else if(v===top)c.push(m)}chosen=c[Math.floor(Math.random()*c.length)]||chosen}const p={r:8-parseInt(chosen.from[1]),c:FILES.indexOf(chosen.from[0]),color:'b'};setTimeout(()=>move(p,chosen),120)}
function undo(){if(busy||!game.history().length)return;game.undo();if(game.turn()==='b'&&game.history().length)game.undo();selected=null;logEl.innerHTML='';sync();toastMsg('1手戻しました')}
function newGame(){if(busy)return;game=new Chess();selected=null;logEl.innerHTML='';sync();toastMsg('新しい対局')}
function play(type){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);const d={move:[180,.07],capture:[72,.18],check:[420,.14],mate:[55,.38]}[type]||[180,.07];o.frequency.value=d[0];o.type=type==='capture'?'sawtooth':'sine';g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.11,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d[1]);o.start();o.stop(audio.currentTime+d[1]+.02)}catch(e){}}
function addEvents(){renderer.domElement.addEventListener('pointerup',click);document.getElementById('new').onclick=newGame;document.getElementById('undo').onclick=undo;document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF';if(soundOn)play('move')};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
init();
</script>
</body>
</html>
