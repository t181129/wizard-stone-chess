<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>魔法使いの石像チェス</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:#eee;font-family:Georgia,"Yu Mincho",serif}#three{position:fixed;inset:0}.load{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle,#241d16,#050504 72%);color:#dfc27c}.loader{width:min(360px,82vw);text-align:center}.title{font-size:22px;letter-spacing:.1em}.bar{height:8px;margin:18px 0 9px;border:1px solid #7d6540;border-radius:8px;overflow:hidden;background:#15110d}.bar i{display:block;width:0;height:100%;background:#d2b36d;transition:width .2s}.pct{font-size:14px}.err{display:none;margin-top:14px;color:#ffb5a8;font:13px system-ui}.top{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 4px 12px #000;pointer-events:none;white-space:nowrap}.top h1{margin:0;color:#e5d09b;font-size:clamp(20px,4vw,38px);letter-spacing:.1em}.top p{margin:3px;color:#bdb09a;font-size:12px}.panel{position:fixed;z-index:6;left:10px;top:10px;width:215px;padding:10px;background:#0d0c0be8;border:1px solid #735e3d;border-radius:10px;box-shadow:0 12px 35px #000b;backdrop-filter:blur(5px)}.right{left:auto;right:10px}.status{text-align:center;color:#ead39b;font-weight:bold;font-size:17px;min-height:23px}button,select{width:100%;margin:4px 0;padding:8px;border:1px solid #735e3d;border-radius:7px;background:#211b14;color:#eee;font:inherit}.hint{font:11px/1.45 system-ui;color:#aaa}.log{height:150px;overflow:auto;font:12px system-ui;color:#ccc0aa}.victory{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:radial-gradient(circle,#d9b65b22,#050504d9 62%);backdrop-filter:blur(3px)}.victory.show{display:grid}.victoryBox{width:min(430px,86vw);padding:28px;text-align:center;border:1px solid #b99b5a;border-radius:16px;background:#0b0907ee;box-shadow:0 0 60px #d8b65a55,0 20px 60px #000}.victoryBox h2{margin:0 0 8px;font-size:46px;color:#f0d58c;text-shadow:0 0 20px #d9b65a}.victoryBox p{margin:8px;color:#ddd0b2}.victoryBox button{margin-top:16px}@media(max-width:700px){.panel{width:151px;top:auto;bottom:8px;left:8px;padding:7px}.right{display:none}.hint,.top p{display:none}.top h1{font-size:20px}button,select{padding:7px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="load" class="load"><div class="loader"><div class="title">古代の石像チェスを召喚中</div><div class="bar"><i id="bar"></i></div><div id="pct" class="pct">0%</div><div id="err" class="err">読み込みに失敗しました。ページを再読み込みしてください。</div></div></div><div id="three"></div><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>古代の大広間に置かれた巨大な石像チェス</p></div><div class="panel"><div id="status" class="status">読み込み中…</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">白い石像をタップ → 青く光る場所から移動先をタップ。盤面をドラッグすると視点を回転。</div></div><div class="panel right"><b>戦闘記録</b><div id="log" class="log"></div></div><div id="victory" class="victory"><div class="victoryBox"><h2 id="victoryTitle">勝利！</h2><p id="victoryText">チェックメイト</p><button id="again">もう一度対局</button></div></div><script type="module">import * as THREE from "three";import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";import {Chess} from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";const bar=document.getElementById('bar'),pct=document.getElementById('pct'),root=document.getElementById('three');let prog=0;function load(n){prog=Math.max(prog,n);bar.style.width=prog+'%';pct.textContent=prog+'%'}let scene,camera,renderer,controls,ray,mouse,game=new Chess(),pieces=new Map(),tiles=[],selected=null,busy=false,soundOn=true,audio,markers=[],burst=[];function texture(dark){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle=dark?'#34363a':'#aaa69d';x.fillRect(0,0,128,128);for(let i=0;i<1700;i++){x.fillStyle='rgba(255,255,255,'+(Math.random()*.08)+')';x.fillRect(Math.random()*128,Math.random()*128,Math.random()*3,Math.random()*3)}return new THREE.CanvasTexture(c)}const texW=texture(false),texB=texture(true);load(20);function mat(c){return new THREE.MeshStandardMaterial({color:c==='w'?0xd7d1c5:0x3b3c3e,map:c==='w'?texW:texB,roughness:.97})}function mesh(g,geo,m,x=0,y=0,z=0){const q=new THREE.Mesh(geo,m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;g.add(q);return q}function cyl(g,a,b,h,y,m,seg=24){return mesh(g,new THREE.CylinderGeometry(a,b,h,seg),m,0,y)}function sph(g,r,y,m){return mesh(g,new THREE.SphereGeometry(r,20,14),m,0,y)}function lathe(g,p,y,m){return mesh(g,new THREE.LatheGeometry(p,24),m,0,y)}function band(g,r,y,h,m){return mesh(g,new THREE.TorusGeometry(r,h*.32,8,24),m,0,y)}function crack(g,x,y,z,rot,m){const q=mesh(g,new THREE.BoxGeometry(.035,.5,.035),m,x,y,z);q.rotation.z=rot}function statue(t,c){const g=new THREE.Group(),m=mat(c),dark=mat(c==='w'?'b':'w');g.userData.type=t;cyl(g,.78,.9,.22,.11,m);cyl(g,.62,.7,.16,.29,m);band(g,.59,.37,.13,m);band(g,.48,.53,.09,m);if(t==='p'){lathe(g,[[.46,0],[.39,.22],[.31,.55],[.34,.82],[.24,1.08]],.42,m);band(g,.34,1.02,.08,m);sph(g,.29,1.63,m);cyl(g,.31,.27,.12,1.78,m);crack(g,.28,1.05,.18,-.45,dark)}if(t==='r'){lathe(g,[[.5,0],[.43,.22],[.38,.72],[.46,1.12]],.42,m);band(g,.45,1.04,.1,m);cyl(g,.51,.51,.18,1.2,m);for(let i=0;i<6;i++){const a=i*Math.PI/3;mesh(g,new THREE.BoxGeometry(.16,.3,.18),m,Math.cos(a)*.39,1.39,Math.sin(a)*.39)}crack(g,-.18,.9,.28,.3,dark)}if(t==='b'){lathe(g,[[.48,0],[.4,.24],[.3,.62],[.26,1.12]],.42,m);band(g,.32,1.02,.08,m);lathe(g,[[.25,0],[.18,.18],[.22,.42]],1.45,m);sph(g,.23,1.94,m);const q=mesh(g,new THREE.BoxGeometry(.07,.55,.09),dark,.03,1.96,.19);q.rotation.z=-.38;crack(g,.12,.86,.25,-.7,dark)}if(t==='q'){lathe(g,[[.5,0],[.41,.25],[.31,.7],[.28,1.15]],.42,m);band(g,.34,1.08,.09,m);lathe(g,[[.3,0],[.23,.2],[.3,.42]],1.48,m);sph(g,.29,1.96,m);cyl(g,.19,.23,.18,2.18,m);for(let i=0;i<5;i++){const a=i*2*Math.PI/5;mesh(g,new THREE.ConeGeometry(.055,.25,8),m,Math.cos(a)*.18,2.37,Math.sin(a)*.18)}crack(g,-.17,1.15,.2,-.25,dark)}if(t==='k'){lathe(g,[[.52,0],[.43,.25],[.34,.7],[.3,1.15]],.42,m);band(g,.36,1.08,.1,m);lathe(g,[[.31,0],[.23,.2],[.32,.48]],1.48,m);sph(g,.3,1.99,m);cyl(g,.2,.24,.18,2.22,m);mesh(g,new THREE.BoxGeometry(.08,.4,.08),m,0,2.48,0);mesh(g,new THREE.BoxGeometry(.3,.08,.08),m,0,2.5,0);crack(g,.16,1.18,.22,.55,dark)}if(t==='n'){lathe(g,[[.51,0],[.42,.25],[.34,.62]],.42,m);band(g,.37,.78,.08,m);const s=new THREE.Shape();s.moveTo(-.32,0);s.lineTo(-.27,.55);s.lineTo(-.18,1.05);s.lineTo(-.04,1.45);s.lineTo(.22,1.62);s.lineTo(.43,1.45);s.lineTo(.36,1.2);s.lineTo(.12,1.03);s.lineTo(.18,.7);s.lineTo(.34,.35);s.lineTo(.26,0);s.closePath();const q=mesh(g,new THREE.ExtrudeGeometry(s,{depth:.5,bevelEnabled:true,bevelSegments:3,bevelSize:.055}),m,-.22,.72,-.25);q.rotation.y=-.12;mesh(g,new THREE.ConeGeometry(.09,.22,8),m,-.08,2.1,.01);for(let i=0;i<4;i++)mesh(g,new THREE.BoxGeometry(.06,.35,.06),m,-.38+i*.11,1.48,-.27-i*.015);crack(g,.08,1.1,-.51,-.3,dark)}g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}load(45);function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x050504);scene.fog=new THREE.FogExp2(0x050504,.014);camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,18,21);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=11;controls.maxDistance=32;controls.maxPolarAngle=Math.PI*.48;ray=new THREE.Raycaster();mouse=new THREE.Vector2();scene.add(new THREE.HemisphereLight(0xbeb7aa,0x090807,1.7));const l=new THREE.DirectionalLight(0xffdfad,4);l.position.set(-10,21,8);l.castShadow=true;l.shadow.mapSize.set(1024,1024);scene.add(l);const blue=new THREE.PointLight(0x8daee0,13,34);blue.position.set(8,10,-9);scene.add(blue);const fire=new THREE.PointLight(0xff8e48,13,30);fire.position.set(-10,5,10);scene.add(fire);mesh(scene,new THREE.BoxGeometry(21,.9,21),new THREE.MeshStandardMaterial({color:0x18130f,roughness:1}),0,-.48,0);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=mesh(scene,new THREE.BoxGeometry(1.96,.34,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x37342f:0x827969,roughness:.96}),(c-3.5)*2,0,(r-3.5)*2);q.userData={r,c};tiles.push(q)}for(const [x,z] of [[-12,-9],[12,-9],[-12,9],[12,9]])mesh(scene,new THREE.CylinderGeometry(1,1.3,11,20),new THREE.MeshStandardMaterial({color:0x2d2a26,roughness:1}),x,5,z);sync();load(78);setTimeout(()=>{load(100);setTimeout(()=>document.getElementById('load').remove(),250)},300);events();animate()}function square(r,c){return new THREE.Vector3((c-3.5)*2,.23,(r-3.5)*2)}function key(r,c){return r+','+c}function clearMarkers(){for(const m of markers)scene.remove(m);markers=[]}function showMoves(p){clearMarkers();if(!p)return;const from='abcdefgh'[p.c]+(8-p.r),moves=game.moves({square:from,verbose:true});for(const mv of moves){const r=8-+mv.to[1],c='abcdefgh'.indexOf(mv.to[0]),g=new THREE.Group();g.position.copy(square(r,c));const ring=new THREE.Mesh(new THREE.TorusGeometry(.42,.055,10,32),new THREE.MeshBasicMaterial({color:0x3d9dff,transparent:true,opacity:.95}));ring.rotation.x=Math.PI/2;g.add(ring);const dot=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.025,20),new THREE.MeshBasicMaterial({color:0x59b5ff,transparent:true,opacity:.65}));g.add(dot);scene.add(g);markers.push(g)}}function sync(){for(const p of pieces.values())scene.remove(p);pieces.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const g=statue(p.type,p.color);g.position.copy(square(r,c));g.userData={r,c,color:p.color,type:p.type};scene.add(g);pieces.set(key(r,c),g)}if(selected)showMoves(selected);status()}function status(){const turn=game.turn()==='w'?'白':'黒';let s=turn+'の番';if(game.isCheckmate())s=(turn==='w'?'黒':'白')+'の勝利！ チェックメイト';else if(game.isStalemate()||game.isDraw())s='引き分け';else if(game.isCheck())s+=' — 王手！';document.getElementById('status').textContent=s}function hit(e,objs){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(objs,true)}function pieceHit(e){const h=hit(e,[...pieces.values()]);if(!h.length)return null;let o=h[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o.userData}function tileHit(e){const h=hit(e,tiles);return h.length?h[0].object.userData:null}function click(e){if(busy||game.isGameOver()||game.turn()!=='w')return;const p=pieceHit(e),t=tileHit(e);if(p&&p.color==='w'){selected=p;showMoves(p);return}if(selected&&t){const f='abcdefgh'[selected.c]+(8-selected.r),to='abcdefgh'[t.c]+(8-t.r),m=game.moves({square:f,verbose:true}).find(x=>x.to===to);if(m)move(selected,m)}}function move(p,m){busy=true;clearMarkers();const from='abcdefgh'[p.c]+(8-p.r),to=m.to,g=pieces.get(key(p.r,p.c));let cap=pieces.get(key(8-+to[1],'abcdefgh'.indexOf(to[0])));if(m.flags?.includes('e'))cap=pieces.get(key(p.r+(p.color==='w'?1:-1),'abcdefgh'.indexOf(to[0])));if(cap){play('capture');cap.scale.setScalar(.01)}else play('move');let san;try{san=game.move({from,to,promotion:'q'}).san}catch(e){busy=false;return}const d=square(8-+to[1],'abcdefgh'.indexOf(to[0])),o=g.position.clone(),st=performance.now();function a(){let z=Math.min(1,(performance.now()-st)/450),ee=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;g.position.lerpVectors(o,d,ee);g.position.y+=Math.sin(ee*Math.PI)*.4;if(z<1)requestAnimationFrame(a);else{sync();document.getElementById('log').innerHTML+='<div>'+game.history().length+'. '+san+'</div>';busy=false;if(game.isCheck())play(game.isCheckmate()?'mate':'check');if(game.isGameOver()){if(game.isCheckmate())victory(game.turn()==='w'?'黒':'白');else drawEffect('引き分け');return}if(game.turn()==='b')setTimeout(ai,260)}}a()}function ai(){if(game.isGameOver()||game.turn()!=='b')return;busy=true;const lv=+document.getElementById('level').value,ms=game.moves({verbose:true});let chosen=ms[Math.floor(Math.random()*ms.length)];if(lv>1){let best=-1e9,arr=[];for(const m of ms){game.move(m);const v=-simpleEval(game);game.undo();if(v>best){best=v;arr=[m]}else if(v===best)arr.push(m)}chosen=arr[Math.floor(Math.random()*arr.length)]||chosen}const p={r:8-+chosen.from[1],c:'abcdefgh'.indexOf(chosen.from[0]),color:'b'};setTimeout(()=>move(p,chosen),180)}function simpleEval(g){const v={p:100,n:320,b:330,r:500,q:900,k:20000};let s=0;for(const row of g.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*v[p.type];return s}function victory(winner){document.getElementById('victoryTitle').textContent='⚔ 勝利！';document.getElementById('victoryText').textContent=winner+'の石像がチェックメイトで勝利しました';document.getElementById('victory').classList.add('show');burstEffect();play('mate')}function drawEffect(text){document.getElementById('victoryTitle').textContent='対局終了';document.getElementById('victoryText').textContent=text;document.getElementById('victory').classList.add('show')}function burstEffect(){for(let i=0;i<120;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0xf0d58c,transparent:true}));m.position.set((Math.random()-.5)*7,.5,(Math.random()-.5)*7);m.userData.v=new THREE.Vector3((Math.random()-.5)*.035,Math.random()*.07+.025,(Math.random()-.5)*.035);scene.add(m);burst.push(m)}}function undo(){if(busy||!game.history().length)return;document.getElementById('victory').classList.remove('show');game.undo();if(game.turn()==='b'&&game.history().length)game.undo();document.getElementById('log').innerHTML='';selected=null;clearMarkers();sync()}function newGame(){if(busy)return;document.getElementById('victory').classList.remove('show');game=new Chess();document.getElementById('log').innerHTML='';selected=null;clearMarkers();sync()}function play(t){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain(),d={move:[180,.07],capture:[72,.16],check:[420,.13],mate:[55,.3]}[t]||[180,.07];o.connect(g);g.connect(audio.destination);o.frequency.value=d[0];o.type='sine';g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.1,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d[1]);o.start();o.stop(audio.currentTime+d[1]+.03)}catch(e){}}function events(){renderer.domElement.addEventListener('pointerdown',click);document.getElementById('new').onclick=newGame;document.getElementById('again').onclick=newGame;document.getElementById('undo').onclick=undo;document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}function animate(){requestAnimationFrame(animate);controls.update();const now=performance.now();markers.forEach((m,i)=>{const s=1+.12*Math.sin(now*.006+i);m.scale.setScalar(s);m.children[0].material.opacity=.65+.3*Math.sin(now*.006+i)});for(let i=burst.length-1;i>=0;i--){const m=burst[i];m.position.add(m.userData.v);m.userData.v.y-=.0015;m.material.opacity-=.008;if(m.material.opacity<=0){scene.remove(m);burst.splice(i,1)}}renderer.render(scene,camera)}try{load(5);init()}catch(e){console.error(e);document.getElementById('err').style.display='block';document.getElementById('err').textContent='読み込みに失敗しました: '+e.message}</script></body></html>
