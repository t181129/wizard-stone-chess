<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>魔法使いの石像チェス</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:#eee;font-family:Georgia,"Yu Mincho",serif}#three{position:fixed;inset:0}.top{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 4px 14px #000;pointer-events:none;white-space:nowrap}.top h1{margin:0;color:#e5d09b;font-size:clamp(20px,4vw,38px);letter-spacing:.1em}.top p{margin:4px;color:#bdb09a;font-size:12px}.panel{position:fixed;z-index:6;left:10px;top:10px;width:215px;padding:10px;background:#0d0c0be8;border:1px solid #735e3d;border-radius:10px;box-shadow:0 12px 35px #000b;backdrop-filter:blur(5px)}.info{left:auto;right:10px}.status{text-align:center;color:#ead39b;font-weight:bold;font-size:17px;min-height:23px}button,select{width:100%;margin:4px 0;padding:8px;border:1px solid #735e3d;border-radius:7px;background:#211b14;color:#eee;font:inherit}.hint{font:11px/1.45 system-ui;color:#aaa}.pieceInfo{font:13px/1.7 system-ui;color:#ddd0b2}.pieceInfo b{color:#f0d58c}.victory{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:radial-gradient(circle,#d9b65b22,#050504dd 62%);backdrop-filter:blur(3px)}.victory.show{display:grid}.victoryBox{width:min(430px,86vw);padding:28px;text-align:center;border:1px solid #b99b5a;border-radius:16px;background:#0b0907ee;box-shadow:0 0 60px #d8b65a55,0 20px 60px #000}.victoryBox h2{margin:0 0 8px;font-size:46px;color:#f0d58c;text-shadow:0 0 20px #d9b65a}.victoryBox p{margin:8px;color:#ddd0b2}.error{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:#050504;color:#e7d39e;text-align:center;padding:25px}.error.show{display:grid}.errorBox{max-width:500px;border:1px solid #765f3c;border-radius:14px;padding:25px;background:#11100e}.errorBox p{font:14px/1.7 system-ui;color:#ccc}@media(max-width:700px){.panel{width:154px;top:auto;bottom:8px;left:8px;padding:7px}.info{left:auto;right:8px}.hint,.top p{display:none}.top h1{font-size:20px}button,select{padding:7px}.pieceInfo{font-size:11px;line-height:1.55}}
</style>
</head>
<body>
<div id="three"></div>
<div class="top"><h1>魔法使いの石像チェス</h1><p>巨大な彫刻兵士が古代の大広間で戦う</p></div>
<div class="panel"><div id="status" class="status">読み込み中…</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">音 OFF</button><div class="hint">白い石像をタップ → 青い場所へ移動。盤面をドラッグすると視点を回転。</div></div>
<div class="panel info"><b>タップした駒</b><div id="pieceInfo" class="pieceInfo">駒をタップすると<br>ここに情報が表示されます。</div></div>
<div id="victory" class="victory"><div class="victoryBox"><h2 id="vt">勝利！</h2><p id="vx">チェックメイト</p><button id="again">もう一度対局</button></div></div>
<div id="error" class="error"><div class="errorBox"><h2>読み込みエラー</h2><p>ゲーム用ライブラリを読み込めませんでした。通信を確認してページを再読み込みしてください。</p></div></div>
<script type="module">
(async()=>{
let THREE,OrbitControls,Chess;
try{const mods=await Promise.all([
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'),
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js'),
 import('https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm')
]);THREE=mods[0];OrbitControls=mods[1].OrbitControls;Chess=mods[2].Chess}catch(e){console.error(e);document.getElementById('error').classList.add('show');return}
const $=id=>document.getElementById(id),root=$('three');
let scene,camera,renderer,controls,ray,mouse,game=new Chess(),pieces=new Map(),tiles=[],markers=[],selected=null,busy=false,soundOn=false,audio=null,phase=0,burst=[];
const names={p:'ポーン',n:'ナイト',b:'ビショップ',r:'ルーク',q:'クイーン',k:'キング'};
const val={p:100,n:320,b:330,r:500,q:900,k:20000};
function stone(c){const dark=c==='b',cv=document.createElement('canvas');cv.width=cv.height=192;const x=cv.getContext('2d'),v=dark?55:168;x.fillStyle=`rgb(${v},${v+1},${v+3})`;x.fillRect(0,0,192,192);const im=x.getImageData(0,0,192,192);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*9;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);return new THREE.MeshStandardMaterial({color:dark?0x383a3c:0xd5d0c4,map:new THREE.CanvasTexture(cv),roughness:.92,metalness:0})}
const MW=stone('w'),MB=stone('b'),EDGE=new THREE.MeshStandardMaterial({color:0x514940,roughness:1});
function add(g,geo,m,x=0,y=0,z=0){const q=new THREE.Mesh(geo,m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;g.add(q);return q}
function cyl(g,a,b,h,y,m){return add(g,new THREE.CylinderGeometry(a,b,h,40),m,0,y)}
function lathe(g,p,y,m){return add(g,new THREE.LatheGeometry(p,48),m,0,y)}
function sph(g,r,x,y,z,m){return add(g,new THREE.SphereGeometry(r,32,24),m,x,y,z)}
function rounded(g,w,h,d,x,y,z,m){return add(g,new THREE.BoxGeometry(w,h,d),m,x,y,z)}
function face(g,m,r,y){sph(g,r,0,y,0,m);for(const s of[-1,1]){sph(g,.08*r,s*.34*r,y+.01,.90*r,m);const brow=rounded(g,.38*r,.055*r,.06*r,s*.34*r,y+.27*r,.87*r,m);brow.rotation.z=-s*.12}const nose=rounded(g,.16*r,.30*r,.12*r,0,y-.02*r,.91*r,m);nose.rotation.x=.18;rounded(g,.40*r,.05*r,.06*r,0,y-.42*r,.88*r,m)}
function base(g,m){cyl(g,.72,.98,.18,.09,m);cyl(g,.61,.75,.16,.25,m);lathe(g,[[.55,0],[.50,.10],[.45,.24],[.39,.34]],.36,m)}
function armor(g,m,s){for(const x of[-1,1]){const sh=sph(g,.18*s,x*.37*s,1.12*s,0,m);sh.scale.set(1.5,.62,.95);rounded(g,.19*s,.60*s,.24*s,x*.47*s,.88*s,0,m);sph(g,.12*s,x*.57*s,.56*s,.02,m)}rounded(g,.60*s,.45*s,.16*s,0,.91*s,.30*s,m);rounded(g,.52*s,.20*s,.20*s,0,.70*s,.22*s,m)}
function legs(g,m,s){for(const x of[-1,1]){rounded(g,.20*s,.48*s,.22*s,x*.20*s,.46*s,0,m);sph(g,.13*s,x*.20*s,.24*s,0,m);rounded(g,.18*s,.52*s,.23*s,x*.20*s,.08*s,.02,m);rounded(g,.27*s,.15*s,.38*s,x*.20*s,-.20*s,-.07,m)}}
function crown(g,m,y,r,king=false){cyl(g,r*.70,r*.78,.13,y+.23,m);for(let i=0;i<(king?5:7);i++){const a=i*Math.PI*2/(king?5:7),q=add(g,new THREE.ConeGeometry(r*.10,r*.38,10),m,Math.cos(a)*r*.64,y+.49,Math.sin(a)*r*.64);q.rotation.z=.10}}
function soldier(g,m,s,gear='none'){base(g,m);legs(g,m,s);lathe(g,[[.49*s,0],[.44*s,.22],[.37*s,.62],[.33*s,1.00],[.29*s,1.28]],.38*s,m);armor(g,m,s);face(g,m,.30*s,1.68*s);if(gear==='crown')crown(g,m,1.68*s,.30*s);if(gear==='king')crown(g,m,2.02*s,.34*s,true)}
function knight(g,m){
// A single sculptural horse silhouette with a carved human rider seated on its back.
base(g,m);
const body=lathe(g,[[.46,0],[.62,.12],[.68,.30],[.60,.50],[.46,.70],[.36,.88]],.42,m);body.rotation.z=Math.PI/2;body.scale.set(1,1,1.18);
for(const s of[-1,1]){lathe(g,[[.15,0],[.13,.20],[.12,.48]],.04,m).position.x=s*.36;rounded(g,.22,.14,.34,s*.36,-.06,-.02,m)}
const neck=lathe(g,[[.37,0],[.34,.24],[.31,.52],[.27,.80]],.78,m);neck.rotation.z=-.18;neck.position.x=.25;
const head=lathe(g,[[.27,0],[.30,.18],[.25,.42],[.17,.62],[.09,.76]],1.55,m);head.position.x=.42;
for(const s of[-1,1]){const ear=add(g,new THREE.ConeGeometry(.09,.27,12),m,.34+s*.13,2.29,.02);ear.rotation.z=s*.23;sph(g,.035,.49,1.88,s*.18,m)}
for(let i=0;i<5;i++){const mane=add(g,new THREE.ConeGeometry(.11,.38,12),m,.08+i*.08,1.93+i*.07,-.16);mane.rotation.z=-.72}
const rider=new THREE.Group();rider.position.set(.02,2.14,0);rider.scale.setScalar(.72);soldier(rider,m,.82,'crown');g.add(rider);
}
function statue(t,c){const g=new THREE.Group(),m=c==='w'?MW:MB;g.userData.anim={phase:Math.random()*6.28,moving:false};g.scale.setScalar(1.25);if(t==='n')knight(g,m);else if(t==='k')soldier(g,m,1.12,'king');else if(t==='q')soldier(g,m,1.08,'crown');else if(t==='r')soldier(g,m,1.00,'crown');else if(t==='b')soldier(g,m,1.00,'none');else soldier(g,m,.88,'none');g.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});return g}
function pos(s){return new THREE.Vector3((s.charCodeAt(0)-97-3.5)*2,.23,(parseInt(s[1])-1-3.5)*-2)}
function key(s){return s}
function makeBoard(){add(scene,new THREE.BoxGeometry(28,1,28),new THREE.MeshStandardMaterial({color:0x14110e,roughness:1}),0,-.55,0);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=add(scene,new THREE.BoxGeometry(1.96,.34,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x37332e:0x81786b,roughness:1}),(c-3.5)*2,0,(r-3.5)*2);q.userData.square='abcdefgh'[c]+(8-r);tiles.push(q)}for(const z of[-8.35,8.35])add(scene,new THREE.BoxGeometry(17,.45,.55),EDGE,0,.25,z);for(const x of[-8.35,8.35])add(scene,new THREE.BoxGeometry(.55,.45,17),EDGE,x,.25,0)}
function makeHall(){for(const x of[-12,12])for(const z of[-9,9])add(scene,new THREE.CylinderGeometry(1.2,1.55,13,32),new THREE.MeshStandardMaterial({color:0x2a2723,roughness:1}),x,5.8,z);for(const x of[-7,7]){add(scene,new THREE.CylinderGeometry(.20,.27,2.8,24),EDGE,x,3.5,-10.5);const l=new THREE.PointLight(0xff9148,15,18);l.position.set(x,4.8,-9.6);scene.add(l)}}
function clearMarkers(){markers.forEach(m=>scene.remove(m));markers=[]}
function showMoves(s){clearMarkers();if(!s)return;for(const mv of game.moves({square:s,verbose:true})){const g=new THREE.Group();g.position.copy(pos(mv.to));add(g,new THREE.TorusGeometry(.44,.065,12,36),new THREE.MeshBasicMaterial({color:0x2e9bff,transparent:true,opacity:.95})).rotation.x=Math.PI/2;add(g,new THREE.CylinderGeometry(.13,.13,.03,20),new THREE.MeshBasicMaterial({color:0x69c5ff,transparent:true,opacity:.75}));g.userData.square=mv.to;scene.add(g);markers.push(g)}}
function selectedInfo(s){const p=game.get(s);if(!p){$('pieceInfo').innerHTML='駒をタップすると<br>ここに情報が表示されます。';return}$('pieceInfo').innerHTML=`<b>${p.color==='w'?'白':'黒'}の${names[p.type]}</b><br>位置：${s.toUpperCase()}<br>駒の種類：${p.type.toUpperCase()}<br>青い場所＝移動可能`}
function rebuild(){for(const g of pieces.values())scene.remove(g);pieces.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const s='abcdefgh'[c]+(8-r),g=statue(p.type,p.color);g.position.copy(pos(s));g.userData.square=s;g.userData.color=p.color;g.userData.type=p.type;g.userData.anim.phase=Math.random()*6.28;scene.add(g);pieces.set(s,g)}}
function sync(){rebuild();if(selected){if(game.get(selected))showMoves(selected);else{selected=null;selectedInfo(null)}}status()}
function status(){if(game.isCheckmate()){$('status').textContent=(game.turn()==='w'?'黒':'白')+'の勝利！ チェックメイト';return}if(game.isDraw()||game.isStalemate()){$('status').textContent='引き分け';return}$('status').textContent=(game.turn()==='w'?'白':'黒')+'の番'+(game.isCheck()?' — 王手！':'')}
function rayPick(e,list){const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(list,true)}
function pieceAt(e){const h=rayPick(e,[...pieces.values()]);if(!h.length)return null;let o=h[0].object;while(o&&!o.userData.square)o=o.parent;return o?.userData?.square||null}
function tileAt(e){const h=rayPick(e,tiles);return h.length?h[0].object.userData.square:null}
function move(from,to){if(busy)return;const mv=game.moves({square:from,verbose:true}).find(m=>m.to===to);if(!mv)return;busy=true;clearMarkers();const g=pieces.get(from),old=g?.position.clone()||pos(from),dest=pos(to),cap=pieces.get(to);game.move({from,to,promotion:'q'});if(cap)cap.visible=false;if(g){g.userData.anim.moving=true;const start=performance.now();function walk(){const k=Math.min(1,(performance.now()-start)/760),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;g.position.lerpVectors(old,dest,e);g.position.y+=Math.sin(e*Math.PI)*.42;g.rotation.z=Math.sin(e*Math.PI*6)*.035;g.rotation.x=Math.sin(e*Math.PI*6)*.025;if(k<1)requestAnimationFrame(walk);else{g.position.copy(dest);g.rotation.set(0,0,0);g.userData.anim.moving=false;finish()}}walk()}else finish();function finish(){selected=null;selectedInfo(null);sync();busy=false;if(game.isGameOver()){end();return}if(game.turn()==='b')setTimeout(ai,260)}}
function ai(){if(busy||game.turn()!=='b'||game.isGameOver())return;const moves=game.moves({verbose:true});if(!moves.length)return;let best=moves[0],bestScore=-1e9,lv=+$('level').value;for(const m of moves){game.move(m);let score=-evaluate(game);if(lv>1)score+=Math.random()*18;game.undo();if(score>bestScore){bestScore=score;best=m}}move(best.from,best.to)}
function evaluate(g){let s=0;for(const row of g.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*val[p.type];return s}
function end(){if(game.isCheckmate()){$('vt').textContent='⚔ '+(game.turn()==='w'?'黒':'白')+'の勝利！';$('vx').textContent='チェックメイト';$('victory').classList.add('show')}else{$('vt').textContent='対局終了';$('vx').textContent='引き分け';$('victory').classList.add('show')}}
function newGame(){if(busy)return;game=new Chess();selected=null;clearMarkers();$('victory').classList.remove('show');burst.forEach(q=>scene.remove(q));burst=[];selectedInfo(null);sync()}
function undo(){if(busy||!game.history().length)return;game.undo();if(game.turn()==='b'&&game.history().length)game.undo();newGameVisual()}
function newGameVisual(){selected=null;clearMarkers();$('victory').classList.remove('show');selectedInfo(null);sync()}
function audioTone(f){if(!soundOn)return;try{audio=audio||new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.value=.035;o.start();o.stop(audio.currentTime+.08)}catch(e){}}
function events(){renderer.domElement.addEventListener('pointerup',e=>{if(busy||game.isGameOver()||game.turn()!=='w')return;const p=pieceAt(e),t=tileAt(e);if(p){const pc=game.get(p);if(pc&&pc.color==='w'){selected=p;selectedInfo(p);showMoves(p);audioTone(240)}return}if(selected&&t){if(markers.some(m=>m.userData.square===t))move(selected,t)}});$('new').onclick=newGame;$('again').onclick=newGame;$('undo').onclick=undo;$('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x050504);scene.fog=new THREE.FogExp2(0x050504,.0105);camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,17,22);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.03;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=10;controls.maxDistance=31;controls.maxPolarAngle=Math.PI*.47;ray=new THREE.Raycaster();mouse=new THREE.Vector2();scene.add(new THREE.HemisphereLight(0xcac2b3,0x070605,1.35));const sun=new THREE.DirectionalLight(0xffdfb0,4.1);sun.position.set(-12,22,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const fill=new THREE.PointLight(0x829dcc,8,40);fill.position.set(8,10,-8);scene.add(fill);makeBoard();makeHall();sync();events()}
function animate(){requestAnimationFrame(animate);phase+=.016;controls.update();markers.forEach((m,i)=>m.scale.setScalar(1+.14*Math.sin(performance.now()*.006+i)));for(const g of pieces.values()){const a=g.userData.anim;if(a&&!a.moving)g.position.y=.23+Math.sin(phase*1.2+a.phase)*.006}renderer.render(scene,camera)}
try{init();animate()}catch(e){console.error(e);$('error').classList.add('show')}
})();
</script>
</body>
</html>
