<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>魔法使いの石像チェス</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050504;color:#eee;font-family:Georgia,'Yu Mincho',serif}#three{position:fixed;inset:0}.load{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle,#292017,#050504 72%);color:#dfc27c}.loader{width:min(360px,82vw);text-align:center}.title{font-size:22px;letter-spacing:.1em}.bar{height:8px;margin:18px 0 9px;border:1px solid #7d6540;border-radius:8px;overflow:hidden;background:#15110d}.bar i{display:block;width:0;height:100%;background:#d2b36d;transition:width .2s}.pct{font-size:14px}.top{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:0 4px 12px #000;pointer-events:none;white-space:nowrap}.top h1{margin:0;color:#e5d09b;font-size:clamp(20px,4vw,38px);letter-spacing:.1em}.top p{margin:3px;color:#bdb09a;font-size:12px}.panel{position:fixed;z-index:6;left:10px;top:10px;width:215px;padding:10px;background:#0d0c0be8;border:1px solid #735e3d;border-radius:10px;box-shadow:0 12px 35px #000b;backdrop-filter:blur(5px)}.right{left:auto;right:10px}.status{text-align:center;color:#ead39b;font-weight:bold;font-size:17px;min-height:23px}button,select{width:100%;margin:4px 0;padding:8px;border:1px solid #735e3d;border-radius:7px;background:#211b14;color:#eee;font:inherit}.hint,.log{font:11px/1.45 system-ui;color:#aaa}.log{height:150px;overflow:auto;color:#ccc0aa}.victory{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:radial-gradient(circle,#d9b65b22,#050504d9 62%);backdrop-filter:blur(3px)}.victory.show{display:grid}.victoryBox{width:min(430px,86vw);padding:28px;text-align:center;border:1px solid #b99b5a;border-radius:16px;background:#0b0907ee;box-shadow:0 0 60px #d8b65a55,0 20px 60px #000}.victoryBox h2{margin:0 0 8px;font-size:44px;color:#f0d58c;text-shadow:0 0 20px #d9b65a}.victoryBox p{margin:8px;color:#ddd0b2}@media(max-width:700px){.panel{width:151px;top:auto;bottom:8px;left:8px;padding:7px}.right{display:none}.hint,.top p{display:none}.top h1{font-size:20px}button,select{padding:7px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="load" class="load"><div class="loader"><div class="title">巨大な石の兵士を召喚中</div><div class="bar"><i id="bar"></i></div><div id="pct">0%</div></div></div><div id="three"></div><div class="top"><h1>⚔ 魔法使いの石像チェス</h1><p>巨大な彫刻兵士が古代の大広間で戦う</p></div><div class="panel"><div id="status" class="status">読み込み中…</div><button id="new">新しい対局</button><button id="undo">1手戻す</button><label>AI強さ<select id="level"><option value="1">見習い</option><option value="2" selected>魔法使い</option><option value="3">大魔法使い</option></select></label><button id="sound">🔊 音 ON</button><div class="hint">白い石像をタップ → 青く光る場所へ移動。盤面をドラッグすると視点を回転。</div></div><div class="panel right"><b>戦闘記録</b><div id="log" class="log"></div></div><div id="victory" class="victory"><div class="victoryBox"><h2 id="vt">⚔ 勝利！</h2><p id="vx">チェックメイト</p><button id="again">もう一度対局</button></div></div><script type="module">import*as THREE from'three';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';import{Chess}from'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';const $=id=>document.getElementById(id),root=$('three'),bar=$('bar'),pct=$('pct');let loadN=0,scene,camera,renderer,controls,ray,mouse,game=new Chess,pcs=new Map,tiles=[],markers=[],selected=null,busy=false,soundOn=true,audio,burst=[];function load(n){loadN=Math.max(loadN,n);bar.style.width=loadN+'%';pct.textContent=loadN+'%'}
function mat(c){const dark=c==='b',cv=document.createElement('canvas');cv.width=cv.height=512;const x=cv.getContext('2d'),v=dark?46:166;x.fillStyle=`rgb(${v},${v+2},${v+5})`;x.fillRect(0,0,512,512);const im=x.getImageData(0,0,512,512);for(let i=0;i<im.data.length;i+=4){const n=(Math.random()-.5)*30;im.data[i]+=n;im.data[i+1]+=n;im.data[i+2]+=n}x.putImageData(im,0,0);for(let i=0;i<380;i++){x.strokeStyle=`rgba(5,5,5,${.025+Math.random()*.13})`;x.lineWidth=.5+Math.random()*2.2;x.beginPath();let a=Math.random()*512,b=Math.random()*512;x.moveTo(a,b);for(let j=0;j<6;j++){a+=(Math.random()-.5)*55;b+=(Math.random()-.5)*55;x.lineTo(a,b)}x.stroke()}return new THREE.MeshStandardMaterial({color:dark?0x35383a:0xd8d2c6,map:new THREE.CanvasTexture(cv),roughness:.98,metalness:0})}const mw=mat('w'),mb=mat('b');function add(g,geo,m,x=0,y=0,z=0){const q=new THREE.Mesh(geo,m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;g.add(q);return q}function cy(g,a,b,h,y,m,s=32){return add(g,new THREE.CylinderGeometry(a,b,h,s),m,0,y)}function la(g,p,y,m){return add(g,new THREE.LatheGeometry(p,48),m,0,y)}function to(g,r,y,w,m){return add(g,new THREE.TorusGeometry(r,w,12,48),m,0,y)}function sp(g,r,y,m){return add(g,new THREE.SphereGeometry(r,32,24),m,0,y)}function bx(g,w,h,d,x,y,z,m){return add(g,new THREE.BoxGeometry(w,h,d),m,x,y,z)}function limb(g,m,x,y,z,sx,sy,sz,rot=0){const q=bx(g,sx,sy,sz,x,y,z,m);q.rotation.z=rot;return q}
function base(g,m){cy(g,.78,.99,.25,.13,m);cy(g,.68,.79,.16,.33,m);to(g,.64,.45,.06,m);to(g,.54,.58,.04,m);la(g,[[.57,0],[.52,.09],[.48,.18],[.43,.31]],.41,m);for(let i=0;i<4;i++)to(g,.39-i*.04,.68+i*.08,.025,m)}
function torso(g,m,wide=1){la(g,[[.49*wide,0],[.55*wide,.18],[.47*wide,.48],[.38*wide,.84],[.31,.98]],.43,m);to(g,.43*wide,.82,.045,m);to(g,.40*wide,1.02,.04,m)}
function face(g,m,r,y,accent){sp(g,r,y,m);to(g,r*.91,y+.08,.018,m);for(const s of[-1,1]){const eye=sp(g,.042,y+.01,accent);eye.position.set(s*r*.34,y+.01,r*.88);eye.scale.set(.7,.7,.2);const brow=bx(g,r*.48,.035,.045,s*r*.32,y+.09,r*.88,m);brow.rotation.z=s*.18}const nose=bx(g,.055,.15,.08,0,y-.035,r*.9,m);const mouth=bx(g,r*.38,.025,.025,0,y-.13,r*.89,accent);return nose}
function shoulder(g,m,s){const x=s*.43;sp(g,.16,1.13,m).position.x=x;const sh=sp(g,.25,1.08,m);sh.position.set(x,1.08,0);sh.scale.set(1.25,.7,.85);limb(g,m,s*.45,.87,.01,.18,.70,.20,-s*.20);limb(g,m,s*.57,.60,.05,.17,.35,.18,s*.42)}
function sword(g,m,s){const h=bx(g,.10,1.25,.12,s*.73,1.04,.04,m);h.rotation.z=s*.14;bx(g,.42,.09,.15,s*.73,.43,.04,m);bx(g,.13,.20,.13,s*.73,.31,.04,m);const pom=sp(g,.075,.20,m);pom.position.set(s*.73,.19,.04)}
function shield(g,m,s){const sh=new THREE.Shape();sh.moveTo(0,.48);sh.lineTo(.30,.28);sh.lineTo(.25,-.25);sh.lineTo(0,-.55);sh.lineTo(-.25,-.25);sh.lineTo(-.30,.28);sh.closePath();const q=add(g,new THREE.ExtrudeGeometry(sh,{depth:.10,bevelEnabled:true,bevelSegments:3,bevelSize:.035}),m,s*.62,.94,.23);q.scale.set(.72,.95,.72);q.rotation.y=s*.08;to(g,.24,1.0,.018,m).position.z=.30}
function cracks(g,accent,count=7){for(let i=0;i<count;i++){const q=bx(g,.018,.25+Math.random()*.55,.018,(Math.random()-.5)*.65,.55+Math.random()*1.45,.48,accent);q.rotation.z=(Math.random()-.5)*1.5}}
function helm(g,m,y,r){cy(g,r*.86,r*1.05,.18,y+.18,m);to(g,r,y+.13,.025,m);for(let s of[-1,1])limb(g,m,s*r*.76,y+.05,.03,.08,.42,.08,s*.06)}
function crown(g,m,y,r,king=false){cy(g,r*.65,r*.82,.17,y,m);to(g,r*.75,y+.12,.035,m);const n=king?5:8;for(let i=0;i<n;i++){const a=i*Math.PI*2/n,q=add(g,new THREE.ConeGeometry(.07,.38,8),m,Math.cos(a)*r*.72,y+.35,Math.sin(a)*r*.72);q.rotation.z=.18*Math.cos(a)}}
function statue(t,c){const g=new THREE.Group,m=c==='w'?mw:mb,a=c==='w'?mb:mw;g.scale.setScalar(1.35);base(g,m);if(t==='p'){torso(g,m,.82);face(g,m,.31,1.70,a);helm(g,m,1.72,.34);shoulder(g,m,-1);shoulder(g,m,1);shield(g,m,-1);sword(g,m,1);for(let i=0;i<3;i++)to(g,.25+i*.03,1.28+i*.12,.025,m);cracks(g,a,6)}if(t==='r'){torso(g,m,1.05);cy(g,.54,.58,.28,1.24,m);to(g,.53,1.40,.06,m);for(let i=0;i<8;i++){const z=i*Math.PI/4;bx(g,.19,.38,.19,Math.cos(z)*.42,1.59,Math.sin(z)*.42,m)}face(g,m,.31,1.98,a);helm(g,m,1.97,.35);shoulder(g,m,-1);shoulder(g,m,1);shield(g,m,1);sword(g,m,-1);cracks(g,a,8)}if(t==='b'){torso(g,m,.92);la(g,[[.31,0],[.24,.22],[.29,.52]],1.45,m);face(g,m,.27,2.04,a);helm(g,m,2.04,.29);const staff=bx(g,.065,1.75,.065,.48,1.30,.02,m);staff.rotation.z=.02;to(g,.22,2.29,.028,m);const slit=bx(g,.06,.55,.05,.08,2.04,.25,a);slit.rotation.z=-.43;shoulder(g,m,-1);shoulder(g,m,1);cracks(g,a,8)}if(t==='q'){torso(g,m,.98);la(g,[[.33,0],[.25,.23],[.31,.50]],1.50,m);face(g,m,.32,2.08,a);crown(g,m,2.25,.30,false);shoulder(g,m,-1);shoulder(g,m,1);shield(g,m,-1);sword(g,m,1);to(g,.35,1.30,.035,m);cracks(g,a,9)}if(t==='k'){torso(g,m,1.04);la(g,[[.34,0],[.25,.23],[.32,.54]],1.50,m);face(g,m,.34,2.09,a);crown(g,m,2.25,.32,true);shoulder(g,m,-1);shoulder(g,m,1);shield(g,m,1);sword(g,m,-1);bx(g,.11,.62,.11,0,2.62,0,m);bx(g,.40,.11,.11,0,2.65,0,m);to(g,.38,1.30,.04,m);cracks(g,a,10)}if(t==='n'){la(g,[[.56,0],[.47,.25],[.37,.68]],.43,m);to(g,.43,.77,.045,m);const s=new THREE.Shape;s.moveTo(-.40,0);s.lineTo(-.35,.55);s.lineTo(-.27,1.12);s.lineTo(-.12,1.56);s.lineTo(.10,1.82);s.lineTo(.38,1.67);s.lineTo(.53,1.39);s.lineTo(.35,1.19);s.lineTo(.07,1.08);s.lineTo(.18,.78);s.lineTo(.41,.34);s.lineTo(.30,0);s.closePath();const q=add(g,new THREE.ExtrudeGeometry(s,{depth:.70,bevelEnabled:true,bevelSegments:6,bevelSize:.085,curveSegments:10}),m,-.23,.69,-.35);q.rotation.y=-.10;for(let i=0;i<7;i++)limb(g,m,-.43+i*.12,1.57,-.39,.045,.52,.065,(i%2?-.08:.08));const mane=bx(g,.12,.22,.72,0,2.08,-.40,m);mane.rotation.z=.08;for(let s of[-1,1]){const e=sp(g,.05,2.04,a);e.position.set(.13*s,2.04,-.72)}bx(g,.09,.13,.12,.39,1.48,-.72,a);cracks(g,a,8)}g.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true}});return g}
function init(){scene=new THREE.Scene;scene.background=new THREE.Color(0x050504);scene.fog=new THREE.FogExp2(0x050504,.010);camera=new THREE.PerspectiveCamera(41,innerWidth/innerHeight,.1,100);camera.position.set(0,18.5,23.5);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;root.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=11;controls.maxDistance=33;controls.maxPolarAngle=Math.PI*.47;ray=new THREE.Raycaster;mouse=new THREE.Vector2;scene.add(new THREE.HemisphereLight(0xcac2b3,0x070605,1.5));const sun=new THREE.DirectionalLight(0xffdfb0,4.5);sun.position.set(-13,23,11);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const fill=new THREE.PointLight(0x91b5e8,10,40);fill.position.set(9,11,-10);scene.add(fill);const fire=new THREE.PointLight(0xff8840,13,34);fire.position.set(-11,7,12);scene.add(fire);add(scene,new THREE.BoxGeometry(25,.9,25),new THREE.MeshStandardMaterial({color:0x15120f,roughness:1}),0,-.5);for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=add(scene,new THREE.BoxGeometry(1.96,.36,1.96),new THREE.MeshStandardMaterial({color:(r+c)%2?0x38352f:0x80776a,roughness:1}),(c-3.5)*2,0,(r-3.5)*2);q.userData={r,c};tiles.push(q)}for(const x of[-12,12])for(const z of[-9,9]){const col=add(scene,new THREE.CylinderGeometry(1.1,1.45,12,24),new THREE.MeshStandardMaterial({color:0x2c2925,roughness:1}),x,5.5,z);for(let y=2;y<10;y+=1.4)to(col,.98,y,.06,new THREE.MeshStandardMaterial({color:0x24211e,roughness:1}))}sync();load(78);setTimeout(()=>{load(100);setTimeout(()=>$('load').remove(),350)},350);events();animate()}
const pos=(r,c)=>new THREE.Vector3((c-3.5)*2,.23,(r-3.5)*2),key=(r,c)=>r+','+c;function clear(){markers.forEach(x=>scene.remove(x));markers=[]}function show(p){clear();if(!p)return;const f='abcdefgh'[p.c]+(8-p.r);for(const mv of game.moves({square:f,verbose:true})){const r=8-+mv.to[1],c='abcdefgh'.indexOf(mv.to[0]),g=new THREE.Group;g.position.copy(pos(r,c));const ring=add(g,new THREE.TorusGeometry(.46,.065,12,36),new THREE.MeshBasicMaterial({color:0x35a7ff,transparent:true,opacity:.95}));ring.rotation.x=Math.PI/2;add(g,new THREE.CylinderGeometry(.14,.14,.025,20),new THREE.MeshBasicMaterial({color:0x62c0ff,transparent:true,opacity:.72}));scene.add(g);markers.push(g)}}function sync(){for(const p of pcs.values())scene.remove(p);pcs.clear();const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const g=statue(p.type,p.color);g.position.copy(pos(r,c));g.userData={r,c,color:p.color,type:p.type};scene.add(g);pcs.set(key(r,c),g)}if(selected)show(selected);status()}function status(){const turn=game.turn()==='w'?'白':'黒';let s=turn+'の番';if(game.isCheckmate())s=(turn==='w'?'黒':'白')+'の勝利！ チェックメイト';else if(game.isStalemate()||game.isDraw())s='引き分け';else if(game.isCheck())s+=' — 王手！';$('status').textContent=s}function hit(e,a){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(mouse,camera);return ray.intersectObjects(a,true)}function piece(e){const h=hit(e,[...pcs.values()]);if(!h.length)return null;let o=h[0].object;while(o.parent&&o.userData.r===undefined)o=o.parent;return o.userData.r===undefined?null:o.userData}function tile(e){const h=hit(e,tiles);return h.length?h[0].object.userData:null}function click(e){if(busy||game.isGameOver()||game.turn()!=='w')return;const p=piece(e),t=tile(e);if(p&&p.color==='w'){selected=p;show(p);return}if(selected&&t){const from='abcdefgh'[selected.c]+(8-selected.r),to='abcdefgh'[t.c]+(8-t.r),m=game.moves({square:from,verbose:true}).find(x=>x.to===to);if(m)move(selected,m)}}function move(p,m){busy=true;clear();const from='abcdefgh'[p.c]+(8-p.r),to=m.to,g=pcs.get(key(p.r,p.c)),cap=pcs.get(key(8-+to[1],'abcdefgh'.indexOf(to[0])));if(cap){cap.scale.setScalar(.01);play('capture')}else play('move');let san;try{san=game.move({from,to,promotion:'q'}).san}catch(e){busy=false;return}const d=pos(8-+to[1],'abcdefgh'.indexOf(to[0])),o=g.position.clone(),st=performance.now();function anim(){const z=Math.min(1,(performance.now()-st)/560),e=z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2;g.position.lerpVectors(o,d,e);g.position.y+=Math.sin(e*Math.PI)*.58;if(z<1)requestAnimationFrame(anim);else{selected=null;sync();$('log').innerHTML+='<div>'+game.history().length+'. '+san+'</div>';busy=false;if(game.isCheck())play(game.isCheckmate()?'mate':'check');if(game.isGameOver()){if(game.isCheckmate())win(game.turn()==='w'?'黒':'白');else{$('vt').textContent='対局終了';$('vx').textContent='引き分け';$('victory').classList.add('show')}return}if(game.turn()==='b')setTimeout(ai,240)}}anim()}function ai(){if(game.isGameOver()||game.turn()!=='b')return;busy=true;const lv=+$('level').value,ms=game.moves({verbose:true});let best=ms[Math.floor(Math.random()*ms.length)],score=-1e9;for(const m of ms){game.move(m);const v=-evalg(game);game.undo();if(lv>1&&v>score){score=v;best=m}}const p={r:8-+best.from[1],c:'abcdefgh'.indexOf(best.from[0]),color:'b'};setTimeout(()=>move(p,best),180)}function evalg(g){const v={p:100,n:320,b:330,r:500,q:900,k:20000};let s=0;for(const row of g.board())for(const p of row)if(p)s+=(p.color==='b'?1:-1)*v[p.type];return s}function win(w){$('vt').textContent='⚔ '+w+'の勝利！';$('vx').textContent='チェックメイト — 巨大な石像兵士の戦いが終わりました';$('victory').classList.add('show');for(let i=0;i<170;i++){const q=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0xf0d58c,transparent:true}));q.position.set((Math.random()-.5)*8,.6,(Math.random()-.5)*8);q.userData.v=new THREE.Vector3((Math.random()-.5)*.05,.025+Math.random()*.08,(Math.random()-.5)*.05);scene.add(q);burst.push(q)}play('mate')}function undo(){if(busy||!game.history().length)return;game.undo();if(game.turn()==='b'&&game.history().length)game.undo();$('log').innerHTML='';selected=null;clear();$('victory').classList.remove('show');sync()}function newGame(){if(busy)return;game=new Chess;$('log').innerHTML='';selected=null;clear();burst.forEach(q=>scene.remove(q));burst=[];$('victory').classList.remove('show');sync()}function play(t){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext);const o=audio.createOscillator(),g=audio.createGain(),d={move:[180,.07],capture:[72,.16],check:[420,.13],mate:[55,.3]}[t]||[180,.07];o.connect(g);g.connect(audio.destination);o.frequency.value=d[0];o.type='sine';g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.1,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d[1]);o.start();o.stop(audio.currentTime+d[1]+.03)}catch(e){}}function events(){renderer.domElement.addEventListener('pointerup',click);$('new').onclick=newGame;$('again').onclick=newGame;$('undo').onclick=undo;$('sound').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔊 音 ON':'🔇 音 OFF'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}function animate(){requestAnimationFrame(animate);controls.update();const n=performance.now();markers.forEach((g,i)=>g.scale.setScalar(1+.14*Math.sin(n*.006+i)));for(let i=burst.length-1;i>=0;i--){const q=burst[i];q.position.add(q.userData.v);q.userData.v.y-=.0016;q.material.opacity-=.008;if(q.material.opacity<=0){scene.remove(q);burst.splice(i,1)}}renderer.render(scene,camera)}try{load(5);init()}catch(e){console.error(e)}</script></body></html>
