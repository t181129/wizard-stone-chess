<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Space Crew</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#061018;color:#fff;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(22px,5vw,34px);text-shadow:0 3px 8px #000}
.card{position:absolute;left:10px;top:10px;background:#07121bdd;border:1px solid #526a77;border-radius:12px;padding:10px;min-width:175px;pointer-events:auto}.right{left:auto;right:10px}.bottom{top:auto;bottom:10px}
button{border:0;border-radius:9px;padding:9px 12px;background:#1976a5;color:white;font-weight:800;margin:3px 0}.danger{background:#b52d38}.small{font-size:12px;color:#bfd0d8;line-height:1.45}
#meeting,#end{display:none;position:absolute;inset:0;background:#000b;pointer-events:auto;align-items:center;justify-content:center}.box{width:min(430px,92vw);max-height:90vh;overflow:auto;background:#0a151c;border:1px solid #617c8a;border-radius:18px;padding:20px;text-align:center}.votes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.votes button{background:#253e4b}.selected{outline:3px solid #5bd0ff}.hidden{display:none}
.bar{height:9px;background:#1a2930;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;width:0;background:#31b6e8}

#sabotage{display:none;position:absolute;top:86px;left:50%;transform:translateX(-50%);background:#b32635;border:2px solid #ff8a8a;border-radius:12px;padding:8px 14px;font-weight:900;z-index:5;pointer-events:auto}
#chat{display:flex;gap:6px;margin:10px 0}.chatline{background:#142833;border-radius:8px;padding:6px 8px;text-align:left;margin:4px 0;font-size:13px}.chatbox{max-height:150px;overflow:auto;text-align:left;background:#071017;border-radius:10px;padding:6px}
.voteRow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#132630;border-radius:9px;padding:6px}.voteBar{height:8px;background:#263942;border-radius:8px;flex:1;overflow:hidden}.voteBar i{display:block;height:100%;width:0;background:#55c8ef;transition:width .7s}.result{font-size:26px;font-weight:1000;animation:pop .7s ease}@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.vent{fill:#111b20;stroke:#667983;stroke-width:3}.ventGlow{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.45}}
#meeting .box{position:relative}
</style></head><body>
<canvas id="game"></canvas><div id="ui">
<div class="top" id="locationName">Communications</div>
<div class="card"><b id="status">タスク 0 / 5</b><div class="bar"><div id="fill" class="fill"></div></div><div class="small" id="role">役職：クルー</div></div>
<div class="card right"><b>船内通信</b><div id="multiStatus" class="small">👥 マルチプレイ：未接続</div><div id="multiPanel" style="margin:5px 0"><button id="aiBtn">🤖 AIと遊ぶ</button><input id="roomCode" maxlength="6" placeholder="部屋コード" style="width:90px;padding:7px;border-radius:7px;border:1px solid #526a77;background:#08151c;color:#fff;text-transform:uppercase"><button id="hostBtn">部屋を作る</button><button id="joinBtn">参加</button></div><div class="small" id="log">探索を開始しました。</div><button class="danger" id="report">🚨 通報</button><button id="meetingBtn">📢 緊急会議</button><button id="ventBtn">🕳️ ベント</button><button id="killBtn" class="danger" style="display:none">⚠️ アクション</button></div>
<div id="sabotage">⚠️ 緊急サボタージュ！ <span id="sabTime">20</span>秒</div>
<div class="card bottom"><b>操作</b><div class="small">画面ドラッグ：移動<br>青い端末：タスク<br>死体の近く：通報</div></div>
<div id="meeting"><div class="box"><h2>緊急会議</h2><p id="meetingText">誰が怪しい？</p><div id="chatlog" class="chatbox"></div><div id="chat"><input id="chatInput" maxlength="40" placeholder="会議チャット…"><button id="chatSend">送信</button></div><div id="votes" class="votes"></div><div id="voteResult" class="result"></div><button id="skip">投票をスキップ</button></div></div>
<div id="end"><div class="box"><h2 id="endTitle"></h2><p id="endText"></p><button onclick="location.reload()">もう一度プレイ</button></div></div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,d=1,drag=false,last={x:0,y:0},meeting=false,ended=false,killCooldown=0,aiTimer=0,sabotage=false,sabLeft=0,vented=false,chatMessages=[],ghost=false,activeTask=null,taskStage=0,doors=[],taskMiniOpen=false;
let peer=null,hostConn=null,connections=[],isHost=false,multi=false,aiMode=false,remotePlayers={},myPlayerId='p'+Math.random().toString(36).slice(2,7),roomCode='';
const player={x:0,y:0,color:'#36a9df',alive:true,role:'crew'};
let playerImpostorKillCooldown=0;
const tasks=[[-760,-320,'通信'],[-180,-360,'電力'],[520,-300,'酸素'],[-620,300,'エンジン'],[430,320,'航法']];
let done=0;
const npcs=[
{id:1,name:'レッド',x:-170,y:-40,color:'#ef4b4b',role:'impostor',alive:true,target:null},
{id:2,name:'イエロー',x:150,y:-20,color:'#f2c94c',role:'crew',alive:true,target:null},
{id:3,name:'パープル',x:-40,y:110,color:'#a66cff',role:'crew',alive:true,target:null},
{id:4,name:'グリーン',x:360,y:100,color:'#35c978',role:'crew',alive:true,target:null},
{id:5,name:'オレンジ',x:-350,y:60,color:'#ff7c3e',role:'crew',alive:true,target:null},
{id:6,name:'シアン',x:280,y:40,color:'#45d8d0',role:'impostor',alive:true,target:null}
];
let bodies=[];
let ejections=[];
let cam={x:0,y:0};
const aiMemory={};
function aiInit(q){if(!aiMemory[q.id])aiMemory[q.id]={lastRoom:null,suspect:0,seenImpostor:false,seenBodies:0,taskTarget:0,chatSeed:0};return aiMemory[q.id]}
const rooms=[{n:'Communications',x:-800,y:-360,w:430,h:330},{n:'Electrical',x:-300,y:-390,w:500,h:330},{n:'Oxygen',x:270,y:-360,w:500,h:330},{n:'Engine',x:-800,y:30,w:520,h:430},{n:'Navigation',x:-150,y:30,w:500,h:430},{n:'Storage',x:390,y:30,w:380,h:430}];
const roomDoors=[
 {x:-370,y:-30,w:70,h:34}, // Communications
 {x:110,y:-60,w:70,h:34}, // Electrical
 {x:250,y:-20,w:34,h:70}, // Oxygen
 {x:-280,y:30,w:70,h:34}, // Engine
 {x:100,y:30,w:70,h:34}, // Navigation
 {x:390,y:180,w:34,h:70} // Storage
];
function nearRoomDoor(px,py){return roomDoors.some(d=>px>=d.x-12&&px<=d.x+d.w+12&&py>=d.y-12&&py<=d.y+d.h+12)}
function roomAt(px,py){return rooms.find(r=>px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h)||null}
function pointInsideRoom(px,py,r){return px>r.x+8&&px<r.x+r.w-8&&py>r.y+8&&py<r.y+r.h-8}
function canMoveTo(fromX,fromY,toX,toY){
 const from=roomAt(fromX,fromY),to=roomAt(toX,toY);
 if(from===to)return true;
 // 部屋の外へ出る/別の部屋へ入るときは、ドア付近だけ許可
 if(nearRoomDoor(fromX,fromY)||nearRoomDoor(toX,toY))return true;
 // 廊下同士の移動は許可
 if(!from&&!to)return true;
 return false;
}
function roomOf(q){const r=rooms.find(r=>q.x>=r.x&&q.x<=r.x+r.w&&q.y>=r.y&&q.y<=r.y+r.h);return r?r.n:'Corridor'}
function updateLocationName(){const el=document.getElementById('locationName');if(el)el.textContent=roomOf(player)}
function nearestCrew(q){return npcs.filter(z=>z.alive&&z.role==='crew').sort((a,b)=>Math.hypot(a.x-q.x,a.y-q.y)-Math.hypot(b.x-q.x,b.y-q.y))[0]}
function nearestBodyTo(q){return bodies.slice().sort((a,b)=>Math.hypot(a.x-q.x,a.y-q.y)-Math.hypot(b.x-q.x,b.y-q.y))[0]}
function aiChat(q){const m=aiInit(q);const lines=q.role==='impostor'?['今の動き、少し気になる。','自分はタスクをしていたよ。','死体の場所を確認しよう。','誰か怪しい動きを見た？']:['私は今のところ普通にタスク中。','さっき '+roomOf(q)+' にいたよ。','死体を見つけたら報告しよう。','誰かの行動を見ていた人いる？'];chatMessages.push({n:q.name,t:lines[m.chatSeed++%lines.length]});renderChat()}
function aiChooseVote(q){const alive=npcs.filter(z=>z.alive&&z.id!==q.id&&z.role!=='impostor');if(!alive.length)return null;const b=nearestBodyTo(q);if(b){const victim=npcs.find(z=>z.name===b.name);if(victim&&victim.role==='crew')return victim.id}return alive.sort((a,b)=>{const sa=Math.hypot(a.x-q.x,a.y-q.y),sb=Math.hypot(b.x-q.x,b.y-q.y);return sa-sb})[0].id}
function aiMeeting(){if(!aiMode||ended)return;const alive=npcs.filter(q=>q.alive);alive.forEach(q=>{const m=aiInit(q);m.chatSeed++;if(Math.random()<.7)aiChat(q)});setTimeout(()=>{if(!meeting||ended)return;const voter=alive.find(q=>q.role==='crew');if(voter){const id=aiChooseVote(voter);if(id!==null){const t=npcs.find(z=>z.id===id);if(t){chatMessages.push({n:voter.name,t:t.name+'が少し怪しいと思う。'});renderChat()}}}},700)}

function multiLog(t){const e=document.getElementById('multiStatus');if(e)e.textContent=t}
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function connectPlayer(conn){
 conn.on('open',()=>{connections.push(conn);multi=true;multiLog('👥 接続中：'+connections.length+'人');conn.send({type:'welcome',id:myPlayerId,player:{x:player.x,y:player.y,color:player.color,name:'PLAYER'}});broadcastState()});
 conn.on('data',handleNet);conn.on('close',()=>{connections=connections.filter(c=>c!==conn);multiLog('👥 接続中：'+connections.length+'人')});
}
function broadcast(msg){connections=connections.filter(c=>c&&c.open);connections.forEach(c=>c.send(msg))}
function broadcastState(){if(!isHost)return;const allPlayers={...remotePlayers,[myPlayerId]:{id:myPlayerId,x:player.x,y:player.y,color:player.color,name:'HOST',alive:player.alive}};broadcast({type:'state',players:allPlayers,done,bodies:bodies.map(b=>({x:b.x,y:b.y,color:b.color,name:b.name})),sabotage,doors})}
function handleNet(m){
 if(m.type==='welcome'&&!isHost){multi=true;multiLog('👥 ホストに接続しました');return}
 if(m.type==='player'&&isHost){remotePlayers[m.id]={x:m.x,y:m.y,color:m.color,name:m.name||'PLAYER',alive:m.alive!==false};return}
 if(m.type==='task'&&isHost){if(m.index===done){done++;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';checkWin();broadcastState()}return}
 if(m.type==='state'&&!isHost){remotePlayers=m.players||{};done=m.done||0;bodies=m.bodies||[];sabotage=!!m.sabotage;doors=m.doors||[];document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';return}
}
function startHost(){
 if(peer)return;roomCode=makeCode();document.getElementById('roomCode').value=roomCode;isHost=true;multi=true;peer=new Peer(roomCode);multiLog('👥 部屋コード：'+roomCode+'（友だちに入力してもらう）');
 peer.on('open',id=>{multiLog('👥 部屋コード：'+id+'　参加者を待機中')});peer.on('connection',connectPlayer);peer.on('error',e=>multiLog('接続エラー：'+e.type));
}
function joinRoom(){
 if(peer)return;roomCode=document.getElementById('roomCode').value.trim().toUpperCase();if(roomCode.length<4){multiLog('⚠️ 部屋コードを入力');return}peer=new Peer();peer.on('open',()=>{hostConn=peer.connect(roomCode,{reliable:true});connectPlayer(hostConn)});peer.on('error',e=>multiLog('⚠️ 接続できません：'+e.type));
}

function startAI(){if(ended)return;aiMode=true;multi=false;assignRoles();document.getElementById('multiStatus').textContent='🤖 AI対戦中：AI 5人';setLog('AIクルーとAIインポスターが参加しました！');for(let i=0;i<npcs.length;i++){npcs[i].x=[-170,150,-40,360,-350,280][i];npcs[i].y=[-40,-20,110,100,60,40][i]}}
document.getElementById('aiBtn').onclick=startAI;document.getElementById('hostBtn').onclick=startHost;document.getElementById('joinBtn').onclick=joinRoom;
function sendLocal(){if(!multi)return;const msg={type:'player',id:myPlayerId,x:player.x,y:player.y,color:player.color,alive:player.alive,name:'PLAYER'};if(isHost){remotePlayers[myPlayerId]=msg;broadcastState()}else if(hostConn&&hostConn.open)hostConn.send(msg)}
setInterval(sendLocal,100);
const vents=[[-390,-120],[-40,-120],[330,-120],[-300,120],[120,120],[390,170]];
const sabotageTargets=[['通信',-380,-190],['電力',-80,-220],['酸素',300,-140]];
const roles=[['クルー','タスクを完了する'],['技術員','ベントを短時間だけ使用できる'],['監視員','会議で追加情報を得る'],['インポスター','クルーを減らし妨害する']];
function assignRoles(){
 const playerIsImp=Math.random()<2/7;
 player.role=playerIsImp?'インポスター':'技術員';
 npcs.forEach(q=>q.role='crew');
 const pool=[...npcs].sort(()=>Math.random()-.5);
 pool.slice(0,playerIsImp?1:2).forEach(q=>q.role='impostor');
 updateRoleUI();
}
function updateRoleUI(){
 const el=document.getElementById('role');
 const kb=document.getElementById('killBtn');
 if(kb)kb.style.display=player.role==='インポスター'?'inline-block':'none';
 if(el)el.textContent='役職：'+player.role+' — '+(roles.find(r=>r[0]===player.role)||['インポスター','クルーを減らし妨害する'])[1];
}
assignRoles();
function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function sx(a){return a-cam.x+W/2}function sy(a){return a-cam.y+H/2}function rr(px,py,w,h,r,f){x.fillStyle=f;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function drawBody(q){
 const px=sx(q.x),py=sy(q.y);x.save();x.translate(px,py);
 x.fillStyle=q.color;x.beginPath();x.moveTo(-22,15);x.lineTo(-18,5);x.lineTo(-12,10);x.lineTo(-15,15);x.quadraticCurveTo(-7,24,0,24);x.quadraticCurveTo(7,24,15,15);x.lineTo(12,10);x.lineTo(18,5);x.lineTo(22,15);x.quadraticCurveTo(10,25,0,24);x.quadraticCurveTo(-10,25,-22,15);x.fill();
 x.fillStyle='#27343a';x.fillRect(-15,12,11,14);x.fillRect(4,12,11,14);
 x.strokeStyle='#f4f1dc';x.lineWidth=2.5;x.beginPath();x.moveTo(-13,-7);x.lineTo(-13,9);x.moveTo(-7,-10);x.lineTo(-7,8);x.moveTo(0,-12);x.lineTo(0,10);x.moveTo(7,-10);x.lineTo(7,8);x.moveTo(13,-7);x.lineTo(13,9);x.stroke();
 x.beginPath();x.moveTo(-15,-7);x.quadraticCurveTo(0,4,15,-7);x.moveTo(-15,0);x.quadraticCurveTo(0,10,15,0);x.stroke();
 x.fillStyle='#f4f1dc';x.beginPath();x.ellipse(0,-18,10,9,0,0,7);x.fill();x.fillStyle='#27343a';x.fillRect(-5,-20,3,3);x.fillRect(2,-20,3,3);
 x.restore();
}
function person(q,label=true){
 const px=sx(q.x),py=sy(q.y);x.save();x.translate(px,py);
 x.fillStyle='#111c22';x.beginPath();x.ellipse(0,25,27,10,0,0,7);x.fill();
 x.fillStyle=q.color;x.beginPath();x.moveTo(-22,15);x.lineTo(-18,-17);x.quadraticCurveTo(-15,-38,0,-42);x.quadraticCurveTo(15,-38,18,-17);x.lineTo(22,15);x.quadraticCurveTo(10,25,0,24);x.quadraticCurveTo(-10,25,-22,15);x.fill();
 x.fillStyle='#07151d';x.beginPath();x.ellipse(0,-29,16,12,0,0,7);x.fill();x.fillStyle='#31596a';x.beginPath();x.ellipse(-3,-32,11,5,0,0,7);x.fill();
 x.globalAlpha=.3;x.fillStyle='#d5f6ff';x.beginPath();x.ellipse(-6,-35,6,2,0,0,7);x.fill();x.globalAlpha=1;
 x.fillStyle='#26343b';x.fillRect(-28,-8,7,25);x.fillRect(21,-8,7,25);x.fillRect(-15,12,11,14);x.fillRect(4,12,11,14);x.restore();
 if(label){x.fillStyle='#fff';x.font='bold 12px system-ui';x.textAlign='center';x.fillText(q.name||'YOU',px,py+48)}
}
function terminal(t){let px=sx(t[0]),py=sy(t[1]);rr(px-22,py-22,44,44,9,activeTask&&activeTask[2]===t[2]?'#35d28a':'#1388c3');x.fillStyle='#d8f8ff';x.fillRect(px-12,py-8,24,16);x.fillStyle='#14749d';x.fillRect(px-7,py-4,14,3)}
function drawEjection(e){
 const px=sx(e.x),py=sy(e.y);x.save();x.translate(px,py);x.globalAlpha=Math.max(0,e.life/110);x.rotate(e.rot);person({...e,color:e.color,name:e.name},true);x.restore();
 // 宇宙へ飛んでいく人物を画面中央付近で追いかける
 x.save();x.globalAlpha=Math.max(0,e.life/110)*.9;x.fillStyle='#fff';x.font='900 18px system-ui';x.textAlign='center';x.shadowColor='#000';x.shadowBlur=6;x.fillText(e.name+' — 追放',W/2,H*.18);x.restore();
}
function draw(){
 x.clearRect(0,0,W,H);x.fillStyle='#061018';x.fillRect(0,0,W,H);
 rr(sx(-900),sy(-500),1700,1050,50,'#14242c');rr(sx(-870),sy(-470),1640,990,38,'#263943');
 rooms.forEach(r=>{rr(sx(r.x),sy(r.y),r.w,r.h,24,'#1a2a33');x.strokeStyle='#405864';x.lineWidth=3;x.stroke();x.fillStyle='#8fa6b2';x.font='900 18px system-ui';x.textAlign='center';x.fillText(r.n,sx(r.x+r.w/2),sy(r.y+30));});
roomDoors.forEach(g=>{rr(sx(g.x),sy(g.y),g.w,g.h,7,'#314a56');x.strokeStyle='#69a8ba';x.lineWidth=2;x.strokeRect(sx(g.x),sy(g.y),g.w,g.h)});
 tasks.forEach((t,i)=>{if(i>=done)terminal(t)}); vents.forEach((v,i)=>{let px=sx(v[0]),py=sy(v[1]);x.beginPath();x.ellipse(px,py,28,14,0,0,7);x.fillStyle='#111b20';x.fill();x.strokeStyle='#667983';x.lineWidth=3;x.stroke();if(i===0&&sabotage){x.fillStyle='#ff5050';x.globalAlpha=.55;x.beginPath();x.arc(px,py,34,0,7);x.fill();x.globalAlpha=1}});
 npcs.forEach(q=>{if(q.alive)person(q)});Object.values(remotePlayers).forEach(q=>{if(q.id!==myPlayerId&&q.alive!==false)person({...q,name:q.name||'PLAYER'},true)});doors.forEach(r=>{rr(sx(r[0]),sy(r[1]),r[2],r[3],5,'#b84a3c')});bodies.forEach(q=>drawBody(q));ejections.forEach(e=>drawEjection(e));
 if(player.alive)person({...player,name:'YOU'});
}
function distXY(a,b){return Math.hypot(a.x-b[0],a.y-b[1])}
function setLog(s){document.getElementById('log').textContent=s}
function end(title,text){ended=true;document.getElementById('endTitle').textContent=title;document.getElementById('endText').textContent=text;document.getElementById('end').style.display='flex'}
function kill(q){q.alive=false;bodies.push({x:q.x,y:q.y,color:q.color,name:q.name});setLog(q.name+'が倒れている…');}
function eject(q){
 if(!q)return;
 q.alive=false;
ejections.push({x:q.x,y:q.y,color:q.color,name:q.name,life:110,rot:0,vx:(Math.random()-.5)*1.2,vy:-2.2,vr:(Math.random()-.5)*.08});
 setLog(q.name+'が宇宙へ放出された！');
 setTimeout(()=>{ejections=ejections.filter(e=>e.name!==q.name||e.life>0)},1400);
}
function updateEjections(){
 for(const e of ejections){e.x+=e.vx;e.y+=e.vy;e.vy-=.015;e.rot+=e.vr;e.life--;}
 const focus=ejections[ejections.length-1];
 if(focus&&focus.life>0){cam.x+=(focus.x-cam.x)*.16;cam.y+=(focus.y-cam.y)*.16;}
 else if(player.alive){cam.x+=(player.x-cam.x)*.12;cam.y+=(player.y-cam.y)*.12;}
}
function closestBody(){let b=null,bd=999;for(const q of bodies){let z=Math.hypot(player.x-q.x,player.y-q.y);if(z<bd){bd=z;b=q}}return bd<70?b:null}
function checkWin(){if(player.role==='インポスター'&&npcs.filter(q=>q.alive&&q.role==='crew').length===0){end('IMPOSTOR WIN!','クルーを全員見つけた！');return true}if(done>=tasks.length){end('CREW WIN!','全タスク完了！');return true}if(npcs.filter(q=>q.alive&&q.role==='crew').length===0){end('IMPOSTOR WIN!','インポスターがクルーを上回った！');return true}return false}
function renderChat(){const el=document.getElementById('chatlog');el.innerHTML=chatMessages.map(m=>'<div class="chatline"><b>'+m.n+'</b>：'+m.t+'</div>').join('');el.scrollTop=el.scrollHeight}
function openMeeting(reason='会議が始まりました。'){
 if(ended)return;meeting=true;document.getElementById('meetingText').textContent=reason;document.getElementById('meeting').style.display='flex';renderChat();if(aiMode)setTimeout(aiMeeting,250);const v=document.getElementById('votes');v.innerHTML='';
 const people=[...npcs.filter(q=>q.alive),...(player.alive?[{id:0,name:'YOU',color:player.color,role:'crew',alive:true}]:[])];
 people.forEach(q=>{let b=document.createElement('button');b.textContent=q.name;b.onclick=()=>vote(q.id);v.appendChild(b)});
}
function vote(id){
 const target=npcs.find(q=>q.id===id);
 const box=document.getElementById('voteResult');box.textContent='投票集計中…';box.style.display='block';
 const buttons=[...document.querySelectorAll('#votes button')];buttons.forEach((b,i)=>{b.disabled=true;b.style.transform='scale(.96)'});
 setTimeout(()=>{
   const chosen=target?target.name:'スキップ';
   box.textContent='🗳️ '+chosen+' に投票が集まった！';
   box.animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1.12)',opacity:1},{transform:'scale(1)',opacity:1}],{duration:700});
   setTimeout(()=>{
     document.getElementById('meeting').style.display='none';meeting=false;
     if(target){eject(target);setLog(target.name+'が追放された。');if(target.role==='impostor'){end('CREW WIN!','インポスターを見つけた！');return}}
     else setLog('投票はスキップされた。');
     checkWin();setTimeout(()=>setLog('会議終了。クルーは再び行動開始。'),650);
   },1200);
 },900);
}
document.getElementById('report').onclick=()=>{if(closestBody())openMeeting('死体が通報されました。');else setLog('近くに通報できる死体がありません。')};
document.getElementById('meetingBtn').onclick=()=>openMeeting('緊急会議が招集されました。');
setInterval(()=>{if(!ended&&Math.random()<.18)closeDoors()},7000);
document.getElementById('skip').onclick=()=>{document.getElementById('meeting').style.display='none';meeting=false;setLog('投票をスキップしました。')};
document.getElementById('chatSend').onclick=()=>{const input=document.getElementById('chatInput');if(input.value.trim()){chatMessages.push({n:'YOU',t:input.value.trim()});input.value='';renderChat();setTimeout(()=>{if(meeting){const alive=npcs.filter(q=>q.alive);const q=alive[Math.floor(Math.random()*alive.length)];if(q){chatMessages.push({n:q.name,t:['私は怪しいと思う人がいる。','さっき通信室にいたよ。','誰かベントを見た？','証拠を確認しよう。'][Math.floor(Math.random()*4)]});renderChat()}}},500)}};
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('chatSend').click()});
function sabotageNow(){if(sabotage||ended)return;sabotage=true;sabLeft=20;document.getElementById('sabotage').style.display='block';setLog('インポスターがサボタージュを発生させた！');}
function repairSabotage(){if(!sabotage)return;sabotage=false;sabLeft=0;document.getElementById('sabotage').style.display='none';setLog('サボタージュを解除した！');}
function useVent(){if(ended||meeting)return;let near=vents.find(v=>Math.hypot(player.x-v[0],player.y-v[1])<55);if(near){vented=!vented;setLog(vented?'ベントに隠れた。':'ベントから出た。');}else setLog('近くにベントがありません。');}
document.getElementById('ventBtn').onclick=useVent;
document.getElementById('sabotage').onclick=repairSabotage;
function playerImpostorAction(){
 if(player.role!=='インポスター'||!player.alive||meeting||ended||playerImpostorKillCooldown>0)return;
 const target=npcs.find(z=>z.alive&&z.role==='crew'&&Math.hypot(z.x-player.x,z.y-player.y)<45);
 if(target){kill(target);playerImpostorKillCooldown=180;setLog(target.name+'が倒れた。');checkWin();}else{setLog('近くにターゲットがいません。');}
}
document.getElementById('killBtn').onclick=playerImpostorAction;
function impostorAttack(q){
 if(killCooldown>0)return;
 const target=npcs.find(z=>z.alive&&z.role==='crew'&&Math.hypot(z.x-q.x,z.y-q.y)<32);
 if(target){kill(target);killCooldown=180;setLog(q.name+'のキルクールダウン開始');}
}
function moveAI(){
 for(const q of npcs){if(!q.alive)continue;const mem=aiInit(q);mem.lastRoom=roomOf(q);

  if(q.role==='impostor'){
   if(Math.random()<0.002)sabotageNow();
   let target=npcs.find(z=>z.alive&&z.role==='crew'&&Math.hypot(z.x-q.x,z.y-q.y)<260);
   if(target){let dx=target.x-q.x,dy=target.y-q.y,L=Math.hypot(dx,dy)||1;q.x+=dx/L*.52;q.y+=dy/L*.65;
    if(Math.hypot(q.x-target.x,q.y-target.y)<34){impostorAttack(q);q.x-=8;}
   }else{const nx=q.x+Math.sin(Date.now()/900+q.id)*.35,ny=q.y+Math.cos(Date.now()/1000+q.id)*.35;if(canMoveTo(q.x,q.y,nx,ny)){q.x=nx;q.y=ny}}
  }else{
   let targetTask=tasks[Math.min((done+q.id)%tasks.length,tasks.length-1)];
   let t=targetTask;let dx=t[0]-q.x,dy=t[1]-q.y,L=Math.hypot(dx,dy)||1;q.x+=dx/L*.65;q.y+=dy/L*.65;
  }
 }
}
function taskGame(){
 if(!activeTask||meeting||ended)return;
 const ok=Math.random()<.8;if(ok)taskStage++;else setLog('ミス！もう一度操作しよう');
 setLog(activeTask[2]+'：ミニゲーム '+taskStage+'/3');
 if(taskStage>=3){activeTask=null;const completedIndex=done;done++;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';setLog('タスク完了！');if(isHost)broadcastState();else if(hostConn&&hostConn.open)hostConn.send({type:'task',index:completedIndex});checkWin()}
}
c.addEventListener('click',e=>{if(activeTask&&!meeting&&!ended)taskGame()});
function closeDoors(){doors=[[-250,-30,120,12],[100,-30,120,12],[0,150,12,90]];setLog('🚪 ドアが閉鎖された！');setTimeout(()=>doors=[],4500)}
function update(){
 updateEjections();
 updateLocationName();
 if(player.role==='インポスター'){const el=document.getElementById('role');if(el)el.style.color='#ff6b6b';}
 if(!ended&&!meeting&&(player.alive||ghost)){
  if(sabotage){if(aiTimer%60===0){sabLeft--;document.getElementById('sabTime').textContent=sabLeft}if(sabLeft<=0){end('IMPOSTOR WIN!','サボタージュを止められなかった！');return}}
  if(sabotage&&tasks.some(t=>Math.hypot(player.x-t[0],player.y-t[1])<48))repairSabotage();
  if(ghost){setLog('👻 ゴーストモード：自由に船内を探索中');}
  if(aiTimer++%15===0&&(isHost||!multi||aiMode))moveAI();
  if(killCooldown>0)killCooldown--;if(playerImpostorKillCooldown>0)playerImpostorKillCooldown--;
  if(killCooldown===0&&npcs.some(q=>q.role==='impostor'&&q.alive))document.getElementById('log').dataset.ready='1';
  if(player.role!=='インポスター'&&done<tasks.length&&distXY(player,tasks[done])<58&&!activeTask){
 activeTask=tasks[done];taskStage=0;document.getElementById('status').textContent='タスク中：'+activeTask[2];setLog(activeTask[2]+'のミニゲーム開始！');
}
if(activeTask&&taskStage>=3){done++;activeTask=null;taskStage=0;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';setLog(tasks[done-1][2]+'タスク完了！');checkWin()}
  let imp=npcs.find(q=>q.role==='impostor'&&q.alive);if(!ghost&&!vented&&imp&&Math.hypot(imp.x-player.x,imp.y-player.y)<35&&killCooldown===0){bodies.push({x:player.x,y:player.y,color:player.color,name:'YOU'});player.alive=false;ghost=true;setLog('👻 ゴーストになった！ 死体が残った。');}
 }
 if(isHost&&aiTimer%6===0)broadcastState();draw();requestAnimationFrame(update)
}
c.addEventListener('pointerdown',e=>{if(ended||meeting)return;drag=true;last={x:e.clientX,y:e.clientY}});
c.addEventListener('pointermove',e=>{if(!drag||!player.alive)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;player.x=Math.max(-850,Math.min(750,player.x+dx*.65));player.y=Math.max(-450,Math.min(500,player.y+dy*.65));cam.x=player.x;cam.y=player.y;last={x:e.clientX,y:e.clientY}});
c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
updateRoleUI();
update();
</script></body></html>
