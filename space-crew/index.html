function propRect(p){return {x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h}}
function bodyRectContact(px,py,rx,ry,r=22){
 const nx=Math.max(rx,Math.min(px,rx+ry.w)),ny=Math.max(ry,Math.min(py,ry+ry.h));
 return Math.hypot(px-nx,py-ny)<=r;
}
function bodyContact(a,b,extra=0){
 return Math.hypot(a.x-b.x,a.y-b.y)<=44+extra;
}
function bodyTouchesPoint(a,px,py,extra=0){
 return Math.hypot(a.x-px,a.y-py)<=22+extra;
}
function propHit(px,py,r=22){
 return props.some(p=>p.solid&&bodyRectContact(px,py,p.x-p.w/2,{w:p.w,h:p.h},r));
}
function canMoveAroundProps(fromX,fromY,toX,toY){
 const steps=6;
 for(let i=0;i<=steps;i++){
  const t=i/steps,px=fromX+(toX-fromX)*t,py=fromY+(toY-fromY)*t;
  if(propHit(px,py,13))return false;
 }
 return true;
}
function nearRoomDoor(px,py){return roomDoors.some(d=>px>=d.x-12&&px<=d.x+d.w+12&&py>=d.y-12&&py<=d.y+d.h+12)}
function closedDoorHit(px,py,r=22){
 return doors.some(d=>{
  const [dx,dy,dw,dh]=d;
  return px+r>dx&&px-r<dx+dw&&py+r>dy&&py-r<dy+dh;
 });
}
function closedDoorPathHit(fromX,fromY,toX,toY){
 const steps=10;
 for(let i=0;i<=steps;i++){
  const t=i/steps,px=fromX+(toX-fromX)*t,py=fromY+(toY-fromY)*t;
  if(closedDoorHit(px,py,22))return true;
 }
 return false;
}
function roomAt(px,py){return rooms.find(r=>px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h)||null}
function pointInsideRoom(px,py,r){return px>r.x+8&&px<r.x+r.w-8&&py>r.y+8&&py<r.y+r.h-8}
function canMoveTo(fromX,fromY,toX,toY){
 const from=roomAt(fromX,fromY),to=roomAt(toX,toY);
 if(closedDoorPathHit(fromX,fromY,toX,toY))return false;
 if(!canMoveAroundProps(fromX,fromY,toX,toY))return false;
 if(from===to)return true;
 if(nearRoomDoor(fromX,fromY)||nearRoomDoor(toX,toY))return true;
 const steps=8;
 for(let i=1;i<=steps;i++){
   const t=i/steps,px=fromX+(toX-fromX)*t,py=fromY+(toY-fromY)*t;
   if(nearRoomDoor(px,py))return true;
 }
 return false;
}
function roomOf(q){const r=rooms.find(r=>q.x>=r.x&&q.x<=r.x+r.w&&q.y>=r.y&&q.y<=r.y+r.h);return r?r.n:'Corridor'}
function updateLocationName(){const el=document.getElementById('locationName');if(el)el.textContent=roomOf(player)}
function nearestCrew(q){return npcs.filter(z=>z.alive&&z.role==='crew').sort((a,b)=>Math.hypot(a.x-q.x,a.y-q.y)-Math.hypot(b.x-q.x,b.y-q.y))[0]}
function nearestBodyTo(q){return bodies.slice().sort((a,b)=>Math.hypot(a.x-q.x,a.y-q.y)-Math.hypot(b.x-q.x,b.y-q.y))[0]}
function aiChat(q){const m=aiInit(q);const lines=q.role==='impostor'?['今の動き、少し気になる。','自分はタスクをしていたよ。','死体の場所を確認しよう。','誰か怪しい動きを見た？']:['私は今のところ普通にタスク中。','さっき '+roomOf(q)+' にいたよ。','死体を見つけたら報告しよう。','誰かの行動を見ていた人いる？'];chatMessages.push({n:q.name,t:lines[m.chatSeed++%lines.length]});renderChat()}
function aiChooseVote(q){const alive=npcs.filter(z=>z.alive&&z.id!==q.id&&z.role!=='impostor');if(!alive.length)return null;const b=nearestBodyTo(q);if(b){const victim=npcs.find(z=>z.name===b.name);if(victim&&victim.role==='crew')return victim.id}return alive.sort((a,b)=>{const sa=Math.hypot(a.x-q.x,a.y-q.y),sb=Math.hypot(b.x-q.x,b.y-q.y);return sa-sb})[0].id}
function aiMeeting(){if(!aiMode||ended)return;const alive=npcs.filter(q=>q.alive);alive.forEach(q=>{const m=aiInit(q);m.chatSeed++;if(Math.random()<.7)aiChat(q)});setTimeout(()=>{if(!meeting||ended)return;const voter=alive.find(q=>q.role==='crew');if(voter){const id=aiChooseVote(voter);if(id!==null){const t=npcs.find(z=>z.id===id);if(t){chatMessages.push({n:voter.name,t:t.name+'が少し怪しいと思う。'});renderChat()}}}},700)}

function multiLog(t){const e=document.getElementById('multiStatus');if(e)e.textContent=t}
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function connectPlayer(conn){
 conn.on('open',()=>{connections.push(conn);multi=true;multiLog('👥 接続中：'+connections.length+'人');conn.send({type:'welcome',id:myPlayerId,player:{x:player.x,y:player.y,color:player.color,name:'PLAYER'}});broadcastState()});
 conn.on('data',handleNet);conn.on('close',()=>{connections=connections.filter(c=>c!==conn);multiLog('👥 接続中：'+connections.length+'人')});
}
function broadcast(msg){connections=connections.filter(c=>c&&c.open);connections.forEach(c=>c.send(msg))}
function broadcastState(){if(!isHost)return;const allPlayers={...remotePlayers,[myPlayerId]:{id:myPlayerId,x:player.x,y:player.y,color:player.color,name:'HOST',alive:player.alive}};broadcast({type:'state',players:allPlayers,done,bodies:bodies.map(b=>({x:b.x,y:b.y,color:b.color,name:b.name})),sabotage,doors})}
function handleNet(m){
 if(m.type==='welcome'&&!isHost){multi=true;multiLog('👥 ホストに接続しました');return}
 if(m.type==='player'&&isHost){remotePlayers[m.id]={x:m.x,y:m.y,color:m.color,name:m.name||'PLAYER',alive:m.alive!==false};return}
 if(m.type==='task'&&isHost){if(m.index===done){done++;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';checkWin();broadcastState()}return}
 if(m.type==='state'&&!isHost){remotePlayers=m.players||{};done=m.done||0;bodies=m.bodies||[];sabotage=!!m.sabotage;doors=m.doors||[];document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';return}
}
function startHost(){
 if(peer)return;roomCode=makeCode();document.getElementById('roomCode').value=roomCode;isHost=true;multi=true;peer=new Peer(roomCode);multiLog('👥 部屋コード：'+roomCode+'（友だちに入力してもらう）');

}
function joinRoom(){
 if(peer)return;roomCode=document.getElementById('roomCode').value.trim().toUpperCase();if(roomCode.length<4){multiLog('⚠️ 部屋コードを入力');return}peer=new Peer();peer.on('open',()=>{hostConn=peer.connect(roomCode,{reliable:true});connectPlayer(hostConn)});peer.on('error',e=>multiLog('⚠️ 接続できません：'+e.type));
}

function sendLocal(){if(!multi)return;const msg={type:'player',id:myPlayerId,x:player.x,y:player.y,color:player.color,alive:player.alive,name:'PLAYER'};if(isHost){remotePlayers[myPlayerId]=msg;broadcastState()}else if(hostConn&&hostConn.open)hostConn.send(msg)}

const vents=[[-390,-120],[-40,-120],[330,-120],[-300,120],[120,120],[390,170]];
const sabotageTargets=[['通信',-380,-190],['電力',-80,-220],['酸素',300,-140]];
const roles=[['クルー','タスクを完了する'],['技術員','ベントを短時間だけ使用できる'],['監視員','会議で追加情報を得る'],['インポスター','クルーを減らし妨害する']];
function assignRoles(){
 const playerIsImp=Math.random()<2/7;
 player.role=playerIsImp?'インポスター':'技術員';
 npcs.forEach(q=>q.role='crew');
 // インポスターは必ず合計1人。プレイヤーがインポスターならNPCは全員クルー。
 if(!playerIsImp){
  const pool=[...npcs].sort(()=>Math.random()-.5);
  pool[0].role='impostor';

}

}

function aiChooseVote(q){
 const candidates=npcs.filter(z=>z.alive&&z.id!==q.id&&z.role!=='impostor');
 if(player.alive&&player.role!=='インポスター')candidates.push({id:0,name:'YOU',x:player.x,y:player.y,role:'crew',alive:true});
 if(!candidates.length)return 'skip';
 const body=nearestBodyTo(q);
 if(body){
  const victim=npcs.find(z=>z.name===body.name);
  if(victim&&victim.alive&&victim.role!=='impostor')return victim.id;
 }
 // 距離・部屋・ランダム性を合わせてAIごとに判断
 let best=candidates[0],bestScore=-Infinity;
 candidates.forEach(z=>{
  let score=Math.random()*3;
  const d=Math.hypot(z.x-q.x,z.y-q.y);
  score+=(260-Math.min(d,260))/130;
  if(roomOf(z)===roomOf(q))score+=1.2;
  if(z.id===0)score+=Math.random()<.35?2:0;
  if(score>bestScore){bestScore=score;best=z;}
 });
 return best.id;
}

function resolveMeeting(){
 if(!meeting||meetingResolving)return;
 const counts={};
 Object.values(meetingVotes).forEach(id=>{counts[id]=(counts[id]||0)+1});
 let winner='skip',max=0,tie=false;
 Object.entries(counts).forEach(([id,n])=>{
  if(n>max){winner=id;max=n;tie=false}
  else if(n===max&&n>0){tie=true}
 });
 if(tie)winner='skip';
 meetingResolving=true;
 const target=winner==='skip'?null:npcs.find(q=>String(q.id)===String(winner))||(String(winner)==='0'?player:null);
 const box=document.getElementById('voteResult');
 box.textContent=target?'🗳️ '+target.name+' に '+max+'票！':'🗳️ 投票はスキップ／同数票！';
 box.style.display='block';
 box.animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1.12)',opacity:1},{transform:'scale(1)',opacity:1}],{duration:700});
 setTimeout(()=>{
  document.getElementById('meeting').style.display='none';meeting=false;meetingResolving=false;
  if(target){
   eject(target);
   setLog(target.name+'が投票で追放された。');
   if(target.role==='インポスター'){end('CREW WIN!','インポスターを見つけた！');return}
  }else setLog('投票はスキップされた。');
  checkWin();setTimeout(()=>setLog('会議終了。クルーは再び行動開始。'),650);
 },1200);
}

function vote(id){
 if(!meeting||meetingResolving)return;
 meetingVotes[0]=id;
 const buttons=[...document.querySelectorAll('#votes button')];buttons.forEach(b=>{b.disabled=true;b.style.transform='scale(.96)'});
 document.getElementById('voteResult').textContent='🗳️ AIも投票を考えています…';
 document.getElementById('voteResult').style.display='block';
 setTimeout(resolveMeeting,900);
}

function aiCanCallMeeting(){
 if(!aiMode||ended||meeting||aiMeetingCooldown>0)return false;
 const alive=npcs.filter(q=>q.alive);
 const body=alive.some(q=>nearestBodyTo(q)&&Math.hypot(nearestBodyTo(q).x-q.x,nearestBodyTo(q).y-q.y)<90);
 if(body)return true;
 return Math.random()<0.025;
}

function aiMaybeCallMeeting(){
 if(!aiCanCallMeeting())return;
 const q=npcs.filter(z=>z.alive)[Math.floor(Math.random()*npcs.filter(z=>z.alive).length)];
 if(!q)return;
 aiMeetingCooldown=8;
 openMeeting('📢 '+q.name+' が緊急会議を開きました。');
}

document.getElementById('report').onclick=()=>{if(closestBody())openMeeting('死体が通報されました。');else setLog('近くに通報できる死体がありません。')};
document.getElementById('meetingBtn').onclick=()=>openMeeting('緊急会議が招集されました。');
setInterval(()=>{if(aiMeetingCooldown>0)aiMeetingCooldown--;if(!ended&&aiMode)aiMaybeCallMeeting();if(!ended&&Math.random()<.18)closeDoors()},7000);
document.getElementById('skip').onclick=()=>{document.getElementById('meeting').style.display='none';meeting=false;setLog('投票をスキップしました。')};
document.getElementById('chatSend').onclick=()=>{const input=document.getElementById('chatInput');if(input.value.trim()){chatMessages.push({n:'YOU',t:input.value.trim()});input.value='';renderChat();setTimeout(()=>{if(meeting){const alive=npcs.filter(q=>q.alive);const q=alive[Math.floor(Math.random()*alive.length)];if(q){chatMessages.push({n:q.name,t:['私は怪しいと思う人がいる。','さっき通信室にいたよ。','誰かベントを見た？','証拠を確認しよう。'][Math.floor(Math.random()*4)]});renderChat()}}},500)}};
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('chatSend').click()});
function sabotageNow(){if(sabotage||ended)return;sabotage=true;sabLeft=20;document.getElementById('sabotage').style.display='block';setLog('インポスターがサボタージュを発生させた！');}
function repairSabotage(){if(!sabotage)return;sabotage=false;sabLeft=0;document.getElementById('sabotage').style.display='none';setLog('サボタージュを解除した！');}
function useVent(){if(ended||meeting)return;let near=vents.find(v=>bodyTouchesPoint(player,v[0],v[1],8));if(near){vented=!vented;setLog(vented?'ベントに隠れた。':'ベントから出た。');}else setLog('近くにベントがありません。');}
document.getElementById('ventBtn').onclick=useVent;
document.getElementById('sabotage').onclick=repairSabotage;
function playerImpostorAction(){
 if(player.role!=='インポスター'||!player.alive||meeting||ended||playerImpostorKillCooldown>0)return;
 const target=npcs.find(z=>z.alive&&z.role==='crew'&&bodyContact(z,player));
 if(target){kill(target);playerImpostorKillCooldown=180;setLog(target.name+'が倒れた。');checkWin();}else{setLog('近くにターゲットがいません。');}
}
document.getElementById('killBtn').onclick=playerImpostorAction;
function impostorAttack(q){
 if(killCooldown>0)return;
 const target=npcs.find(z=>z.alive&&z.role==='crew'&&bodyContact(z,q));
 if(target){kill(target);killCooldown=180;setLog(q.name+'のキルクールダウン開始');}
}
function moveAI(){
 for(const q of npcs){if(!q.alive)continue;const mem=aiInit(q);mem.lastRoom=roomOf(q);

  if(q.role==='impostor'){
   if(Math.random()<0.002)sabotageNow();
   let target=npcs.find(z=>z.alive&&z.role==='crew'&&Math.hypot(z.x-q.x,z.y-q.y)<260);
   if(target){let dx=target.x-q.x,dy=target.y-q.y,L=Math.hypot(dx,dy)||1;const nx=q.x+dx/L*.52,ny=q.y+dy/L*.65;if(canMoveTo(q.x,q.y,nx,ny)){q.x=nx;q.y=ny};
    if(Math.hypot(q.x-target.x,q.y-target.y)<34){impostorAttack(q);q.x-=8;}
   }else{const nx=q.x+Math.sin(Date.now()/900+q.id)*.35,ny=q.y+Math.cos(Date.now()/1000+q.id)*.35;if(canMoveTo(q.x,q.y,nx,ny)){q.x=nx;q.y=ny}}
  }else{
   let targetTask=tasks[Math.min((done+q.id)%tasks.length,tasks.length-1)];
   let t=targetTask;let dx=t[0]-q.x,dy=t[1]-q.y,L=Math.hypot(dx,dy)||1;const nx=q.x+dx/L*.65,ny=q.y+dy/L*.65;if(canMoveTo(q.x,q.y,nx,ny)){q.x=nx;q.y=ny}
  }
 }
}
function taskGame(){
 if(!activeTask||meeting||ended)return;
 const ok=Math.random()<.8;if(ok)taskStage++;else setLog('ミス！もう一度操作しよう');
 setLog(activeTask[2]+'：ミニゲーム '+taskStage+'/3');
 if(taskStage>=3){activeTask=null;const completedIndex=done;done++;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';setLog('タスク完了！');if(isHost)broadcastState();else if(hostConn&&hostConn.open)hostConn.send({type:'task',index:completedIndex});checkWin()}
}
c.addEventListener('click',e=>{if(activeTask&&!meeting&&!ended)taskGame()});
function closeDoors(){doors=[[-590,-52,70,28],[-10,-82,70,28],[270,-270,28,70],[-670,28,70,28],[20,28,70,28],[390,190,28,70],[-930,-275,70,28],[795,-275,70,28],[-930,248,70,28],[660,248,70,28]];setLog('🚪 ドアが閉鎖された！');setTimeout(()=>doors=[],4500)}
function update(){
 updateEjections();
 updateLocationName();
 if(player.role==='インポスター'){const el=document.getElementById('role');if(el)el.style.color='#ff6b6b';}
 if(!ended&&!meeting&&(player.alive||ghost)){
  if(sabotage){if(aiTimer%60===0){sabLeft--;document.getElementById('sabTime').textContent=sabLeft}if(sabLeft<=0){end('IMPOSTOR WIN!','サボタージュを止められなかった！');return}}
  if(sabotage&&tasks.some(t=>bodyTouchesPoint(player,t[0],t[1],6)))repairSabotage();
  if(ghost){setLog('👻 ゴーストモード：自由に船内を探索中');}
  if(aiTimer++%15===0&&(isHost||!multi||aiMode))moveAI();
  if(killCooldown>0)killCooldown--;if(playerImpostorKillCooldown>0)playerImpostorKillCooldown--;
  if(killCooldown===0&&npcs.some(q=>q.role==='impostor'&&q.alive))document.getElementById('log').dataset.ready='1';
  if(player.role!=='インポスター'&&done<tasks.length&&!activeTask){
 const taskProp=props.find(p=>p.task===done&&bodyRectContact(player.x,player.y,p.x-p.w/2,{w:p.w,h:p.h},22));
 const taskNearTerminal=bodyTouchesPoint(player,tasks[done][0],tasks[done][1],8);
 if(taskProp||taskNearTerminal){
  activeTask=tasks[done];taskStage=0;document.getElementById('status').textContent='タスク中：'+activeTask[2];setLog(activeTask[2]+'のミニゲーム開始！');
 }
}
if(activeTask&&taskStage>=3){done++;activeTask=null;taskStage=0;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';setLog(tasks[done-1][2]+'タスク完了！');checkWin()}
  let imp=npcs.find(q=>q.role==='impostor'&&q.alive);if(player.role!=='インポスター'&&!ghost&&!vented&&imp&&bodyContact(imp,player)&&killCooldown===0){bodies.push({x:player.x,y:player.y,color:player.color,name:'YOU'});player.alive=false;ghost=true;setLog('👻 ゴーストになった！ 死体が残った。');}
 }
 if(isHost&&aiTimer%6===0)broadcastState();draw();requestAnimationFrame(update)
}
c.addEventListener('pointerdown',e=>{if(ended||meeting)return;drag=true;last={x:e.clientX,y:e.clientY}});
c.addEventListener('pointermove',e=>{if(!drag||!player.alive)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;const nx=Math.max(-1080,Math.min(980,player.x+dx*.52)),ny=Math.max(-580,Math.min(580,player.y+dy*.52));if(canMoveTo(player.x,player.y,nx,ny)){player.x=nx;player.y=ny}cam.x=player.x;cam.y=player.y;last={x:e.clientX,y:e.clientY}});
c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
updateRoleUI();
update();
</script></body></html>
