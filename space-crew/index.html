<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Space Crew</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#061018;color:#fff;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(22px,5vw,34px);text-shadow:0 3px 8px #000}
.card{position:absolute;left:10px;top:10px;background:#07121bdd;border:1px solid #526a77;border-radius:12px;padding:10px;min-width:175px;pointer-events:auto}.right{left:auto;right:10px}.bottom{top:auto;bottom:10px}
button{border:0;border-radius:9px;padding:9px 12px;background:#1976a5;color:white;font-weight:800;margin:3px 0}.danger{background:#b52d38}.small{font-size:12px;color:#bfd0d8;line-height:1.45}
#meeting,#end{display:none;position:absolute;inset:0;background:#000b;pointer-events:auto;align-items:center;justify-content:center}.box{width:min(430px,92vw);max-height:90vh;overflow:auto;background:#0a151c;border:1px solid #617c8a;border-radius:18px;padding:20px;text-align:center}.votes{display:grid;grid-template-columns:1fr 1fr;gap:7px}.votes button{background:#253e4b}.selected{outline:3px solid #5bd0ff}.hidden{display:none}
.bar{height:9px;background:#1a2930;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;width:0;background:#31b6e8}

#sabotage{display:none;position:absolute;top:86px;left:50%;transform:translateX(-50%);background:#b32635;border:2px solid #ff8a8a;border-radius:12px;padding:8px 14px;font-weight:900;z-index:5;pointer-events:auto}
#chat{display:flex;gap:6px;margin:10px 0}.chatline{background:#142833;border-radius:8px;padding:6px 8px;text-align:left;margin:4px 0;font-size:13px}.chatbox{max-height:150px;overflow:auto;text-align:left;background:#071017;border-radius:10px;padding:6px}
.voteRow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#132630;border-radius:9px;padding:6px}.voteBar{height:8px;background:#263942;border-radius:8px;flex:1;overflow:hidden}.voteBar i{display:block;height:100%;width:0;background:#55c8ef;transition:width .7s}.result{font-size:26px;font-weight:1000;animation:pop .7s ease}@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.vent{fill:#111b20;stroke:#667983;stroke-width:3}.ventGlow{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.45}}
#meeting .box{position:relative}
</style></head><body>
<canvas id="game"></canvas><div id="ui">
<div class="top">SPACE CREW</div>
<div class="card"><b id="status">タスク 0 / 5</b><div class="bar"><div id="fill" class="fill"></div></div><div class="small" id="role">役職：クルー</div></div>
<div class="card right"><b>船内通信</b><div class="small" id="log">探索を開始しました。</div><button class="danger" id="report">🚨 通報</button><button id="meetingBtn">📢 緊急会議</button><button id="ventBtn">🕳️ ベント</button></div>
<div id="sabotage">⚠️ 緊急サボタージュ！ <span id="sabTime">20</span>秒</div>
<div class="card bottom"><b>操作</b><div class="small">画面ドラッグ：移動<br>青い端末：タスク<br>死体の近く：通報</div></div>
<div id="meeting"><div class="box"><h2>緊急会議</h2><p id="meetingText">誰が怪しい？</p><div id="chatlog" class="chatbox"></div><div id="chat"><input id="chatInput" maxlength="40" placeholder="会議チャット…"><button id="chatSend">送信</button></div><div id="votes" class="votes"></div><button id="skip">投票をスキップ</button></div></div>
<div id="end"><div class="box"><h2 id="endTitle"></h2><p id="endText"></p><button onclick="location.reload()">もう一度プレイ</button></div></div>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,d=1,drag=false,last={x:0,y:0},meeting=false,ended=false,killCooldown=0,aiTimer=0,sabotage=false,sabLeft=0,vented=false,chatMessages=[];
const player={x:0,y:0,color:'#36a9df',alive:true};
const tasks=[[-380,-190,'通信'],[-80,-220,'電力'],[300,-140,'酸素'],[-280,180,'エンジン'],[220,180,'航法']];
let done=0;
const npcs=[
{id:1,name:'レッド',x:-170,y:-40,color:'#ef4b4b',role:'impostor',alive:true,target:null},
{id:2,name:'イエロー',x:150,y:-20,color:'#f2c94c',role:'crew',alive:true,target:null},
{id:3,name:'パープル',x:-40,y:110,color:'#a66cff',role:'crew',alive:true,target:null},
{id:4,name:'グリーン',x:360,y:100,color:'#35c978',role:'crew',alive:true,target:null},
{id:5,name:'オレンジ',x:-350,y:60,color:'#ff7c3e',role:'crew',alive:true,target:null},
{id:6,name:'シアン',x:280,y:40,color:'#45d8d0',role:'impostor',alive:true,target:null}
];
let bodies=[];
let cam={x:0,y:0};
const vents=[[-390,-120],[-40,-120],[330,-120],[-300,120],[120,120],[390,170]];
const sabotageTargets=[['通信',-380,-190],['電力',-80,-220],['酸素',300,-140]];
function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function sx(a){return a-cam.x+W/2}function sy(a){return a-cam.y+H/2}function rr(px,py,w,h,r,f){x.fillStyle=f;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function person(q,label=true){
 const px=sx(q.x),py=sy(q.y);x.save();x.translate(px,py);
 x.fillStyle='#111c22';x.beginPath();x.ellipse(0,25,27,10,0,0,7);x.fill();
 x.fillStyle=q.color;x.beginPath();x.moveTo(-22,15);x.lineTo(-18,-17);x.quadraticCurveTo(-15,-38,0,-42);x.quadraticCurveTo(15,-38,18,-17);x.lineTo(22,15);x.quadraticCurveTo(10,25,0,24);x.quadraticCurveTo(-10,25,-22,15);x.fill();
 x.fillStyle='#07151d';x.beginPath();x.ellipse(0,-29,16,12,0,0,7);x.fill();x.fillStyle='#31596a';x.beginPath();x.ellipse(-3,-32,11,5,0,0,7);x.fill();
 x.globalAlpha=.3;x.fillStyle='#d5f6ff';x.beginPath();x.ellipse(-6,-35,6,2,0,0,7);x.fill();x.globalAlpha=1;
 x.fillStyle='#26343b';x.fillRect(-28,-8,7,25);x.fillRect(21,-8,7,25);x.fillRect(-15,12,11,14);x.fillRect(4,12,11,14);x.restore();
 if(label){x.fillStyle='#fff';x.font='bold 12px system-ui';x.textAlign='center';x.fillText(q.name||'YOU',px,py+48)}
}
function terminal(t){let px=sx(t[0]),py=sy(t[1]);rr(px-22,py-22,44,44,9,'#1388c3');x.fillStyle='#d8f8ff';x.fillRect(px-12,py-8,24,16);x.fillStyle='#14749d';x.fillRect(px-7,py-4,14,3)}
function draw(){
 x.clearRect(0,0,W,H);x.fillStyle='#061018';x.fillRect(0,0,W,H);
 rr(sx(-520),sy(-310),1040,620,40,'#14242c');rr(sx(-490),sy(-280),980,560,30,'#263943');
 [[-450,-250,250,190],[-170,-250,300,190],[160,-250,300,190],[-450,-30,300,260],[-110,-30,300,260],[230,-30,230,260]].forEach(r=>{rr(sx(r[0]),sy(r[1]),r[2],r[3],20,'#1a2a33');x.strokeStyle='#405864';x.lineWidth=3;x.stroke()});
 tasks.forEach((t,i)=>{if(i>=done)terminal(t)}); vents.forEach((v,i)=>{let px=sx(v[0]),py=sy(v[1]);x.beginPath();x.ellipse(px,py,28,14,0,0,7);x.fillStyle='#111b20';x.fill();x.strokeStyle='#667983';x.lineWidth=3;x.stroke();if(i===0&&sabotage){x.fillStyle='#ff5050';x.globalAlpha=.55;x.beginPath();x.arc(px,py,34,0,7);x.fill();x.globalAlpha=1}});
 npcs.forEach(q=>{if(q.alive)person(q)});bodies.forEach(q=>{x.fillStyle='#7d252d';x.beginPath();x.arc(sx(q.x),sy(q.y),15,0,7);x.fill();x.fillStyle='#ff9a9a';x.fillRect(sx(q.x)-4,sy(q.y)-3,8,6)});
 if(player.alive)person({...player,name:'YOU'});
}
function distXY(a,b){return Math.hypot(a.x-b[0],a.y-b[1])}
function setLog(s){document.getElementById('log').textContent=s}
function end(title,text){ended=true;document.getElementById('endTitle').textContent=title;document.getElementById('endText').textContent=text;document.getElementById('end').style.display='flex'}
function kill(q){q.alive=false;bodies.push({x:q.x,y:q.y});setLog(q.name+'が倒れている…');}
function closestBody(){let b=null,bd=999;for(const q of bodies){let z=Math.hypot(player.x-q.x,player.y-q.y);if(z<bd){bd=z;b=q}}return bd<70?b:null}
function checkWin(){if(done>=tasks.length){end('CREW WIN!','全タスク完了！');return true}if(npcs.filter(q=>q.alive&&q.role==='crew').length===0){end('IMPOSTOR WIN!','インポスターがクルーを上回った！');return true}return false}
function renderChat(){const el=document.getElementById('chatlog');el.innerHTML=chatMessages.map(m=>'<div class="chatline"><b>'+m.n+'</b>：'+m.t+'</div>').join('');el.scrollTop=el.scrollHeight}
function openMeeting(reason='会議が始まりました。'){
 if(ended)return;meeting=true;document.getElementById('meetingText').textContent=reason;document.getElementById('meeting').style.display='flex';renderChat();const v=document.getElementById('votes');v.innerHTML='';
 const people=[...npcs.filter(q=>q.alive),...(player.alive?[{id:0,name:'YOU',color:player.color,role:'crew',alive:true}]:[])];
 people.forEach(q=>{let b=document.createElement('button');b.textContent=q.name;b.onclick=()=>vote(q.id);v.appendChild(b)});
}
function vote(id){
 const alive=npcs.filter(q=>q.alive);let target=npcs.find(q=>q.id===id);
 document.getElementById('meeting').style.display='none';meeting=false;
 if(target){kill(target);setLog(target.name+'が追放された。');if(target.role==='impostor'){end('CREW WIN!','インポスターを見つけた！');return}}
 else setLog('投票はスキップされた。');
 checkWin();
 setTimeout(()=>setLog('会議終了。クルーは再び行動開始。'),650);
}
document.getElementById('report').onclick=()=>{if(closestBody())openMeeting('死体が通報されました。');else setLog('近くに通報できる死体がありません。')};
document.getElementById('meetingBtn').onclick=()=>openMeeting('緊急会議が招集されました。');
document.getElementById('skip').onclick=()=>{document.getElementById('meeting').style.display='none';meeting=false;setLog('投票をスキップしました。')};
document.getElementById('chatSend').onclick=()=>{const input=document.getElementById('chatInput');if(input.value.trim()){chatMessages.push({n:'YOU',t:input.value.trim()});input.value='';renderChat();setTimeout(()=>{if(meeting){const alive=npcs.filter(q=>q.alive);const q=alive[Math.floor(Math.random()*alive.length)];if(q){chatMessages.push({n:q.name,t:['私は怪しいと思う人がいる。','さっき通信室にいたよ。','誰かベントを見た？','証拠を確認しよう。'][Math.floor(Math.random()*4)]});renderChat()}}},500)}};
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('chatSend').click()});
function sabotageNow(){if(sabotage||ended)return;sabotage=true;sabLeft=20;document.getElementById('sabotage').style.display='block';setLog('インポスターがサボタージュを発生させた！');}
function repairSabotage(){if(!sabotage)return;sabotage=false;sabLeft=0;document.getElementById('sabotage').style.display='none';setLog('サボタージュを解除した！');}
function useVent(){if(ended||meeting)return;let near=vents.find(v=>Math.hypot(player.x-v[0],player.y-v[1])<55);if(near){vented=!vented;setLog(vented?'ベントに隠れた。':'ベントから出た。');}else setLog('近くにベントがありません。');}
document.getElementById('ventBtn').onclick=useVent;
document.getElementById('sabotage').onclick=repairSabotage;
function moveAI(){
 for(const q of npcs){if(!q.alive)continue;
  if(q.role==='impostor'){
   if(Math.random()<0.002)sabotageNow();
   let target=npcs.find(z=>z.alive&&z.role==='crew'&&Math.hypot(z.x-q.x,z.y-q.y)<260);
   if(target){let dx=target.x-q.x,dy=target.y-q.y,L=Math.hypot(dx,dy)||1;q.x+=dx/L*.75;q.y+=dy/L*.75;
    if(Math.hypot(q.x-target.x,q.y-target.y)<34){kill(target);q.x-=8;setLog('誰かがいなくなった…');}
   }else{q.x+=Math.sin(Date.now()/900+q.id)*.5;q.y+=Math.cos(Date.now()/1000+q.id)*.5}
  }else{
   let t=tasks[Math.min(done,tasks.length-1)];let dx=t[0]-q.x,dy=t[1]-q.y,L=Math.hypot(dx,dy)||1;q.x+=dx/L*.5;q.y+=dy/L*.5;
  }
 }
}
function update(){
 if(!ended&&!meeting&&player.alive){
  if(sabotage){if(aiTimer%60===0){sabLeft--;document.getElementById('sabTime').textContent=sabLeft}if(sabLeft<=0){end('IMPOSTOR WIN!','サボタージュを止められなかった！');return}}
  if(sabotage&&tasks.some(t=>Math.hypot(player.x-t[0],player.y-t[1])<48))repairSabotage();
  if(aiTimer++%15===0)moveAI();
  if(killCooldown>0)killCooldown--;
  if(done<tasks.length&&distXY(player,tasks[done])<52){done++;document.getElementById('status').textContent='タスク '+done+' / '+tasks.length;document.getElementById('fill').style.width=(done/tasks.length*100)+'%';setLog(tasks[done-1][2]+'タスク完了！');checkWin()}
  let imp=npcs.find(q=>q.role==='impostor'&&q.alive);if(!vented&&imp&&Math.hypot(imp.x-player.x,imp.y-player.y)<35&&killCooldown===0){player.alive=false;end('IMPOSTOR WIN!','インポスターに捕まった！')}
 }
 draw();requestAnimationFrame(update)
}
c.addEventListener('pointerdown',e=>{if(ended||meeting)return;drag=true;last={x:e.clientX,y:e.clientY}});
c.addEventListener('pointermove',e=>{if(!drag||!player.alive)return;let dx=e.clientX-last.x,dy=e.clientY-last.y;player.x=Math.max(-450,Math.min(450,player.x+dx*.9));player.y=Math.max(-250,Math.min(250,player.y+dy*.9));cam.x=player.x;cam.y=player.y;last={x:e.clientX,y:e.clientY}});
c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
update();
</script></body></html>
